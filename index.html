<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    touch-action: none;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
}

.screen.active {
    display: block;
}


/* =========================
   開始畫面
========================= */

#title {
    background: black;
    color: white;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;
}

#title h1 {
    font-size: clamp(45px, 13vw, 90px);
    font-weight: 300;
    letter-spacing: 8px;
}

.warning {
    width: 90%;
    max-width: 600px;

    color: #ddd;

    line-height: 1.8;

    font-size: 14px;
}

.startButton {

    margin-top: 20px;

    padding: 14px 28px;

    border: 1px solid white;

    background: transparent;

    color: white;

    font-size: 17px;
}


/* =========================
   第一章
========================= */

#chapter1 {
    background: #777;
}

#threeContainer {
    position: absolute;
    inset: 0;
}


/* =========================
   提示
========================= */

#hint {

    position: absolute;

    top: 18px;

    left: 50%;

    transform: translateX(-50%);

    color: white;

    background: rgba(0,0,0,.35);

    padding: 7px 12px;

    border-radius: 5px;

    font-size: 13px;

    z-index: 10;
}


/* =========================
   手機按鈕
========================= */

#controls {

    position: absolute;

    left: 15px;
    bottom: 20px;

    width: 180px;
    height: 120px;

    z-index: 20;
}

.control {

    position: absolute;

    width: 52px;
    height: 52px;

    display: flex;

    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.4);

    border: 1px solid rgba(255,255,255,.5);

    border-radius: 8px;

    color: white;

    font-size: 24px;

    user-select: none;
}

.forward {
    left: 64px;
    top: 0;
}

.left {
    left: 8px;
    top: 58px;
}

.back {
    left: 64px;
    top: 58px;
}

.right {
    left: 120px;
    top: 58px;
}

</style>
</head>


<body>


<div id="game">


<!-- =========================
     開始
========================= -->

<section id="title" class="screen active">

    <h1>Reality...?</h1>

    <div class="warning">

        <p>內容提示</p>

        <p>
        本作品包含心理恐怖、令人不安的聲音與視覺表現，
        以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
        部分內容可能涉及敏感議題。
        </p>

        <p>
        若你容易受到心理壓迫、強烈聲音或失真畫面的影響，
        請自行斟酌是否遊玩。
        </p>

        <p>
        你可以隨時離開遊戲。
        </p>

    </div>


    <button
        class="startButton"
        onclick="startGame()">

        開始你的旅程

    </button>

</section>



<!-- =========================
     第一章
========================= -->

<section
    id="chapter1"
    class="screen">


    <div id="threeContainer"></div>


    <div id="hint">

        👆 滑動畫面轉動視角

    </div>


    <div id="controls">

        <div
            class="control forward"
            data-move="forward">

            ↑

        </div>


        <div
            class="control left"
            data-move="left">

            ←

        </div>


        <div
            class="control back"
            data-move="back">

            ↓

        </div>


        <div
            class="control right"
            data-move="right">

            →

        </div>

    </div>


</section>


</div>



<!-- =========================
     Three.js
========================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>



<script>


let scene;

let camera;

let renderer;


let player = {

    x: 0,

    y: 2,

    z: 5

};


let yaw = 0;

let pitch = 0;


let movement = {

    forward: false,

    back: false,

    left: false,

    right: false

};



/* =================================
   開始遊戲
================================= */

function startGame() {


    document
        .getElementById("title")
        .classList.remove("active");


    document
        .getElementById("chapter1")
        .classList.add("active");


    create3D();

}



/* =================================
   建立 3D
================================= */

function create3D() {


    scene = new THREE.Scene();


    scene.background =
        new THREE.Color(0x777777);



    /* -------------------------------
       相機
    -------------------------------- */

    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100

        );


    camera.position.set(

        player.x,

        player.y,

        player.z

    );



    /* -------------------------------
       Renderer
    -------------------------------- */

    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    document
        .getElementById("threeContainer")
        .appendChild(
            renderer.domElement
        );



    /* =================================
       光
    ================================= */

    const ambient =
        new THREE.AmbientLight(

            0xffffff,

            1.5

        );


    scene.add(ambient);



    const light =
        new THREE.PointLight(

            0xffffff,

            10,

            40

        );


    light.position.set(

        0,

        8,

        0

    );


    scene.add(light);



    /* =================================
       房間
    ================================= */

    createRoom();



    /* =================================
       開始
    ================================= */

    animate();

}



/* =================================
   建立房間
================================= */

function createRoom() {


    /*
       房間尺寸

       寬 20
       高 10
       深 20
    */


    const W = 20;

    const H = 10;

    const D = 20;



    /* =================================
       地板
    ================================= */

    const floorMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x686868

        });


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                W,
                D

            ),

            floorMaterial

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y = 0;


    scene.add(floor);



    /* =================================
       天花板
    ================================= */

    const ceilingMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xdadada

        });


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                W,
                D

            ),

            ceilingMaterial

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y = H;


    scene.add(ceiling);



    /* =================================
       牆壁材質
    ================================= */

    const frontMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xbcbcbc,

            side:
                THREE.DoubleSide

        });


    const backMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xa5a5a5,

            side:
                THREE.DoubleSide

        });


    const leftMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x999999,

            side:
                THREE.DoubleSide

        });


    const rightMaterial =
        new THREE.MeshBasicMaterial({

            color: 0x8b8b8b,

            side:
                THREE.DoubleSide

        });



    /* =================================
       前牆
    ================================= */

    const front =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                W,
                H

            ),

            frontMaterial

        );


    front.position.set(

        0,

        H / 2,

        -D / 2

    );


    scene.add(front);



    /* =================================
       後牆
    ================================= */

    const back =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                W,
                H

            ),

            backMaterial

        );


    back.position.set(

        0,

        H / 2,

        D / 2

    );


    scene.add(back);



    /* =================================
       左牆
    ================================= */

    const left =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                D,
                H

            ),

            leftMaterial

        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(

        -W / 2,

        H / 2,

        0

    );


    scene.add(left);



    /* =================================
       右牆
    ================================= */

    const right =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                D,
                H

            ),

            rightMaterial

        );


    right.rotation.y =
        Math.PI / 2;


    right.position.set(

        W / 2,

        H / 2,

        0

    );


    scene.add(right);



    /* =================================
       房間邊框
    ================================= */

    const edgeMaterial =
        new THREE.LineBasicMaterial({

            color: 0x555555

        });


    /*
       用線把房間的
       八個角連起來
    */

    const edges =
        new THREE.LineSegments(

            new THREE.EdgesGeometry(

                new THREE.BoxGeometry(

                    W,
                    H,
                    D

                )

            ),

            edgeMaterial

        );


    edges.position.y =
        H / 2;


    scene.add(edges);


}



/* =================================
   玩家
================================= */

function updatePlayer() {


    const speed = 0.08;


    const forwardX =
        Math.sin(yaw);


    const forwardZ =
        -Math.cos(yaw);


    if(
        movement.forward
    ) {

        player.x +=
            forwardX * speed;

        player.z +=
            forwardZ * speed;

    }


    if(
        movement.back
    ) {

        player.x -=
            forwardX * speed;

        player.z -=
            forwardZ * speed;

    }


    if(
        movement.left
    ) {

        player.x -=
            Math.cos(yaw) * speed;

        player.z -=
            Math.sin(yaw) * speed;

    }


    if(
        movement.right
    ) {

        player.x +=
            Math.cos(yaw) * speed;

        player.z +=
            Math.sin(yaw) * speed;

    }


    /*
       不准穿牆
    */

    player.x =
        Math.max(

            -8,

            Math.min(
                8,
                player.x
            )

        );


    player.z =
        Math.max(

            -8,

            Math.min(
                8,
                player.z
            )

        );


    camera.position.set(

        player.x,

        player.y,

        player.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}



/* =================================
   手機滑動
================================= */

let touching = false;

let lastX = 0;

let lastY = 0;



function setupTouch() {


    const canvas =
        renderer.domElement;


    canvas.addEventListener(

        "touchstart",

        function(event) {


            touching = true;


            lastX =
                event.touches[0]
                .clientX;


            lastY =
                event.touches[0]
                .clientY;


        },

        {
            passive: false
        }

    );



    canvas.addEventListener(

        "touchmove",

        function(event) {


            if(!touching)
                return;


            event.preventDefault();


            const x =
                event.touches[0]
                .clientX;


            const y =
                event.touches[0]
                .clientY;


            const dx =
                x - lastX;


            const dy =
                y - lastY;


            yaw -=
                dx * 0.004;


            pitch -=
                dy * 0.004;


            pitch =
                Math.max(

                    -1.4,

                    Math.min(
                        1.4,
                        pitch
                    )

                );


            lastX = x;

            lastY = y;


        },

        {
            passive: false
        }

    );


    canvas.addEventListener(

        "touchend",

        function() {

            touching = false;

        }

    );

}



/* =================================
   按鈕
================================= */

function setupButtons() {


    document
        .querySelectorAll(".control")
        .forEach(

            function(button) {


                const direction =
                    button.dataset.move;


                button.addEventListener(

                    "touchstart",

                    function(event) {

                        event.preventDefault();

                        movement[
                            direction
                        ] = true;

                    }

                );


                button.addEventListener(

                    "touchend",

                    function(event) {

                        event.preventDefault();

                        movement[
                            direction
                        ] = false;

                    }

                );


            }

        );

}



/* =================================
   遊戲循環
================================= */

function animate() {


    requestAnimationFrame(
        animate
    );


    updatePlayer();


    renderer.render(

        scene,

        camera

    );

}



/* =================================
   螢幕尺寸
================================= */

window.addEventListener(

    "resize",

    function() {


        if(
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


    }

);

</script>

</body>
</html>
