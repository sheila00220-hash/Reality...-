<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>

<style>

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

}


#text {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(60px, 15vw, 130px);

    font-weight: 300;

    letter-spacing: 10px;

    white-space: nowrap;

}


.letter {

    display: inline-block;

    opacity: 0;

}

</style>

</head>


<body>


<div id="text"></div>


<script>


const text =
    document.getElementById("text");


const word =
    "Reality...?";


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }

    );

}


/* ==================================================
   新字顯現

   1% → 100%
   中間完全不閃
================================================== */

function revealLetter(letter) {

    return new Promise(

        function(resolve) {

            const duration =
                1200;

            const start =
                performance.now();


            function animate(now) {

                const progress =
                    Math.min(

                        (now - start) /
                        duration,

                        1

                    );


                /*
                   1%
                   ↓
                   2%
                   ↓
                   3%
                   ↓
                   ...
                   ↓
                   100%
                */

                letter.style.opacity =
                    0.01 +
                    (
                        0.99 *
                        progress
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}


/* ==================================================
   舊字開始忽隱忽現

   只有下一個字出現時才啟動
================================================== */

function startFlicker(letter) {


    async function flicker() {

        while (
            letter.isConnected
        ) {

            /*
               先保持穩定一段時間
            */

            await wait(

                900 +
                Math.random() * 1000

            );


            /*
               慢慢變暗

               不會完全消失
            */

            const low =
                0.68 +
                Math.random() * 0.18;


            const duration =
                700 +
                Math.random() * 500;


            letter.style.transition =
                `opacity ${duration}ms ease-in-out`;


            letter.style.opacity =
                low;


            await wait(
                duration
            );


            /*
               慢慢恢復
            */

            letter.style.opacity =
                "1";


            await wait(
                duration
            );

        }

    }


    flicker();

}


/* ==================================================
   主動畫
================================================== */

async function start() {


    /*
       開始前黑屏
    */

    await wait(
        1500
    );


    /*
       一個字一個字出現
    */

    for (
        let i = 0;

        i < word.length;

        i++
    ) {


        /*
           建立新字
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            word[i];


        /*
           新字從 1% 開始
        */

        letter.style.opacity =
            "0.01";


        text.appendChild(
            letter
        );


        /*
           =========================================
           從第二個字開始：

           舊字開始閃
           =========================================
        */

        if (
            i > 0
        ) {

            const oldLetters =
                text.querySelectorAll(
                    ".letter"
                );


            for (
                let j = 0;

                j <
                oldLetters.length - 1;

                j++
            ) {


                if (
                    !oldLetters[j]
                        .dataset
                        .flickering
                ) {


                    oldLetters[j]
                        .dataset
                        .flickering =
                        "true";


                    startFlicker(
                        oldLetters[j]
                    );

                }

            }

        }


        /*
           =========================================
           新字：

           1% → 100%

           新字自己不閃
           =========================================
        */

        await revealLetter(
            letter
        );


        /*
           字完成後停頓
        */

        await wait(
            1300
        );

    }


    /*
       =========================================
       Reality...? 完整出現
       =========================================
    */

    await wait(
        3500
    );


    /*
       =========================================
       瞬間消失
       =========================================
    */

    text.innerHTML =
        "";


    /*
       黑屏
    */

    await wait(
        4500
    );


    /*
       重新開始
    */

    start();

}


/* ==================================================
   啟動
================================================== */

start();

</script>

</body>

</html>
