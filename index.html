<script>

/* ==================================================
   Reality...? 標題動畫
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );

const titleWord =
    "Reality...?";

let titleRunning =
    true;


function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function random(min, max) {

    return (
        min +
        Math.random() *
        (max - min)
    );

}


function smoothstep(t) {

    return (
        t *
        t *
        (3 - 2 * t)
    );

}


function createTitleLetters() {

    titleText.innerHTML = "";

    const letters = [];


    for (
        let i = 0;
        i < titleWord.length;
        i++
    ) {

        const letter =
            document.createElement(
                "span"
            );

        letter.className =
            "titleLetter";

        letter.textContent =
            titleWord[i];

        letter.style.opacity =
            "0";

        titleText.appendChild(
            letter
        );

        letters.push(
            letter
        );

    }


    return letters;

}


function fadeInLetter(letter) {

    return new Promise(
        resolve => {

            const duration =
                random(
                    2400,
                    3000
                );

            const start =
                performance.now();


            function animate(now) {

                if (!titleRunning) {

                    resolve();

                    return;

                }


                const progress =
                    Math.min(

                        (
                            now -
                            start
                        ) /
                        duration,

                        1

                    );


                const eased =
                    smoothstep(
                        progress
                    );


                letter.style.opacity =
                    eased;


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );

}


function startIrregularBreathing(letter) {

    if (
        letter.dataset.breathing ===
        "true"
    )
        return;


    letter.dataset.breathing =
        "true";


    let state =
        "holdBright";


    let stateStart =
        performance.now();


    let stateDuration =
        random(
            1200,
            2600
        );


    let startOpacity =
        1;

    let targetOpacity =
        1;


    function chooseNextState() {

        const roll =
            Math.random();


        if (
            roll < 0.55
        ) {

            state =
                "fadeDown";

            startOpacity =
                1;

            targetOpacity =
                random(
                    0.22,
                    0.38
                );

            stateDuration =
                random(
                    2600,
                    4200
                );

        }

        else {

            state =
                "fadeUp";

            startOpacity =
                parseFloat(
                    letter.style.opacity
                ) || 0.3;

            targetOpacity =
                1;

            stateDuration =
                random(
                    2800,
                    4500
                );

        }


        stateStart =
            performance.now();

    }


    function animate(now) {

        if (!titleRunning)
            return;


        const elapsed =
            now -
            stateStart;


        const progress =
            Math.min(
                elapsed /
                stateDuration,
                1
            );


        if (
            state ===
            "holdBright"
        ) {

            letter.style.opacity =
                "1";

        }

        else if (
            state ===
            "fadeDown"
        ) {

            const eased =
                smoothstep(
                    progress
                );

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                eased;

        }

        else if (
            state ===
            "holdDark"
        ) {

            letter.style.opacity =
                targetOpacity;

        }

        else if (
            state ===
            "fadeUp"
        ) {

            const eased =
                smoothstep(
                    progress
                );

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                eased;

        }


        if (
            progress >= 1
        ) {

            if (
                state ===
                "holdBright"
            ) {

                chooseNextState();

            }

            else if (
                state ===
                "fadeDown"
            ) {

                state =
                    "holdDark";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        700,
                        2200
                    );

            }

            else if (
                state ===
                "holdDark"
            ) {

                state =
                    "fadeUp";

                stateStart =
                    performance.now();

                startOpacity =
                    parseFloat(
                        letter.style.opacity
                    );

                targetOpacity =
                    1;

                stateDuration =
                    random(
                        2800,
                        4500
                    );

            }

            else if (
                state ===
                "fadeUp"
            ) {

                state =
                    "holdBright";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        900,
                        3000
                    );

            }

        }


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


async function playTitleAnimation() {

    while (titleRunning) {

        const letters =
            createTitleLetters();


        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (!titleRunning)
                return;


            await fadeInLetter(
                letters[i]
            );


            if (!titleRunning)
                return;


            startIrregularBreathing(
                letters[i]
            );


            await wait(
                random(
                    500,
                    800
                )
            );

        }


        await wait(
            random(
                2900,
                3700
            )
        );


        if (!titleRunning)
            return;


        titleText.innerHTML =
            "";


        await wait(
            random(
                2800,
                4800
            )
        );

    }

}


playTitleAnimation();


/* ==================================================
   Three.js
================================================== */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let started =
    false;


/* ==================================================
   房間尺寸
================================================== */

const ROOM_WIDTH =
    14;

const ROOM_DEPTH =
    14;

const ROOM_HEIGHT =
    10;


/* ==================================================
   玩家
================================================== */

const player = {

    x: 0,

    y: 2,

    z: 4

};


/* ==================================================
   視角
================================================== */

let yaw =
    0;

let pitch =
    0;


/* ==================================================
   FOV
================================================== */

/*
   原本是 75。

   這個範圍：
   55 = 比較近
   75 = 原本
   95 = 更廣
*/

const MIN_FOV =
    55;

const MAX_FOV =
    95;

const DEFAULT_FOV =
    75;


/* ==================================================
   視角靈敏度
================================================== */

const LOOK_SENSITIVITY_X =
    0.0022;

const LOOK_SENSITIVITY_Y =
    0.0022;


/* ==================================================
   上下視角
================================================== */

const PITCH_LIMIT =
    1.0;


/* ==================================================
   移動
================================================== */

const movement = {

    forward: false,

    back: false,

    left: false,

    right: false

};


/* ==================================================
   開始
================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    if (started)
        return;


    started =
        true;


    titleRunning =
        false;


    stopAllMovement();


    document
        .getElementById(
            "title"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hint"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "controls"
        )
        .style.display =
        "block";


    createWorld();

}


/* ==================================================
   建立世界
================================================== */

function createWorld() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0xb0b0b0
        );


    camera =
        new THREE.PerspectiveCamera(

            DEFAULT_FOV,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100

        );


    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    const ambient =
        new THREE.AmbientLight(

            0xffffff,
            2

        );


    scene.add(
        ambient
    );


    createRoom();

    setupTouch();

    setupButtons();

    animate();

}


/* ==================================================
   建立房間
================================================== */

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x707070,

                side:
                    THREE.DoubleSide

            })

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    scene.add(
        floor
    );


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        H;


    scene.add(
        ceiling
    );


    const front =
        createWall(
            W,
            H,
            0xc2c2c2
        );


    front.position.set(

        0,
        H / 2,
        -D / 2

    );


    scene.add(
        front
    );


    const back =
        createWall(
            W,
            H,
            0xb7b7b7
        );


    back.position.set(

        0,
        H / 2,
        D / 2

    );


    scene.add(
        back
    );


    const left =
        createWall(
            D,
            H,
            0xaeaeae
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(

        -W / 2,
        H / 2,
        0

    );


    scene.add(
        left
    );


    const right =
        createWall(
            D,
            H,
            0xa6a6a6
        );


    right.rotation.y =
        Math.PI / 2;


    right.position.set(

        W / 2,
        H / 2,
        0

    );


    scene.add(
        right
    );


    createRoomEdges(
        W,
        H,
        D
    );

}


/* ==================================================
   牆
================================================== */

function createWall(
    width,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            color:
                color,

            side:
                THREE.DoubleSide

        })

    );

}


/* ==================================================
   房間邊線
================================================== */

function createRoomEdges(
    W,
    H,
    D
) {

    const geometry =
        new THREE.BoxGeometry(
            W,
            H,
            D
        );


    const edges =
        new THREE.EdgesGeometry(
            geometry
        );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0x666666,

            transparent:
                true,

            opacity:
                0.45

        });


    const lines =
        new THREE.LineSegments(
            edges,
            material
        );


    lines.position.y =
        H / 2;


    scene.add(
        lines
    );

}


/* ==================================================
   玩家移動
================================================== */

function updatePlayer() {

    if (!camera)
        return;


    const speed =
        0.08;


    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    let moveX =
        0;

    let moveZ =
        0;


    if (
        movement.forward
    ) {

        moveX +=
            forwardX;

        moveZ +=
            forwardZ;

    }


    if (
        movement.back
    ) {

        moveX -=
            forwardX;

        moveZ -=
            forwardZ;

    }


    if (
        movement.left
    ) {

        moveX -=
            Math.cos(yaw);

        moveZ -=
            Math.sin(yaw);

    }


    if (
        movement.right
    ) {

        moveX +=
            Math.cos(yaw);

        moveZ +=
            Math.sin(yaw);

    }


    const length =
        Math.sqrt(
            moveX * moveX +
            moveZ * moveZ
        );


    if (
        length > 0
    ) {

        moveX =
            moveX /
            length *
            speed;

        moveZ =
            moveZ /
            length *
            speed;

    }


    /*
       保留目前牆體系統。
    */

    const limitX =
        ROOM_WIDTH / 2 -
        0.08;

    const limitZ =
        ROOM_DEPTH / 2 -
        0.08;


    player.x =
        Math.max(
            -limitX,
            Math.min(
                limitX,
                player.x + moveX
            )
        );


    player.z =
        Math.max(
            -limitZ,
            Math.min(
                limitZ,
                player.z + moveZ
            )
        );


    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}


/* ==================================================
   ★ 單指／雙指觸控系統
================================================== */

const activeTouches =
    new Map();


let touchMode =
    "none";


let lookPointerId =
    null;


let lastLookX =
    0;


let lastLookY =
    0;


let previousPinchDistance =
    null;


/* ==================================================
   計算兩指距離
================================================== */

function getPinchDistance() {

    const points =
        Array.from(
            activeTouches.values()
        );


    if (
        points.length < 2
    )
        return null;


    const a =
        points[0];

    const b =
        points[1];


    const dx =
        b.x -
        a.x;

    const dy =
        b.y -
        a.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* ==================================================
   進入雙指模式
================================================== */

function enterPinchMode() {

    touchMode =
        "pinch";


    /*
       完全停止單指視角。
    */

    lookPointerId =
        null;


    /*
       記錄目前兩指距離。

       不在進入瞬間改 FOV，
       避免突然跳一下。
    */

    previousPinchDistance =
        getPinchDistance();

}


/* ==================================================
   回到單指模式
================================================== */

function enterLookMode() {

    const points =
        Array.from(
            activeTouches.entries()
        );


    if (
        points.length !== 1
    ) {

        touchMode =
            "none";

        lookPointerId =
            null;

        return;

    }


    const [
        pointerId,
        point
    ] =
        points[0];


    touchMode =
        "look";


    lookPointerId =
        pointerId;


    /*
       ★ 重新建立座標。

       不使用雙指期間的舊座標，
       避免恢復單指時鏡頭突然跳動。
    */

    lastLookX =
        point.x;

    lastLookY =
        point.y;


    previousPinchDistance =
        null;

}


/* ==================================================
   Touch 系統
================================================== */

function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.style.touchAction =
        "none";


    canvas.addEventListener(

        "pointerdown",

        function(event) {

            /*
               只接受觸控。

               滑鼠仍然可以使用
               左鍵拖動視角。
            */

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (
                    event.button !== 0
                )
                    return;

                looking =
                    true;

                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

                return;

            }


            /*
               手機觸控
            */

            event.preventDefault();


            activeTouches.set(

                event.pointerId,

                {
                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );


            const count =
                activeTouches.size;


            if (
                count === 1
            ) {

                /*
                   第一根手指：
                   單指視角
                */

                touchMode =
                    "look";


                lookPointerId =
                    event.pointerId;


                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

            }

            else if (
                count >= 2
            ) {

                /*
                   第二根手指加入：
                   立刻進入雙指
                */

                enterPinchMode();

            }

        },

        {
            passive:
                false
        }

    );


    canvas.addEventListener(

        "pointermove",

        function(event) {

            /*
               滑鼠視角
            */

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (
                    !looking
                )
                    return;


                const dx =
                    event.clientX -
                    lastLookX;


                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(
                        -PITCH_LIMIT,
                        Math.min(
                            PITCH_LIMIT,
                            pitch
                        )
                    );


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;


                event.preventDefault();

                return;

            }


            /*
               手機觸控
            */

            if (
                !activeTouches.has(
                    event.pointerId
                )
            )
                return;


            event.preventDefault();


            activeTouches.set(

                event.pointerId,

                {
                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );


            /*
               ==================================
               雙指模式
               ==================================
            */

            if (
                touchMode ===
                "pinch"
            ) {

                const distance =
                    getPinchDistance();


                if (
                    distance !==
                    null &&
                    previousPinchDistance !==
                    null
                ) {

                    const delta =
                        distance -
                        previousPinchDistance;


                    /*
                       手指距離增加
                       → FOV 增加
                       → 看得更廣

                       手指距離減少
                       → FOV 減少
                       → 看得更近
                    */

                    camera.fov +=
                        delta *
                        0.08;


                    camera.fov =
                        Math.max(

                            MIN_FOV,

                            Math.min(
                                MAX_FOV,
                                camera.fov
                            )

                        );


                    camera.updateProjectionMatrix();

                }


                previousPinchDistance =
                    distance;


                return;

            }


            /*
               ==================================
               單指視角
               ==================================
            */

            if (
                touchMode ===
                "look" &&
                event.pointerId ===
                lookPointerId
            ) {

                const dx =
                    event.clientX -
                    lastLookX;


                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(

                        -PITCH_LIMIT,

                        Math.min(
                            PITCH_LIMIT,
                            pitch
                        )

                    );


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;

            }

        },

        {
            passive:
                false
        }

    );


    function pointerEnd(event) {

        /*
           滑鼠
        */

        if (
            event.pointerType ===
            "mouse"
        ) {

            looking =
                false;

            return;

        }


        /*
           手機
        */

        if (
            !activeTouches.has(
                event.pointerId
            )
        )
            return;


        activeTouches.delete(
            event.pointerId
        );


        const count =
            activeTouches.size;


        /*
           沒有手指
        */

        if (
            count === 0
        ) {

            touchMode =
                "none";

            lookPointerId =
                null;

            previousPinchDistance =
                null;

            return;

        }


        /*
           雙指 → 單指
        */

        if (
            count === 1
        ) {

            enterLookMode();

        }

    }


    canvas.addEventListener(
        "pointerup",
        pointerEnd
    );


    canvas.addEventListener(
        "pointercancel",
        pointerEnd
    );

}


/* ==================================================
   滑鼠狀態
================================================== */

let looking =
    false;


/* ==================================================
   移動按鍵
================================================== */

function setupButtons() {

    const buttons =
        document.querySelectorAll(
            ".control"
        );


    buttons.forEach(

        function(button) {

            const direction =
                button.dataset.direction;


            button.addEventListener(

                "pointerdown",

                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    movement[
                        direction
                    ] = true;


                    button.classList.add(
                        "active"
                    );

                },

                {
                    passive:
                        false
                }

            );


            button.addEventListener(

                "pointerup",

                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    movement[
                        direction
                    ] = false;


                    button.classList.remove(
                        "active"
                    );

                },

                {
                    passive:
                        false
                }

            );


            button.addEventListener(

                "pointercancel",

                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    movement[
                        direction
                    ] = false;


                    button.classList.remove(
                        "active"
                    );

                },

                {
                    passive:
                        false
                }

            );

        }

    );


    window.addEventListener(

        "pointerup",

        function() {

            stopAllMovement();

        }

    );


    window.addEventListener(

        "pointercancel",

        function() {

            stopAllMovement();

        }

    );

}


/* ==================================================
   停止移動
================================================== */

function stopAllMovement() {

    movement.forward =
        false;

    movement.back =
        false;

    movement.left =
        false;

    movement.right =
        false;


    document
        .querySelectorAll(
            ".control"
        )
        .forEach(

            function(button) {

                button.classList.remove(
                    "active"
                );

            }

        );

}


/* ==================================================
   遊戲循環
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        started
    ) {

        updatePlayer();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* ==================================================
   螢幕尺寸
================================================== */

window.addEventListener(

    "resize",

    function() {

        if (
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>
