<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

/* ==================================================
   基本設定
================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ==================================================
   開始畫面
================================================== */

#title {

    position: fixed;

    inset: 0;

    background: #000;

    color: #fff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

}


/* ==================================================
   Reality...? 標題
================================================== */

#titleText {

    margin: 0;

    min-height: 1em;

    width: 95%;

    text-align: center;

    font-size:
        clamp(55px, 13vw, 120px);

    font-weight: 300;

    letter-spacing:
        clamp(5px, 1.4vw, 16px);

    line-height: 1;

    white-space: nowrap;

    color: #f5f5f5;


    /*
       初始狀態

       完全透明
       稍微模糊
    */

    opacity: 0;

    filter:
        blur(10px);


    /*
       浮現速度

       故意放慢
    */

    transition:

        opacity 1.8s ease,

        filter 1.8s ease;

}


/* ==================================================
   標題浮現完成
================================================== */

#titleText.visible {

    opacity: 1;

    filter:
        blur(0);

}


/* ==================================================
   內容提示
================================================== */

.warning {

    width: 88%;

    max-width: 600px;

    margin-top: 60px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;

}


</style>

</head>


<body>


<!-- ==================================================
     開始頁
================================================== -->

<div id="title">


    <h1 id="titleText"></h1>


    <div class="warning">

        <p>
            內容提示
        </p>


        <p>
            本作品包含心理恐怖、
            令人不安的聲音與視覺表現，
            以及可能引起部分玩家不適的成人向主題。
        </p>


        <p>
            部分內容可能涉及敏感議題。
        </p>


        <p>
            若你容易受到心理壓迫、
            強烈聲音或失真畫面的影響，
            請自行斟酌是否遊玩。
        </p>


        <p>
            你可以隨時離開遊戲。
        </p>

    </div>


</div>



<script>

/* ==================================================
   Reality...? 動畫
================================================== */


const titleText =
    document.getElementById(
        "titleText"
    );


/*
   每一個階段的文字
*/

const titleSteps = [

    "R",

    "Re",

    "Rea",

    "Real",

    "Reali",

    "Realit",

    "Reality",

    "Reality...?"

];



/* ==================================================
   浮現一段文字
================================================== */

function fadeInTitle(text) {


    /*
       先確保上一段消失
    */

    titleText.classList.remove(
        "visible"
    );


    /*
       換文字
    */

    titleText.textContent =
        text;


    /*
       等瀏覽器完成文字更新
    */

    requestAnimationFrame(

        function() {

            requestAnimationFrame(

                function() {

                    titleText.classList.add(
                        "visible"
                    );

                }

            );

        }

    );

}



/* ==================================================
   主動畫
================================================== */

function playTitleAnimation() {


    let index = 0;



    function next() {


        /*
           顯示目前文字
        */

        fadeInTitle(
            titleSteps[index]
        );


        index++;



        /* =========================
           還沒有到 Reality...?
        ========================= */

        if (
            index <
            titleSteps.length
        ) {


            /*
               每一段慢慢浮現後

               再停留一小段時間

               然後進下一段
            */

            const waitTime =
                1900 +
                Math.random() * 500;


            setTimeout(

                next,

                waitTime

            );


            return;

        }



        /* =========================
           Reality...? 已經完整出現
        ========================= */


        /*
           完整標題停留

           1.8 ～ 3.5 秒
        */

        const stayTime =
            1800 +
            Math.random() * 1700;


        setTimeout(

            function() {


                /*
                   =====================
                   瞬間消失
                   =====================
                */

                titleText.classList.remove(
                    "visible"
                );


                /*
                   不做淡出

                   等一點點時間後
                   直接清空
                */

                setTimeout(

                    function() {


                        titleText.textContent =
                            "";


                    },

                    100

                );


                /*
                   黑屏

                   3 ～ 5 秒
                */

                const blackTime =
                    3000 +
                    Math.random() * 2000;


                setTimeout(

                    function() {


                        /*
                           重新開始
                        */

                        next = null;

                        playTitleAnimation();


                    },

                    blackTime

                );


            },

            stayTime

        );

    }



    next();

}



/* ==================================================
   開始
================================================== */


/*
   開場先黑屏一秒
*/

setTimeout(

    function() {

        playTitleAnimation();

    },

    1000

);


</script>


</body>

</html>
