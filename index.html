<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

}


#text {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(60px, 15vw, 130px);

    font-weight: 300;

    letter-spacing: 10px;

    white-space: nowrap;

}


.letter {

    display: inline-block;

    opacity: 0;

}

</style>

</head>


<body>


<div id="text"></div>



<script>


const text =
    document.getElementById("text");


const word =
    "Reality...?";


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }

    );

}



/* ==================================================
   新字顯現
================================================== */

function revealLetter(
    letter,
    oldLetters
) {

    return new Promise(

        function(resolve) {


            /*
               新字顯現速度
            */

            const duration =
                1400;


            const start =
                performance.now();



            function animate(now) {


                const progress =
                    Math.min(

                        (now - start) /
                        duration,

                        1

                    );


                /*
                   ==================================
                   新字

                   1% → 100%

                   永遠只增加
                   ==================================
                */

                letter.style.opacity =
                    0.01 +
                    (
                        0.99 *
                        progress
                    );



                /*
                   ==================================
                   舊字

                   明顯但連續的漸變
                   ==================================
                */

                oldLetters.forEach(

                    function(
                        oldLetter,
                        index
                    ) {


                        /*
                           不同字有不同相位

                           避免全部一起變
                        */

                        const phase =
                            index *
                            1.4;



                        /*
                           慢慢上下波動

                           sin 範圍：
                           -1 ～ +1
                        */

                        const wave =
                            Math.sin(

                                progress *
                                Math.PI *
                                2.4
                                +
                                phase

                            );



                        /*
                           透明度範圍：

                           最亮：約 100%

                           最暗：約 55%
                        */

                        const opacity =
                            0.775 +
                            (
                                wave *
                                0.225
                            );



                        oldLetter.style.opacity =
                            opacity;

                    }

                );



                if (
                    progress < 1
                ) {


                    requestAnimationFrame(
                        animate
                    );


                }

                else {


                    /*
                       新字固定
                    */

                    letter.style.opacity =
                        "1";



                    /*
                       舊字回到完整

                       但不是突然跳
                    */

                    oldLetters.forEach(

                        function(
                            oldLetter
                        ) {


                            oldLetter.style.transition =
                                "opacity 500ms ease";


                            oldLetter.style.opacity =
                                "1";

                        }

                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}



/* ==================================================
   主動畫
================================================== */

async function start() {


    /*
       開始黑屏
    */

    await wait(
        1500
    );



    /*
       一個字一個字出現
    */

    for (
        let i = 0;

        i < word.length;

        i++
    ) {


        /*
           建立新字
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            word[i];


        /*
           新字從 1%
        */

        letter.style.opacity =
            "0.01";


        text.appendChild(
            letter
        );



        /*
           找出舊字
        */

        const oldLetters =
            Array.from(
                text.querySelectorAll(
                    ".letter"
                )
            ).slice(
                0,
                -1
            );



        /*
           新字顯現

           舊字同時漸變
        */

        await revealLetter(

            letter,

            oldLetters

        );



        /*
           每個字之間停頓
        */

        await wait(
            1300
        );

    }



    /*
       ==========================================
       完整 Reality...?
       ==========================================
    */

    await wait(
        4000
    );



    /*
       ==========================================
       瞬間消失
       ==========================================
    */

    text.innerHTML =
        "";



    /*
       黑屏
    */

    await wait(
        4500
    );



    /*
       重播
    */

    start();

}



/* ==================================================
   啟動
================================================== */

start();

</script>

</body>

</html>
