<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ==================================================
   開始畫面
================================================== */

#title {

    position: fixed;

    inset: 0;

    background: black;

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

}


/* ==================================================
   標題
================================================== */

#titleText {

    margin: 0;

    width: 95%;

    min-height: 1.1em;

    text-align: center;

    font-size:
        clamp(55px, 13vw, 120px);

    font-weight: 300;

    letter-spacing:
        clamp(5px, 1.4vw, 16px);

    line-height: 1;

    white-space: nowrap;

    color: #f5f5f5;

    /*
       初始透明
    */

    opacity: 0;

}


/* ==================================================
   內容提示
================================================== */

.warning {

    width: 88%;

    max-width: 600px;

    margin-top: 60px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;

}

</style>

</head>


<body>


<div id="title">


    <h1 id="titleText"></h1>


    <div class="warning">

        <p>
            內容提示
        </p>

        <p>
            本作品包含心理恐怖、
            令人不安的聲音與視覺表現，
            以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
            部分內容可能涉及敏感議題。
        </p>

        <p>
            若你容易受到心理壓迫、
            強烈聲音或失真畫面的影響，
            請自行斟酌是否遊玩。
        </p>

        <p>
            你可以隨時離開遊戲。
        </p>

    </div>


</div>



<script>


/* ==================================================
   標題
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );


const titleSteps = [

    "R",

    "Re",

    "Rea",

    "Real",

    "Reali",

    "Realit",

    "Reality",

    "Reality...?"

];



/* ==================================================
   每一個字串：
   從透明 → 慢慢出現
================================================== */

function showStep(
    text
) {


    return new Promise(

        function(resolve) {


            /*
               先清空
            */

            titleText.textContent =
                "";


            titleText.style.opacity =
                "0";


            /*
               先讓黑屏保持一下

               避免文字瞬間替換
            */

            setTimeout(

                function() {


                    /*
                       換成新的文字
                    */

                    titleText.textContent =
                        text;


                    /*
                       強制瀏覽器
                       重新計算樣式
                    */

                    void titleText.offsetWidth;


                    /*
                       從 0 慢慢增加
                    */

                    let opacity = 0;


                    const fadeInTime =
                        2500;


                    const startTime =
                        performance.now();



                    function fade(
                        currentTime
                    ) {


                        const elapsed =
                            currentTime -
                            startTime;


                        const progress =
                            Math.min(

                                elapsed /
                                fadeInTime,

                                1

                            );


                        /*
                           ease-in-out

                           開始慢
                           中間變快
                           最後再慢下來
                        */

                        const eased =
                            progress *
                            progress *
                            (
                                3 -
                                2 *
                                progress
                            );


                        opacity =
                            eased;


                        titleText.style.opacity =
                            opacity;



                        if (
                            progress <
                            1
                        ) {


                            requestAnimationFrame(
                                fade
                            );


                        }

                        else {


                            titleText.style.opacity =
                                "1";


                            /*
                               完整顯現後
                               停留 1.5 秒
                            */

                            setTimeout(

                                resolve,

                                1500

                            );

                        }

                    }


                    requestAnimationFrame(
                        fade
                    );


                },

                800

            );

        }

    );

}



/* ==================================================
   主動畫
================================================== */

async function startTitle() {


    /*
       一個一個慢慢出現
    */

    for (
        let i = 0;

        i <
        titleSteps.length;

        i++
    ) {


        await showStep(

            titleSteps[i]

        );

    }



    /* ==================================================
       Reality...? 完整出現
    ================================================== */


    /*
       再停留一段時間

       2 ～ 4 秒
    */

    await new Promise(

        function(resolve) {

            setTimeout(

                resolve,

                2000 +
                Math.random() * 2000

            );

        }

    );



    /* ==================================================
       瞬間消失
    ================================================== */


    titleText.style.opacity =
        "0";


    titleText.textContent =
        "";



    /* ==================================================
       黑屏
    ================================================== */


    await new Promise(

        function(resolve) {

            setTimeout(

                resolve,

                4000 +
                Math.random() * 2000

            );

        }

    );



    /*
       重新開始
    */

    startTitle();

}



/* ==================================================
   啟動
================================================== */

setTimeout(

    function() {

        startTitle();

    },

    1000

);


</script>


</body>

</html>
