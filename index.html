<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #777;

    touch-action: none;

    font-family:
        Arial,
        "Noto Sans TC",
        sans-serif;
}

#game {

    position: relative;

    width: 100vw;

    height: 100vh;
}


/* ==================================================
   開始畫面
================================================== */

#title {

    position: absolute;

    inset: 0;

    background: #000;

    color: #fff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 100;

    overflow: hidden;
}


/* ==================================================
   標題
================================================== */

#title h1 {

    margin: 0;

    width: 95%;

    text-align: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(50px, 13vw, 104px);

    font-weight: 300;

    letter-spacing: 0;

    line-height: 1;

    white-space: nowrap;

    color: #f5f5f5;
}


.titleLetter {

    display: inline-block;

    opacity: 0;

    margin: 0;

    padding: 0;
}


/* ==================================================
   警告
================================================== */

.warning {

    width: 88%;

    max-width: 600px;

    margin-top: 55px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;
}


/* ==================================================
   開始按鈕
================================================== */

.startButton {

    margin-top: 25px;

    padding: 14px 30px;

    background: transparent;

    border: 1px solid #aaa;

    color: white;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    touch-action: manipulation;
}


.startButton:active {

    background: white;

    color: black;
}


/* ==================================================
   3D 房間
================================================== */

#threeContainer {

    position: absolute;

    inset: 0;
}


/* ==================================================
   提示
================================================== */

#hint {

    position: absolute;

    top: 15px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    color: white;

    background:
        rgba(0,0,0,.35);

    padding: 7px 12px;

    border-radius: 5px;

    font-size: 13px;
}


/* ==================================================
   手機控制
================================================== */

#controls {

    position: absolute;

    left: 15px;

    bottom: 20px;

    width: 180px;

    height: 120px;

    z-index: 20;
}


.control {

    position: absolute;

    width: 52px;

    height: 52px;

    display: flex;

    justify-content: center;

    align-items: center;

    color: white;

    background:
        rgba(0,0,0,.35);

    border:
        1px solid
        rgba(255,255,255,.5);

    border-radius: 8px;

    font-size: 24px;

    user-select: none;

    touch-action: none;
}


.forward {

    left: 64px;

    top: 0;
}


.left {

    left: 8px;

    top: 58px;
}


.back {

    left: 64px;

    top: 58px;
}


.right {

    left: 120px;

    top: 58px;
}

</style>

</head>


<body>

<div id="game">


<!-- ==================================================
     開始畫面
================================================== -->

<div id="title">

    <h1 id="titleText"></h1>


    <div class="warning">

        <p>
            內容提示
        </p>

        <p>
            本作品包含心理恐怖、
            令人不安的聲音與視覺表現，
            以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
            部分內容可能涉及敏感議題。
        </p>

        <p>
            若你容易受到心理壓迫、
            強烈聲音或失真畫面的影響，
            請自行斟酌是否遊玩。
        </p>

        <p>
            你可以隨時離開遊戲。
        </p>

    </div>


    <button
        id="startButton"
        class="startButton">

        開始你的旅程

    </button>

</div>


<!-- ==================================================
     3D 房間
================================================== -->

<div id="threeContainer"></div>


<!-- ==================================================
     提示
================================================== -->

<div
    id="hint"
    style="display:none;">

    滑動畫面轉動視角

</div>


<!-- ==================================================
     移動控制
================================================== -->

<div
    id="controls"
    style="display:none;">

    <div
        class="control forward"
        data-direction="forward">

        ↑

    </div>

    <div
        class="control left"
        data-direction="left">

        ←

    </div>

    <div
        class="control back"
        data-direction="back">

        ↓

    </div>

    <div
        class="control right"
        data-direction="right">

        →

    </div>

</div>


</div>


<!-- ==================================================
     Three.js
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>


<script>


/* ==================================================
   Reality...? 標題動畫
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );


const titleWord =
    "Reality...?";


let titleRunning = true;


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        resolve =>
            setTimeout(
                resolve,
                ms
            )

    );

}


/* ==================================================
   單字母慢速浮現

   1% → 100%

   1800ms
================================================== */

function fadeInLetter(letter) {

    return new Promise(

        resolve => {

            const duration =
                1800;


            const start =
                performance.now();


            function animate(now) {

                if (!titleRunning) {

                    resolve();

                    return;

                }


                const progress =
                    Math.min(

                        (
                            now -
                            start
                        ) /
                        duration,

                        1

                    );


                const eased =
                    progress *
                    progress *
                    (
                        3 -
                        2 * progress
                    );


                /*
                   1% → 100%
                */

                letter.style.opacity =
                    0.01 +
                    (
                        0.99 *
                        eased
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";


                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}


/* ==================================================
   已出現字母的平滑忽隱忽現
================================================== */

function startPulse(letter) {

    if (
        letter.dataset.pulsing
    )
        return;


    letter.dataset.pulsing =
        "true";


    let phase =
        Math.random() *
        Math.PI *
        2;


    const speed =
        0.006 +
        Math.random() *
        0.002;


    function animate() {

        if (!titleRunning)
            return;


        phase += speed;


        const wave =
            (
                Math.sin(phase)
                + 1
            ) / 2;


        const eased =
            wave *
            wave *
            (
                3 -
                2 * wave
            );


        /*
           25% → 100%

           平滑漸變
        */

        const opacity =
            0.25 +
            (
                eased *
                0.75
            );


        letter.style.opacity =
            opacity;


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


/* ==================================================
   主標題流程

   完成後重新開始
================================================== */

async function playTitleAnimation() {

    while (titleRunning) {


        titleText.innerHTML =
            "";


        const letters = [];


        /* ==========================================
           逐字出現
        ========================================== */

        for (
            let i = 0;
            i < titleWord.length;
            i++
        ) {


            if (!titleRunning)
                return;


            const letter =
                document.createElement(
                    "span"
                );


            letter.className =
                "titleLetter";


            letter.textContent =
                titleWord[i];


            letter.style.opacity =
                "0.01";


            titleText.appendChild(
                letter
            );


            letters.push(
                letter
            );


            /*
               當前字：

               1% → 100%
               1800ms
            */

            await fadeInLetter(
                letter
            );


            if (!titleRunning)
                return;


            /*
               字與字之間停頓
            */

            await wait(
                650
            );


            if (!titleRunning)
                return;


            /*
               下一個字開始時，
               前面的字才開始呼吸
            */

            for (
                let j = 0;
                j < letters.length;
                j++
            ) {

                startPulse(
                    letters[j]
                );

            }

        }


        /* ==========================================
           完整標題停留
        ========================================== */

        await wait(
            3500
        );


        if (!titleRunning)
            return;


        /* ==========================================
           標題消失
        ========================================== */

        titleText.innerHTML =
            "";


        /* ==========================================
           消失後等待

           2.5 ～ 5 秒
        ========================================== */

        const restartDelay =
            2500 +
            Math.random() * 2500;


        await wait(
            restartDelay
        );


        if (!titleRunning)
            return;


        /*
           while 重新開始
        */

    }

}


playTitleAnimation();



/* ==================================================
   Three.js 變數
================================================== */

let scene = null;

let camera = null;

let renderer = null;

let started = false;


/* ==================================================
   房間尺寸
================================================== */

const ROOM_WIDTH = 14;

const ROOM_DEPTH = 14;

const ROOM_HEIGHT = 10;


/* ==================================================
   玩家
================================================== */

const player = {

    x: 0,

    y: 2,

    z: 4

};


let yaw = 0;

let pitch = 0;


/* ==================================================
   移動狀態
================================================== */

const movement = {

    forward: false,

    back: false,

    left: false,

    right: false

};


/* ==================================================
   開始遊戲
================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    if (started)
        return;


    started = true;

    titleRunning = false;


    document
        .getElementById(
            "title"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hint"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "controls"
        )
        .style.display =
        "block";


    createWorld();

}


/* ==================================================
   建立 3D 世界
================================================== */

function createWorld() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0xb0b0b0
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100

        );


    camera.position.set(

        player.x,

        player.y,

        player.z

    );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    const ambient =
        new THREE.AmbientLight(

            0xffffff,

            2

        );


    scene.add(
        ambient
    );


    createRoom();

    setupTouch();

    setupButtons();

    animate();

}


/* ==================================================
   建立房間
================================================== */

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                W,
                D

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x707070,

                side:
                    THREE.DoubleSide

            })

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    scene.add(
        floor
    );


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                W,
                D

            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        H;


    scene.add(
        ceiling
    );


    const front =
        createWall(

            W,
            H,
            0xc2c2c2

        );


    front.position.set(

        0,
        H / 2,
        -D / 2

    );


    scene.add(
        front
    );


    const back =
        createWall(

            W,
            H,
            0xb7b7b7

        );


    back.position.set(

        0,
        H / 2,
        D / 2

    );


    scene.add(
        back
    );


    const left =
        createWall(

            D,
            H,
            0xaeaeae

        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(

        -W / 2,
        H / 2,
        0

    );


    scene.add(
        left
    );


    const right =
        createWall(

            D,
            H,
            0xa6a6a6

        );


    right.rotation.y =
        Math.PI / 2;


    right.position.set(

        W / 2,
        H / 2,
        0

    );


    scene.add(
        right
    );


    createRoomEdges(

        W,
        H,
        D

    );

}


/* ==================================================
   建立牆
================================================== */

function createWall(

    width,
    height,
    color

) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(

            width,
            height

        ),

        new THREE.MeshBasicMaterial({

            color:
                color,

            side:
                THREE.DoubleSide

        })

    );

}


/* ==================================================
   房間邊界線
================================================== */

function createRoomEdges(

    W,
    H,
    D

) {

    const geometry =
        new THREE.BoxGeometry(

            W,
            H,
            D

        );


    const edges =
        new THREE.EdgesGeometry(

            geometry

        );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0x666666,

            transparent:
                true,

            opacity:
                0.45

        });


    const lines =
        new THREE.LineSegments(

            edges,

            material

        );


    lines.position.y =
        H / 2;


    scene.add(
        lines
    );

}


/* ==================================================
   玩家移動
================================================== */

function updatePlayer() {

    if (!camera)
        return;


    const speed =
        0.08;


    const forwardX =
        Math.sin(yaw);


    const forwardZ =
        -Math.cos(yaw);


    let dx = 0;

    let dz = 0;


    if (
        movement.forward
    ) {

        dx +=
            forwardX *
            speed;

        dz +=
            forwardZ *
            speed;

    }


    if (
        movement.back
    ) {

        dx -=
            forwardX *
            speed;

        dz -=
            forwardZ *
            speed;

    }


    if (
        movement.left
    ) {

        dx -=
            Math.cos(yaw) *
            speed;

        dz -=
            Math.sin(yaw) *
            speed;

    }


    if (
        movement.right
    ) {

        dx +=
            Math.cos(yaw) *
            speed;

        dz +=
            Math.sin(yaw) *
            speed;

    }


    const limitX =
        ROOM_WIDTH / 2 -
        0.05;


    const limitZ =
        ROOM_DEPTH / 2 -
        0.05;


    const nextX =
        player.x +
        dx;


    const nextZ =
        player.z +
        dz;


    if (
        nextX >
        -limitX &&

        nextX <
        limitX
    ) {

        player.x =
            nextX;

    }


    if (
        nextZ >
        -limitZ &&

        nextZ <
        limitZ
    ) {

        player.z =
            nextZ;

    }


    camera.position.set(

        player.x,

        player.y,

        player.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* ==================================================
   手機滑動
================================================== */

let touching = false;

let lastX = 0;

let lastY = 0;


function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.addEventListener(

        "touchstart",

        function(event) {

            touching = true;

            lastX =
                event.touches[0]
                .clientX;

            lastY =
                event.touches[0]
                .clientY;

        },

        {
            passive: false
        }

    );


    canvas.addEventListener(

        "touchmove",

        function(event) {

            if (!touching)
                return;


            event.preventDefault();


            const x =
                event.touches[0]
                .clientX;


            const y =
                event.touches[0]
                .clientY;


            const dx =
                x -
                lastX;


            const dy =
                y -
                lastY;


            yaw -=
                dx *
                0.004;


            pitch -=
                dy *
                0.004;


            pitch =
                Math.max(

                    -1.4,

                    Math.min(

                        1.4,

                        pitch

                    )

                );


            lastX =
                x;


            lastY =
                y;

        },

        {
            passive: false
        }

    );


    canvas.addEventListener(

        "touchend",

        function() {

            touching =
                false;

        }

    );

}


/* ==================================================
   移動按鈕
================================================== */

function setupButtons() {

    const buttons =
        document.querySelectorAll(
            ".control"
        );


    buttons.forEach(

        function(button) {

            const direction =
                button.dataset.direction;


            function press(event) {

                event.preventDefault();


                movement[
                    direction
                ] = true;


                if (
                    button.setPointerCapture
                ) {

                    button.setPointerCapture(

                        event.pointerId

                    );

                }

            }


            function release(event) {

                event.preventDefault();


                movement[
                    direction
                ] = false;

            }


            button.addEventListener(
                "pointerdown",
                press
            );


            button.addEventListener(
                "pointerup",
                release
            );


            button.addEventListener(
                "pointercancel",
                release
            );


            button.addEventListener(

                "pointerleave",

                function(event) {

                    if (
                        event.buttons === 0
                    ) {

                        movement[
                            direction
                        ] = false;

                    }

                }

            );

        }

    );

}


/* ==================================================
   遊戲循環
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (started) {

        updatePlayer();

    }


    if (renderer) {

        renderer.render(

            scene,
            camera

        );

    }

}


/* ==================================================
   螢幕尺寸
================================================== */

window.addEventListener(

    "resize",

    function() {

        if (
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);

</script>

</body>

</html>
