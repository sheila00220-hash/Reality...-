<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reality...?</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, "Noto Sans TC", sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

#threeContainer {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}


/* =========================
   標題畫面
========================= */

#titleScreen {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #000;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 24px;
    text-align: center;
}

#title {
    font-size: clamp(34px, 9vw, 72px);
    font-weight: 300;
    letter-spacing: .08em;

    margin: 0 0 34px;

    animation: titleBreath 5.5s ease-in-out infinite;
}

@keyframes titleBreath {

    0%,
    100% {
        opacity: .34;
        transform: scale(.985);
    }

    45% {
        opacity: 1;
        transform: scale(1);
    }

    62% {
        opacity: .62;
        transform: scale(.995);
    }
}

#warning {
    max-width: 620px;

    color: rgba(255,255,255,.72);

    font-size: 13px;
    line-height: 1.9;

    margin-bottom: 28px;
}

#warning .head {
    color: #fff;
    font-size: 15px;
    margin-bottom: 8px;
}

#startButton {
    border: 1px solid rgba(255,255,255,.55);

    background: rgba(255,255,255,.05);
    color: #fff;

    padding: 13px 28px;

    font-size: 15px;
    letter-spacing: .08em;

    border-radius: 3px;

    cursor: pointer;
    touch-action: manipulation;
}

#startButton:active {
    background: rgba(255,255,255,.16);
}


/* =========================
   提示
========================= */

#hint {
    position: absolute;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 40;

    color: rgba(255,255,255,.62);

    font-size: 12px;

    pointer-events: none;

    opacity: 0;

    transition: opacity .8s;

    white-space: nowrap;
}


/* =========================
   搖桿
   保留原本位置
========================= */

#joystickArea {
    position: absolute;

    left: 18px;
    bottom: 22px;

    width: 150px;
    height: 150px;

    z-index: 50;

    pointer-events: none;
}

#joystickBase {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(0,0,0,.28);

    border: 1px solid rgba(255,255,255,.35);

    pointer-events: auto;

    touch-action: none;
}

#joystickRing {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 86px;
    height: 86px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.16);

    pointer-events: none;
}

#joystickKnob {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 56px;
    height: 56px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255,255,255,.22);

    border: 1px solid rgba(255,255,255,.65);

    pointer-events: none;
}

#joystickBase.active {
    background: rgba(0,0,0,.36);
}

#joystickBase.active #joystickKnob {
    background: rgba(255,255,255,.32);
}


/* =========================
   黑幕
========================= */

#blackout {
    position: absolute;

    inset: 0;

    z-index: 80;

    background: #000;

    pointer-events: none;

    opacity: 0;
}


/* =========================
   手機
========================= */

@media (max-width:420px) {

    #joystickArea {
        left: 12px;
        bottom: 15px;

        width: 140px;
        height: 140px;
    }

    #joystickBase {
        width: 120px;
        height: 120px;
    }
}
</style>
</head>


<body>

<div id="game">

    <div id="threeContainer"></div>


    <!-- =========================
         標題
    ========================== -->

    <div id="titleScreen">

        <div id="title">
            Reality...?
        </div>


        <div id="warning">

            <div class="head">
                內容提示
            </div>

            本作品包含心理恐怖、令人不安的聲音與視覺表現，以及可能引起部分玩家不適的成人向主題。<br>

            部分內容可能涉及敏感議題。<br>

            若你容易受到心理壓迫、強烈聲音或失真畫面的影響，請自行斟酌是否遊玩。<br>

            你可以隨時離開遊戲。

        </div>


        <button id="startButton">
            開始你的旅程
        </button>

    </div>


    <div id="hint">
        滑動畫面轉動視角
    </div>


    <!-- =========================
         搖桿
    ========================== -->

    <div id="joystickArea">

        <div id="joystickBase">

            <div id="joystickRing"></div>

            <div id="joystickKnob"></div>

        </div>

    </div>


    <div id="blackout"></div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>


<script>

/* =========================================================
   Reality...?
   Chapter 1
========================================================= */


/* =========================
   眼睛圖片
========================= */

const EYE_FRAME_IMAGE =
    "Screenshot_20260819_221148_Google-removebg-preview.png";

const EYE_BALL_IMAGE =
    "Screenshot_20260819_221235_Google-removebg-preview.png";


/* =========================
   Three.js
========================= */

let scene;

let camera;

let renderer;


/* =========================
   房間尺寸
========================= */

const ROOM_WIDTH = 14;

const ROOM_DEPTH = 14;

const ROOM_HEIGHT = 10;


/* =========================
   玩家
========================= */

const PLAYER_RADIUS = .28;

const WALL_BUFFER = .01;

const EYE_HEIGHT = 1.65;


let player = {

    x: 0,

    y: EYE_HEIGHT,

    z: 4

};


/* =========================
   視角
========================= */

let yaw = 0;

let pitch = 0;

const PITCH_LIMIT = 1;

const LOOK_SENSITIVITY_X = .0022;

const LOOK_SENSITIVITY_Y = .0022;


/* =========================
   移動
========================= */

let movement = {

    x: 0,

    y: 0

};


/* =========================
   狀態
========================= */

let worldStarted = false;

let chapter1Started = false;

let falling = false;

let fallProgress = 0;

let chapter1Finished = false;


/* =========================
   時間
========================= */

const clock =
    new THREE.Clock();


/* =========================
   眼睛
========================= */

const eyeObjects = [];

let holeEye = null;

let blackHole = null;


/* =========================
   暫存 Vector
========================= */

const tempTarget =
    new THREE.Vector3();

const tempLocal =
    new THREE.Vector3();


/* =========================
   DOM
========================= */

const titleScreen =
    document.getElementById(
        "titleScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const hint =
    document.getElementById(
        "hint"
    );

const joystickBase =
    document.getElementById(
        "joystickBase"
    );

const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );

const blackout =
    document.getElementById(
        "blackout"
    );


/* =========================
   圖片載入
========================= */

const textureLoader =
    new THREE.TextureLoader();


const eyeFrameTexture =
    textureLoader.load(
        EYE_FRAME_IMAGE
    );


const eyeBallTexture =
    textureLoader.load(
        EYE_BALL_IMAGE
    );


eyeFrameTexture.colorSpace =
    THREE.SRGBColorSpace;

eyeBallTexture.colorSpace =
    THREE.SRGBColorSpace;


/* =========================================================
   開始遊戲
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        if (worldStarted)
            return;


        worldStarted = true;


        titleScreen.style.display =
            "none";


        hint.style.opacity =
            "1";


        setTimeout(
            () => {

                hint.style.opacity =
                    "0";

            },
            3500
        );


        initWorld();

    }
);


/* =========================================================
   建立世界
========================================================= */

function initWorld() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x858585
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            .03,

            100

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            alpha: false

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    createRoom();


    createEyes();


    updateCamera();


    chapter1Started =
        true;


    window.addEventListener(
        "resize",
        onResize
    );


    setupLookControls();


    setupJoystick();


    animate();

}


/* =========================================================
   房間
========================================================= */

function createRoom() {

    const roomMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xbdbdbd,

            side: THREE.BackSide

        });


    const roomGeometry =
        new THREE.BoxGeometry(

            ROOM_WIDTH,

            ROOM_HEIGHT,

            ROOM_DEPTH

        );


    const room =
        new THREE.Mesh(

            roomGeometry,

            roomMaterial

        );


    room.position.y =
        ROOM_HEIGHT / 2;


    scene.add(
        room
    );


    /*
      地面
    */

    const floorMaterial =
        new THREE.MeshBasicMaterial({

            color: 0xc7c7c7

        });


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(

                ROOM_WIDTH,

                ROOM_DEPTH

            ),

            floorMaterial

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        .002;


    scene.add(
        floor
    );

}


/* =========================================================
   建立一隻眼睛
========================================================= */

function createEye(
    position,
    rotation,
    scale,
    isHoleEye = false
) {

    const group =
        new THREE.Group();


    group.position.copy(
        position
    );


    group.rotation.set(

        rotation.x,

        rotation.y,

        rotation.z

    );


    /*
      第一層：

      眼框＋眼白
    */

    const frameMaterial =
        new THREE.MeshBasicMaterial({

            map:
                eyeFrameTexture,

            transparent:
                true,

            depthWrite:
                false,

            side:
                THREE.DoubleSide

        });


    const frame =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1,
                1
            ),

            frameMaterial

        );


    /*
      第二層：

      眼球
    */

    const ballMaterial =
        new THREE.MeshBasicMaterial({

            map:
                eyeBallTexture,

            transparent:
                true,

            depthWrite:
                false,

            side:
                THREE.DoubleSide

        });


    const ball =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1,
                1
            ),

            ballMaterial

        );


    /*
      讓眼球浮在眼白上面
    */

    ball.position.z =
        .018;


    /*
      眼框比例
    */

    frame.scale.set(

        2.0,

        1.45,

        1

    );


    /*
      眼球比例
    */

    ball.scale.set(

        .68,

        .68,

        1

    );


    group.add(
        frame
    );


    group.add(
        ball
    );


    group.userData = {

        frame,

        ball,

        baseScale:
            scale,

        currentScale:
            scale,

        growth:
            0.0009 +
            Math.random() *
            0.00045,

        phase:
            Math.random() *
            Math.PI *
            2,

        maxBallOffset:
            .18 +
            Math.random() *
            .045,

        isHoleEye

    };


    group.scale.setScalar(
        scale
    );


    scene.add(
        group
    );


    eyeObjects.push(
        group
    );


    if (isHoleEye) {

        holeEye =
            group;

    }


    return group;

}


/* =========================================================
   建立所有眼睛
========================================================= */

function createEyes() {

    const wallHalfW =
        ROOM_WIDTH / 2 -
        .08;


    const wallHalfD =
        ROOM_DEPTH / 2 -
        .08;


    /* =========================
       北牆
    ========================== */

    const northZ =
        -ROOM_DEPTH / 2 +
        .035;


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const x =
            -wallHalfW +
            (i / 14) *
            (wallHalfW * 2);


        const y =
            1.1 +
            (
                (i * 1.73) %
                6.7
            );


        createEye(

            new THREE.Vector3(
                x,
                y,
                northZ
            ),

            new THREE.Euler(
                0,
                0,
                0
            ),

            .62 +
            ((i * 7) % 5) *
            .025

        );

    }


    /* =========================
       南牆
    ========================== */

    const southZ =
        ROOM_DEPTH / 2 -
        .035;


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const x =
            -wallHalfW +
            (i / 14) *
            (wallHalfW * 2);


        const y =
            1.0 +
            (
                (i * 2.11) %
                6.9
            );


        createEye(

            new THREE.Vector3(
                x,
                y,
                southZ
            ),

            new THREE.Euler(
                0,
                Math.PI,
                0
            ),

            .61 +
            ((i * 5) % 6) *
            .025

        );

    }


    /* =========================
       西牆
    ========================== */

    const westX =
        -ROOM_WIDTH / 2 +
        .035;


    for (
        let i = 0;
        i < 13;
        i++
    ) {

        const z =
            -wallHalfD +
            (i / 12) *
            (wallHalfD * 2);


        const y =
            1.2 +
            (
                (i * 1.91) %
                6.5
            );


        createEye(

            new THREE.Vector3(
                westX,
                y,
                z
            ),

            new THREE.Euler(
                0,
                -Math.PI / 2,
                0
            ),

            .60 +
            ((i * 3) % 6) *
            .028

        );

    }


    /* =========================
       東牆
    ========================== */

    const eastX =
        ROOM_WIDTH / 2 -
        .035;


    for (
        let i = 0;
        i < 13;
        i++
    ) {

        const z =
            -wallHalfD +
            (i / 12) *
            (wallHalfD * 2);


        const y =
            1.0 +
            (
                (i * 2.37) %
                6.8
            );


        createEye(

            new THREE.Vector3(
                eastX,
                y,
                z
            ),

            new THREE.Euler(
                0,
                Math.PI / 2,
                0
            ),

            .63 +
            ((i * 4) % 5) *
            .025

        );

    }


    /* =========================
       天花板
    ========================== */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const x =
            -5.4 +
            (i % 5) *
            2.7;


        const z =
            -5.0 +
            Math.floor(i / 5) *
            5.0;


        createEye(

            new THREE.Vector3(
                x,
                ROOM_HEIGHT - .035,
                z
            ),

            new THREE.Euler(
                Math.PI / 2,
                0,
                0
            ),

            .65 +
            (i % 4) *
            .03

        );

    }


    /* =========================
       地板
    ========================== */

    for (
        let i = 0;
        i < 13;
        i++
    ) {

        let x =
            -5.4 +
            (i % 5) *
            2.7;


        let z =
            -5.2 +
            Math.floor(i / 5) *
            2.6;


        /*
          第 7 隻就是黑洞眼睛
        */

        if (i === 7) {

            x = 0;

            z = -1.5;

        }


        const eye =
            createEye(

                new THREE.Vector3(
                    x,
                    .018,
                    z
                ),

                new THREE.Euler(
                    -Math.PI / 2,
                    0,
                    0
                ),

                .72 +
                (i % 4) *
                .035,

                i === 7

            );


        eye.position.y =
            .025;

    }


    createBlackHole();

}


/* =========================================================
   黑洞
========================================================= */

function createBlackHole() {

    const material =
        new THREE.MeshBasicMaterial({

            color: 0x000000,

            transparent: true,

            opacity: 0,

            side: THREE.DoubleSide

        });


    blackHole =
        new THREE.Mesh(

            new THREE.CircleGeometry(
                .82,
                48
            ),

            material

        );


    blackHole.rotation.x =
        -Math.PI / 2;


    blackHole.position.set(

        holeEye.position.x,

        .012,

        holeEye.position.z

    );


    scene.add(
        blackHole
    );

}


/* =========================================================
   眼睛追蹤玩家
========================================================= */

function updateEyes(delta) {

    if (!camera)
        return;


    const elapsed =
        performance.now() *
        .001;


    for (
        const eye of eyeObjects
    ) {

        if (!eye.visible)
            continue;


        const data =
            eye.userData;


        /*
          眼睛慢慢放大
        */

        if (!data.isHoleEye) {

            data.currentScale +=
                data.growth *
                delta *
                60;


            data.currentScale =
                Math.min(

                    data.currentScale,

                    data.baseScale *
                    2.15

                );


            eye.scale.setScalar(
                data.currentScale
            );

        }


        /*
          玩家位置
        */

        tempTarget.set(

            player.x,

            player.y,

            player.z

        );


        tempLocal.copy(
            tempTarget
        );


        /*
          把玩家座標轉到
          這隻眼睛自己的座標
        */

        eye.worldToLocal(
            tempLocal
        );


        let tx =
            tempLocal.x;


        let ty =
            tempLocal.y;


        /*
          限制眼球移動
        */

        const len =
            Math.hypot(
                tx,
                ty
            );


        if (len > 1) {

            tx /= len;

            ty /= len;

        }


        const offset =
            data.maxBallOffset;


        /*
          一點點不規則感
        */

        const wobble =
            Math.sin(

                elapsed *
                1.15 +
                data.phase

            ) * .012;


        data.ball.position.x =
            tx * offset;


        data.ball.position.y =
            ty * offset +
            wobble;

    }

}


/* =========================================================
   玩家移動
========================================================= */

function updatePlayer() {

    if (
        !camera ||
        falling
    )
        return;


    const speed =
        .08;


    /*
      使用 camera 的實際世界方向。
      這就是之前修好的版本。
    */

    const cameraDirection =
        new THREE.Vector3();


    camera.getWorldDirection(
        cameraDirection
    );


    cameraDirection.y =
        0;


    if (
        cameraDirection.lengthSq() >
        0
    ) {

        cameraDirection.normalize();

    }


    const forwardX =
        cameraDirection.x;


    const forwardZ =
        cameraDirection.z;


    const rightX =
        -forwardZ;


    const rightZ =
        forwardX;


    const inputForward =
        -movement.y;


    const inputRight =
        movement.x;


    let inputX = 0;

    let inputZ = 0;


    inputX +=
        forwardX *
        inputForward;


    inputZ +=
        forwardZ *
        inputForward;


    inputX +=
        rightX *
        inputRight;


    inputZ +=
        rightZ *
        inputRight;


    const length =
        Math.hypot(
            inputX,
            inputZ
        );


    if (
        length > 1
    ) {

        inputX /=
            length;


        inputZ /=
            length;

    }


    if (
        length > 0
    ) {

        const moveX =
            inputX *
            speed;


        const moveZ =
            inputZ *
            speed;


        resolveMovement(
            moveX,
            moveZ
        );

    }


    checkHole();


    updateCamera();

}


/* =========================================================
   碰撞
========================================================= */

function resolveMovement(
    moveX,
    moveZ
) {

    const halfW =
        ROOM_WIDTH / 2 -
        PLAYER_RADIUS -
        WALL_BUFFER;


    const halfD =
        ROOM_DEPTH / 2 -
        PLAYER_RADIUS -
        WALL_BUFFER;


    /*
      X / Z 分開處理
      保留滑牆效果
    */

    const nextX =
        player.x +
        moveX;


    if (
        nextX >= -halfW &&
        nextX <= halfW
    ) {

        player.x =
            nextX;

    }


    const nextZ =
        player.z +
        moveZ;


    if (
        nextZ >= -halfD &&
        nextZ <= halfD
    ) {

        player.z =
            nextZ;

    }

}


/* =========================================================
   黑洞檢查
========================================================= */

function checkHole() {

    if (
        !holeEye ||
        falling ||
        chapter1Finished
    )
        return;


    const dx =
        player.x -
        holeEye.position.x;


    const dz =
        player.z -
        holeEye.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    if (
        distance < .72
    ) {

        startFall();

    }

}


/* =========================================================
   掉進黑洞
========================================================= */

function startFall() {

    falling =
        true;


    fallProgress =
        0;


    movement.x =
        0;


    movement.y =
        0;


    resetJoystick();


    joystickBase.style.pointerEvents =
        "none";


    /*
      眼睛突然消失
    */

    holeEye.visible =
        false;


    /*
      黑洞出現
    */

    if (blackHole) {

        blackHole.material.opacity =
            1;

    }


    blackout.style.opacity =
        "0";

}


/* =========================================================
   掉落動畫
========================================================= */

function updateFall(delta) {

    if (!falling)
        return;


    fallProgress +=
        delta *
        .72;


    const t =
        Math.min(
            fallProgress,
            1
        );


    /*
      玩家往下掉
    */

    player.y =
        EYE_HEIGHT -
        Math.pow(
            t,
            1.65
        ) *
        7.5;


    /*
      慢慢變黑
    */

    const fade =
        Math.max(

            0,

            (t - .35) /
            .65

        );


    blackout.style.opacity =
        String(fade);


    updateCamera();


    if (
        fallProgress >= 1
    ) {

        chapter1Finished =
            true;


        falling =
            false;


        player.y =
            EYE_HEIGHT;


        /*
          第一章結束
          暫時停在黑畫面
        */

        blackout.style.opacity =
            "1";

    }

}


/* =========================================================
   相機
========================================================= */

function updateCamera() {

    if (!camera)
        return;


    camera.position.set(

        player.x,

        player.y,

        player.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* =========================================================
   視角控制
========================================================= */

function setupLookControls() {

    const canvas =
        renderer.domElement;


    let looking =
        false;


    let lastX =
        0;


    let lastY =
        0;


    canvas.addEventListener(
        "pointerdown",
        e => {

            if (falling)
                return;


            /*
              避免搶走搖桿
            */

            if (

                e.clientX < 190 &&

                e.clientY >
                window.innerHeight - 190

            ) {

                return;

            }


            looking =
                true;


            lastX =
                e.clientX;


            lastY =
                e.clientY;


            try {

                canvas.setPointerCapture(
                    e.pointerId
                );

            } catch (_) {}

        }
    );


    canvas.addEventListener(
        "pointermove",
        e => {

            if (
                !looking ||
                falling
            )
                return;


            const dx =
                e.clientX -
                lastX;


            const dy =
                e.clientY -
                lastY;


            lastX =
                e.clientX;


            lastY =
                e.clientY;


            yaw -=
                dx *
                LOOK_SENSITIVITY_X;


            pitch -=
                dy *
                LOOK_SENSITIVITY_Y;


            pitch =
                Math.max(

                    -PITCH_LIMIT,

                    Math.min(
                        PITCH_LIMIT,
                        pitch
                    )

                );


            updateCamera();

        }
    );


    const stopLooking =
        e => {

            looking =
                false;


            try {

                canvas.releasePointerCapture(
                    e.pointerId
                );

            } catch (_) {}

        };


    canvas.addEventListener(
        "pointerup",
        stopLooking
    );


    canvas.addEventListener(
        "pointercancel",
        stopLooking
    );


    canvas.addEventListener(
        "lostpointercapture",
        () => {

            looking =
                false;

        }
    );

}


/* =========================================================
   搖桿
========================================================= */

let joystickPointerId =
    null;


function setupJoystick() {

    joystickBase.addEventListener(
        "pointerdown",
        e => {

            if (falling)
                return;


            joystickPointerId =
                e.pointerId;


            joystickBase.classList.add(
                "active"
            );


            try {

                joystickBase.setPointerCapture(
                    e.pointerId
                );

            } catch (_) {}


            updateJoystick(

                e.clientX,

                e.clientY

            );

        }
    );


    joystickBase.addEventListener(
        "pointermove",
        e => {

            if (
                e.pointerId !==
                joystickPointerId
            )
                return;


            updateJoystick(

                e.clientX,

                e.clientY

            );

        }
    );


    const endJoystick =
        e => {

            if (
                e.pointerId !==
                joystickPointerId
            )
                return;


            resetJoystick();

        };


    joystickBase.addEventListener(
        "pointerup",
        endJoystick
    );


    joystickBase.addEventListener(
        "pointercancel",
        endJoystick
    );


    /*
      不改變搖桿位置
    */

    joystickBase.addEventListener(
        "lostpointercapture",
        () => {}
    );

}


/* =========================================================
   更新搖桿
========================================================= */

function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystickBase.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;


    let dy =
        clientY -
        centerY;


    const maxDistance =
        37;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if (
        distance >
        maxDistance
    ) {

        dx =
            dx / distance *
            maxDistance;


        dy =
            dy / distance *
            maxDistance;

    }


    joystickKnob.style.left =
        `calc(50% + ${dx}px)`;


    joystickKnob.style.top =
        `calc(50% + ${dy}px)`;


    movement.x =
        dx /
        maxDistance;


    movement.y =
        dy /
        maxDistance;


    const magnitude =
        Math.hypot(

            movement.x,

            movement.y

        );


    if (
        magnitude < .12
    ) {

        movement.x =
            0;


        movement.y =
            0;

    }

}


/* =========================================================
   重置搖桿
========================================================= */

function resetJoystick() {

    joystickPointerId =
        null;


    joystickBase.classList.remove(
        "active"
    );


    joystickKnob.style.left =
        "50%";


    joystickKnob.style.top =
        "50%";


    movement.x =
        0;


    movement.y =
        0;

}


/* =========================================================
   Resize
========================================================= */

function onResize() {

    if (
        !camera ||
        !renderer
    )
        return;


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =========================================================
   失焦
========================================================= */

window.addEventListener(
    "blur",
    () => {

        resetJoystick();

    }
);


/* =========================================================
   主迴圈
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            clock.getDelta(),

            .05

        );


    if (
        chapter1Started
    ) {

        updatePlayer();

        updateEyes(
            delta
        );

        updateFall(
            delta
        );


        renderer.render(

            scene,

            camera

        );

    }

}

</script>
