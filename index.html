<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0">

<title>Reality...?</title>

<style>

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    background: black;

    overflow: hidden;

}


#text {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(60px, 15vw, 130px);

    font-weight: 300;

    letter-spacing: 10px;

    white-space: nowrap;

}


.letter {

    display: inline-block;

    opacity: 0;

}

</style>

</head>


<body>


<div id="text"></div>


<script>


const text =
    document.getElementById(
        "text"
    );


const word =
    "Reality...?";



/* ==========================================
   等待
========================================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}



/* ==========================================
   一個字的「忽亮忽暗顯影」
========================================== */

async function revealLetter(letter) {


    /*
       非常明顯的透明度變化

       不是小幅度閃爍
    */

    const levels = [

        0.00,

        0.25,

        0.07,

        0.45,

        0.12,

        0.68,

        0.30,

        0.82,

        0.55,

        1.00

    ];


    /*
       每一階停留多久

       故意慢
    */

    const times = [

        900,

        700,

        900,

        700,

        850,

        650,

        750,

        600,

        650,

        1000

    ];



    for (
        let i = 0;

        i <
        levels.length;

        i++
    ) {


        /*
           設定透明度
        */

        letter.style.opacity =
            levels[i];


        /*
           慢慢等待

           所以你肉眼一定看得到
        */

        await wait(
            times[i]
        );

    }

}



/* ==========================================
   開始
========================================== */

async function start() {


    /*
       黑屏
    */

    await wait(1500);



    /*
       一個字一個字加入
    */

    for (
        let i = 0;

        i <
        word.length;

        i++
    ) {


        /*
           建立字母
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            word[i];


        text.appendChild(
            letter
        );



        /*
           這個字自己完成
           「忽亮忽暗顯影」
        */

        await revealLetter(
            letter
        );



        /*
           下一個字之前

           故意停頓
        */

        await wait(
            1800
        );

    }



    /*
       Reality...? 完整出現

       停很久
    */

    await wait(
        4000
    );



    /*
       瞬間消失
    */

    text.innerHTML = "";



    /*
       黑屏
    */

    await wait(
        5000
    );



    /*
       重播
    */

    start();

}



start();

</script>

</body>

</html>
