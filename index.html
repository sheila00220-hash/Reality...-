<script>


/* ==================================================
   Reality...? 標題
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );


const titleWord =
    "Reality...?";


let titleRunning = true;


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}


/* ==================================================
   隨機數
================================================== */

function random(min, max) {

    return (
        min +
        Math.random() *
        (max - min)
    );

}


/* ==================================================
   Smoothstep
================================================== */

function smoothstep(t) {

    return (
        t *
        t *
        (
            3 -
            2 * t
        )
    );

}


/* ==================================================
   建立標題
================================================== */

function createTitleLetters() {

    titleText.innerHTML = "";

    const letters = [];


    for (
        let i = 0;
        i < titleWord.length;
        i++
    ) {

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "titleLetter";


        letter.textContent =
            titleWord[i];


        letter.style.opacity =
            "0";


        titleText.appendChild(
            letter
        );


        letters.push(
            letter
        );

    }


    return letters;

}


/* ==================================================
   字母慢慢浮現
================================================== */

function fadeInLetter(letter) {

    return new Promise(

        resolve => {

            const duration =
                random(
                    2400,
                    3000
                );


            const start =
                performance.now();


            function animate(now) {

                if (!titleRunning) {

                    resolve();

                    return;

                }


                const progress =
                    Math.min(

                        (
                            now -
                            start
                        ) /
                        duration,

                        1

                    );


                const eased =
                    smoothstep(
                        progress
                    );


                letter.style.opacity =
                    eased;


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";


                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}


/* ==================================================
   不規則若隱若現

   每個字：

   亮著
      ↓
   隨機停留
      ↓
   慢慢變暗
      ↓
   隨機停留
      ↓
   慢慢變亮
      ↓
   再重新決定下一次

   沒有固定週期。
================================================== */

function startIrregularBreathing(
    letter,
    index
) {

    if (
        letter.dataset.breathing ===
        "true"
    )
        return;


    letter.dataset.breathing =
        "true";


    /*
       每個字第一次先保持亮
       時間故意不同
    */

    let state =
        "holdBright";


    let stateStart =
        performance.now();


    let stateDuration =
        random(
            1200,
            2600
        );


    let startOpacity =
        1;


    let targetOpacity =
        1;


    function chooseNextState() {

        /*
           隨機決定下一個狀態
        */

        const roll =
            Math.random();


        if (
            roll < 0.55
        ) {

            /*
               55%：
               亮 → 暗
            */

            state =
                "fadeDown";


            startOpacity =
                1;


            targetOpacity =
                random(
                    0.22,
                    0.38
                );


            stateDuration =
                random(
                    2600,
                    4200
                );

        }

        else {

            /*
               45%：
               暗 → 亮
            */

            state =
                "fadeUp";


            startOpacity =
                parseFloat(
                    letter.style.opacity
                ) || 0.3;


            targetOpacity =
                1;


            stateDuration =
                random(
                    2800,
                    4500
                );

        }


        stateStart =
            performance.now();

    }


    function animate(now) {

        if (!titleRunning)
            return;


        const elapsed =
            now -
            stateStart;


        const progress =
            Math.min(

                elapsed /
                stateDuration,

                1

            );


        /* ==========================================
           亮著停留
        ========================================== */

        if (
            state ===
            "holdBright"
        ) {

            letter.style.opacity =
                "1";

        }


        /* ==========================================
           慢慢變暗
        ========================================== */

        else if (
            state ===
            "fadeDown"
        ) {

            const eased =
                smoothstep(
                    progress
                );


            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                eased;

        }


        /* ==========================================
           慢慢變亮
        ========================================== */

        else if (
            state ===
            "fadeUp"
        ) {

            const eased =
                smoothstep(
                    progress
                );


            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                eased;

        }


        /* ==========================================
           狀態完成
        ========================================== */

        if (
            progress >= 1
        ) {

            if (
                state ===
                "holdBright"
            ) {

                /*
                   亮 → 暗
                */

                chooseNextState();

            }

            else if (
                state ===
                "fadeDown"
            ) {

                /*
                   暗完後
                   隨機停留在暗處
                */

                state =
                    "holdDark";


                stateStart =
                    performance.now();


                stateDuration =
                    random(
                        700,
                        2200
                    );

            }

            else if (
                state ===
                "holdDark"
            ) {

                /*
                   暗 → 亮
                */

                state =
                    "fadeUp";


                stateStart =
                    performance.now();


                startOpacity =
                    parseFloat(
                        letter.style.opacity
                    );


                targetOpacity =
                    1;


                stateDuration =
                    random(
                        2800,
                        4500
                    );

            }

            else if (
                state ===
                "fadeUp"
            ) {

                /*
                   回到亮處後
                   不一定馬上變暗

                   再隨機停一段時間
                */

                state =
                    "holdBright";


                stateStart =
                    performance.now();


                stateDuration =
                    random(
                        900,
                        3000
                    );

            }

        }


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


/* ==================================================
   標題主流程
================================================== */

async function playTitleAnimation() {

    while (titleRunning) {


        const letters =
            createTitleLetters();


        /* ==========================================
           一個一個慢慢出現
        ========================================== */

        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (!titleRunning)
                return;


            await fadeInLetter(
                letters[i]
            );


            if (!titleRunning)
                return;


            /*
               浮現完成後
               立即保持 100%

               不會突然暗
            */

            startIrregularBreathing(
                letters[i],
                i
            );


            /*
               下一個字出現前
               有自然間隔
            */

            await wait(
                random(
                    500,
                    800
                )
            );

        }


        /* ==========================================
           全部出現後停留

           這段時間各字仍然
           各自呼吸
        ========================================== */

        await wait(
            random(
                4300,
                5600
            )
        );


        if (!titleRunning)
            return;


        /* ==========================================
           整個標題慢慢消失
        ========================================== */

        const fadeOutDuration =
            random(
                2600,
                3400
            );


        const start =
            performance.now();


        /*
           記錄每個字當下的透明度
           避免從某個值突然跳動
        */

        const startingOpacity =
            letters.map(

                letter =>
                    parseFloat(
                        letter.style.opacity
                    ) || 0

            );


        await new Promise(

            resolve => {

                function fadeOut(now) {

                    if (!titleRunning) {

                        resolve();

                        return;

                    }


                    const progress =
                        Math.min(

                            (
                                now -
                                start
                            ) /
                            fadeOutDuration,

                            1

                        );


                    const eased =
                        smoothstep(
                            progress
                        );


                    letters.forEach(

                        (
                            letter,
                            index
                        ) => {

                            letter.style.opacity =
                                startingOpacity[
                                    index
                                ] *
                                (
                                    1 -
                                    eased
                                );

                        }

                    );


                    if (
                        progress < 1
                    ) {

                        requestAnimationFrame(
                            fadeOut
                        );

                    }

                    else {

                        titleText.innerHTML =
                            "";

                        resolve();

                    }

                }


                requestAnimationFrame(
                    fadeOut
                );

            }

        );


        /* ==========================================
           完全消失

           等待一段不固定時間
        ========================================== */

        await wait(

            random(
                2800,
                4800
            )

        );

    }

}


playTitleAnimation();



/* ==================================================
   Three.js
================================================== */

let scene = null;

let camera = null;

let renderer = null;

let started = false;


/* ==================================================
   房間尺寸
================================================== */

const ROOM_WIDTH = 14;

const ROOM_DEPTH = 14;

const ROOM_HEIGHT = 10;


/* ==================================================
   玩家
================================================== */

const player = {

    x: 0,

    y: 2,

    z: 4

};


let yaw = 0;

let pitch = 0;


/* ==================================================
   移動狀態
================================================== */

const movement = {

    forward: false,

    back: false,

    left: false,

    right: false

};


/* ==================================================
   開始遊戲
================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    if (started)
        return;


    started = true;

    titleRunning = false;


    document
        .getElementById(
            "title"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hint"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "controls"
        )
        .style.display =
        "block";


    createWorld();

}


/* ==================================================
   建立 3D 世界
================================================== */

function createWorld() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0xb0b0b0
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100

        );


    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    const ambient =
        new THREE.AmbientLight(

            0xffffff,
            2

        );


    scene.add(
        ambient
    );


    createRoom();

    setupTouch();

    setupButtons();

    animate();

}


/* ==================================================
   建立房間
================================================== */

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;


    /* =========================
       地板
    ========================= */

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x707070,

                side:
                    THREE.DoubleSide

            })

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    scene.add(
        floor
    );


    /* =========================
       天花板
    ========================= */

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        H;


    scene.add(
        ceiling
    );


    /* =========================
       前牆
    ========================= */

    const front =
        createWall(
            W,
            H,
            0xc2c2c2
        );


    front.position.set(
        0,
        H / 2,
        -D / 2
    );


    scene.add(
        front
    );


    /* =========================
       後牆
    ========================= */

    const back =
        createWall(
            W,
            H,
            0xb7b7b7
        );


    back.position.set(
        0,
        H / 2,
        D / 2
    );


    scene.add(
        back
    );


    /* =========================
       左牆
    ========================= */

    const left =
        createWall(
            D,
            H,
            0xaeaeae
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(
        -W / 2,
        H / 2,
        0
    );


    scene.add(
        left
    );


    /* =========================
       右牆
    ========================= */

    const right =
        createWall(
            D,
            H,
            0xa6a6a6
        );


    right.rotation.y =
        Math.PI / 2;


    right.position.set(
        W / 2,
        H / 2,
        0
    );


    scene.add(
        right
    );


    createRoomEdges(
        W,
        H,
        D
    );

}


/* ==================================================
   建立牆
================================================== */

function createWall(
    width,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            color:
                color,

            side:
                THREE.DoubleSide

        })

    );

}


/* ==================================================
   房間邊界線
================================================== */

function createRoomEdges(
    W,
    H,
    D
) {

    const geometry =
        new THREE.BoxGeometry(
            W,
            H,
            D
        );


    const edges =
        new THREE.EdgesGeometry(
            geometry
        );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0x666666,

            transparent:
                true,

            opacity:
                0.45

        });


    const lines =
        new THREE.LineSegments(
            edges,
            material
        );


    lines.position.y =
        H / 2;


    scene.add(
        lines
    );

}


/* ==================================================
   玩家移動
================================================== */

function updatePlayer() {

    if (!camera)
        return;


    const speed =
        0.08;


    const forwardX =
        Math.sin(yaw);


    const forwardZ =
        -Math.cos(yaw);


    let dx = 0;

    let dz = 0;


    if (
        movement.forward
    ) {

        dx +=
            forwardX *
            speed;

        dz +=
            forwardZ *
            speed;

    }


    if (
        movement.back
    ) {

        dx -=
            forwardX *
            speed;

        dz -=
            forwardZ *
            speed;

    }


    if (
        movement.left
    ) {

        dx -=
            Math.cos(yaw) *
            speed;

        dz -=
            Math.sin(yaw) *
            speed;

    }


    if (
        movement.right
    ) {

        dx +=
            Math.cos(yaw) *
            speed;

        dz +=
            Math.sin(yaw) *
            speed;

    }


    const limitX =
        ROOM_WIDTH / 2 -
        0.05;


    const limitZ =
        ROOM_DEPTH / 2 -
        0.05;


    const nextX =
        player.x +
        dx;


    const nextZ =
        player.z +
        dz;


    if (
        nextX >
        -limitX &&
        nextX <
        limitX
    ) {

        player.x =
            nextX;

    }


    if (
        nextZ >
        -limitZ &&
        nextZ <
        limitZ
    ) {

        player.z =
            nextZ;

    }


    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* ==================================================
   手機滑動
================================================== */

let touching = false;

let lastX = 0;

let lastY = 0;


function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.addEventListener(

        "touchstart",

        function(event) {

            touching = true;


            lastX =
                event.touches[0]
                .clientX;


            lastY =
                event.touches[0]
                .clientY;

        },

        {
            passive:
                false
        }

    );


    canvas.addEventListener(

        "touchmove",

        function(event) {

            if (!touching)
                return;


            event.preventDefault();


            const x =
                event.touches[0]
                .clientX;


            const y =
                event.touches[0]
                .clientY;


            const dx =
                x -
                lastX;


            const dy =
                y -
                lastY;


            yaw -=
                dx *
                0.004;


            pitch -=
                dy *
                0.004;


            pitch =
                Math.max(
                    -1.4,
                    Math.min(
                        1.4,
                        pitch
                    )
                );


            lastX =
                x;


            lastY =
                y;

        },

        {
            passive:
                false
        }

    );


    canvas.addEventListener(

        "touchend",

        function() {

            touching =
                false;

        }

    );

}


/* ==================================================
   移動按鈕
================================================== */

function setupButtons() {

    const buttons =
        document.querySelectorAll(
            ".control"
        );


    buttons.forEach(

        function(button) {

            const direction =
                button.dataset.direction;


            function press(event) {

                event.preventDefault();


                movement[
                    direction
                ] = true;


                if (
                    button.setPointerCapture
                ) {

                    button.setPointerCapture(
                        event.pointerId
                    );

                }

            }


            function release(event) {

                event.preventDefault();


                movement[
                    direction
                ] = false;

            }


            button.addEventListener(
                "pointerdown",
                press
            );


            button.addEventListener(
                "pointerup",
                release
            );


            button.addEventListener(
                "pointercancel",
                release
            );


            button.addEventListener(

                "pointerleave",

                function(event) {

                    if (
                        event.buttons === 0
                    ) {

                        movement[
                            direction
                        ] = false;

                    }

                }

            );

        }

    );

}


/* ==================================================
   遊戲循環
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (started) {

        updatePlayer();

    }


    if (renderer) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* ==================================================
   螢幕尺寸
================================================== */

window.addEventListener(

    "resize",

    function() {

        if (
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }

);

</script>
