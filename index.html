<!DOCTYPE html>

content="width=device-width,

<style>

/* ==================================================
   基本設定
================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #777;

#game {

    position: relative;

/* ==================================================
   開始畫面
================================================== */

#title {

    position: absolute;

    inset: 0;

    background: #000;

    color: #fff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    z-index: 100;

    overflow: hidden;

}


/* ==================================================
   標題
================================================== */

.titleWrapper {

    width: 100vw;

    height: 1.2em;

    display: flex;

    justify-content: center;

    align-items: center;

}

#titleText {

    margin: 0;

    padding: 0;

    display: inline-block;

    width: auto;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(48px, 11vw, 104px);

    font-weight: 300;

    line-height: 1;

    color: #f5f5f5;

    white-space: nowrap;

    letter-spacing: 0;

    text-align: center;

}

.titleLetter {

    display: inline;

    margin: 0;

    padding: 0;

    opacity: 0;

}


/* ==================================================
   警告
================================================== */

.warning {

    width: 88%;

    max-width: 600px;

    margin-top: 55px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;

}


/* ==================================================
   開始按鈕
================================================== */

.startButton {

    margin-top: 25px;

    padding: 14px 30px;

    background: transparent;

    border: 1px solid #aaa;

    color: white;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    touch-action: manipulation;

}

.startButton:active {

    background: white;

    color: black;

}


/* ==================================================
   3D
================================================== */

#threeContainer {

    position: absolute;

    inset: 0;

}


/* ==================================================
   提示
================================================== */

#hint {

    position: absolute;

    top: 15px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    color: white;

    background:
        rgba(0,0,0,.35);

    padding: 7px 12px;

    border-radius: 5px;

    font-size: 13px;

    pointer-events: none;

}


/* ==================================================
   手機按鍵區
================================================== */

#controls {

    position: absolute;

    left: 15px;

    bottom: 20px;

    width: 180px;

    height: 120px;

    z-index: 50;

    pointer-events: none;

}


.control {

    position: absolute;

    width: 52px;

    height: 52px;

    display: flex;

    justify-content: center;

    align-items: center;

    color: white;

    background:
        rgba(0,0,0,.35);

    border:
        1px solid
        rgba(255,255,255,.5);

    border-radius: 8px;

    font-size: 24px;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;

    pointer-events: auto;

}


/* ==================================================
   按鍵位置
================================================== */

.forward {

    left: 64px;

    top: 0;

}

.left {

    left: 8px;

    top: 58px;

}

.back {

    left: 64px;

    top: 58px;

}

.right {

    left: 120px;

    top: 58px;

}


/* ==================================================
   按下狀態
================================================== */

.control.active {

    background:
        rgba(255,255,255,.25);

    border-color:
        rgba(255,255,255,.85);

}

</style>

<body>


<div id="game">


<!-- ==================================================
     開始畫面
================================================== -->

<div id="title">

    <div class="titleWrapper">

        <h1 id="titleText"></h1>

    </div>


    <div class="warning">

        <p>
            內容提示
        </p>

        <p>
            本作品包含心理恐怖、

<div id="threeContainer"></div>

================================================== -->

        data-direction="left">

        ←

    </div>

        data-direction="back">

        ↓

    </div>


    <div
        class="control right"
        data-direction="right">

    </div>

<!-- ==================================================
     Three.js
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>


<script>


/* ==================================================
   Reality...? 標題動畫
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );


const titleWord =
    "Reality...?";


let titleRunning =
    true;


function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function random(min, max) {

    return (
        min +
        Math.random() *
        (max - min)
    );

}


function smoothstep(t) {

    return (
        t *
        t *
        (3 - 2 * t)
    );

}


/* ==================================================
   建立標題
================================================== */

function createTitleLetters() {

    titleText.innerHTML = "";

    const letters = [];


    for (
        let i = 0;
        i < titleWord.length;
        i++
    ) {

        const letter =
            document.createElement(
                "span"
            );

        letter.className =
            "titleLetter";

        letter.textContent =
            titleWord[i];

        letter.style.opacity =
            "0";

        titleText.appendChild(
            letter
        );

        letters.push(
            letter
        );

    }


    return letters;

}


/* ==================================================
   字浮現
================================================== */

function fadeInLetter(letter) {

    return new Promise(
        resolve => {

            const duration =
                random(
                    2400,
                    3000
                );

            const start =
                performance.now();


            function animate(now) {

                if (!titleRunning) {

                    resolve();

                    return;

                }


                const progress =
                    Math.min(

                        (
                            now -
                            start
                        ) /
                        duration,

                        1

                    );


                const eased =
                    smoothstep(
                        progress
                    );


                letter.style.opacity =
                    eased;


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );

}


/* ==================================================
   不規則若隱若現
================================================== */

function startIrregularBreathing(letter) {

    if (
        letter.dataset.breathing ===
        "true"
    )
        return;


    letter.dataset.breathing =
        "true";


    let state =
        "holdBright";


    let stateStart =
        performance.now();


    let stateDuration =
        random(
            1200,
            2600
        );


    let startOpacity =
        1;


    let targetOpacity =
        1;


    function chooseNextState() {

        const roll =
            Math.random();


        if (
            roll < 0.55
        ) {

            state =
                "fadeDown";

            startOpacity =
                1;

            targetOpacity =
                random(
                    0.22,
                    0.38
                );

            stateDuration =
                random(
                    2600,
                    4200
                );

        }

        else {

            state =
                "fadeUp";

            startOpacity =
                parseFloat(
                    letter.style.opacity
                ) || 0.3;

            targetOpacity =
                1;

            stateDuration =
                random(
                    2800,
                    4500
                );

        }


        stateStart =
            performance.now();

    }


    function animate(now) {

        if (!titleRunning)
            return;


        const elapsed =
            now -
            stateStart;


        const progress =
            Math.min(
                elapsed /
                stateDuration,
                1
            );


        if (
            state ===
            "holdBright"
        ) {

            letter.style.opacity =
                "1";

        }

        else if (
            state ===
            "fadeDown"
        ) {

            const eased =
                smoothstep(
                    progress
                );

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                eased;

        }

        else if (
            state ===
            "holdDark"
        ) {

            letter.style.opacity =
                targetOpacity;

        }

        else if (
            state ===
            "fadeUp"
        ) {

            const eased =
                smoothstep(
                    progress
                );

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                eased;

        }


        if (
            progress >= 1
        ) {

            if (
                state ===
                "holdBright"
            ) {

                chooseNextState();

            }

            else if (
                state ===
                "fadeDown"
            ) {

                state =
                    "holdDark";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        700,
                        2200
                    );

            }

            else if (
                state ===
                "holdDark"
            ) {

                state =
                    "fadeUp";

                stateStart =
                    performance.now();

                startOpacity =
                    parseFloat(
                        letter.style.opacity
                    );

                targetOpacity =
                    1;

                stateDuration =
                    random(
                        2800,
                        4500
                    );

            }

            else if (
                state ===
                "fadeUp"
            ) {

                state =
                    "holdBright";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        900,
                        3000
                    );

            }

        }


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


/* ==================================================
   標題循環
================================================== */

async function playTitleAnimation() {

    while (titleRunning) {

        const letters =
            createTitleLetters();


        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (!titleRunning)
                return;


            await fadeInLetter(
                letters[i]
            );


            if (!titleRunning)
                return;


            startIrregularBreathing(
                letters[i]
            );


            await wait(
                random(
                    500,
                    800
                )
            );

        }


        await wait(
            random(
                2900,
                3700
            )
        );


        if (!titleRunning)
            return;


        /*
           最後直接消失
        */

        titleText.innerHTML =
            "";


        await wait(
            random(
                2800,
                4800
            )
        );

    }

}


playTitleAnimation();


/* ==================================================
   Three.js
================================================== */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let started =
    false;


/* ==================================================
   房間尺寸
================================================== */

const ROOM_WIDTH =
    14;

const ROOM_DEPTH =
    14;

const ROOM_HEIGHT =
    10;


/* ==================================================
   玩家
================================================== */

const player = {

    x: 0,

    y: 2,

    z: 4

};


/* ==================================================
   視角
================================================== */

let yaw =
    0;

let pitch =
    0;


/*
   普通第一人稱視角。

   不再額外限制左右角度，
   但把滑動靈敏度降低，
   避免手機一滑就轉太快。
*/

const LOOK_SENSITIVITY_X =
    0.0022;

const LOOK_SENSITIVITY_Y =
    0.0022;


/*
   上下視角限制。
*/

const PITCH_LIMIT =
    1.0;


/* ==================================================
   牆體
================================================== */

/*
   房間尺寸與牆體保持不變。
*/

const WALL_MARGIN =
    0.08;


/* ==================================================
   移動狀態
================================================== */

const movement = {

    forward: false,

    back: false,

    left: false,

    right: false

};


/* ==================================================
   開始
================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    if (started)
        return;


    started =
        true;


    titleRunning =
        false;


    stopAllMovement();


    document
        .getElementById(
            "title"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hint"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "controls"
        )
        .style.display =
        "block";


    createWorld();

}


/* ==================================================
   建立世界
================================================== */

function createWorld() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0xb0b0b0
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100

        );


    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    const ambient =
        new THREE.AmbientLight(

            0xffffff,
            2

        );


    scene.add(
        ambient
    );


    createRoom();

    setupLook();

    setupButtons();

    animate();

}


/* ==================================================
   建立房間
================================================== */

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;


    /* =========================
       地板
    ========================= */

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x707070,

                side:
                    THREE.DoubleSide

            })

        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y =
        0;


    scene.add(
        floor
    );


    /* =========================
       天花板
    ========================= */

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        H;


    scene.add(
        ceiling
    );


    /* =========================
       前牆
    ========================= */

    const front =
        createWall(
            W,
            H,
            0xc2c2c2
        );


    front.position.set(

        0,
        H / 2,
        -D / 2

    );


    scene.add(
        front
    );


    /* =========================
       後牆
    ========================= */

    const back =
        createWall(
            W,
            H,
            0xb7b7b7
        );


    back.position.set(

        0,
        H / 2,
        D / 2

    );


    scene.add(
        back
    );


    /* =========================
       左牆
    ========================= */

    const left =
        createWall(
            D,
            H,
            0xaeaeae
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(

        -W / 2,
        H / 2,
        0

    );


    scene.add(
        left
    );


    /* =========================
       右牆
    ========================= */

    const right =
        createWall(
            D,
            H,
            0xa6a6a6
        );


    right.rotation.y =
        Math.PI / 2;


    right.position.set(

        W / 2,
        H / 2,
        0

    );


    scene.add(
        right
    );


    createRoomEdges(
        W,
        H,
        D
    );

}


/* ==================================================
   建立牆
================================================== */

function createWall(
    width,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            color:
                color,

            side:
                THREE.DoubleSide

        })

    );

}


/* ==================================================
   房間邊線
================================================== */

function createRoomEdges(
    W,
    H,
    D
) {

    const geometry =
        new THREE.BoxGeometry(
            W,
            H,
            D
        );


    const edges =
        new THREE.EdgesGeometry(
            geometry
        );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0x666666,

            transparent:
                true,

            opacity:
                0.45

        });


    const lines =
        new THREE.LineSegments(
            edges,
            material
        );


    lines.position.y =
        H / 2;


    scene.add(
        lines
    );

}


/* ==================================================
   玩家移動
================================================== */

function updatePlayer() {

    if (!camera)
        return;


    const speed =
        0.08;


    let moveX =
        0;

    let moveZ =
        0;


    /*
       前後
    */

    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    if (
        movement.forward
    ) {

        moveX +=
            forwardX;

        moveZ +=
            forwardZ;

    }


    if (
        movement.back
    ) {

        moveX -=
            forwardX;

        moveZ -=
            forwardZ;

    }


    /*
       左右
    */

    if (
        movement.left
    ) {

        moveX -=
            Math.cos(yaw);

        moveZ -=
            Math.sin(yaw);

    }


    if (
        movement.right
    ) {

        moveX +=
            Math.cos(yaw);

        moveZ +=
            Math.sin(yaw);

    }


    /*
       ★ 防止斜向移動速度變快
    */

    const length =
        Math.sqrt(
            moveX * moveX +
            moveZ * moveZ
        );


    if (
        length > 0
    ) {

        moveX =
            moveX /
            length *
            speed;

        moveZ =
            moveZ /
            length *
            speed;

    }


    /*
       ★ 房間邊界

       不再「下一步合法才移動」。

       而是直接把玩家位置
       限制在合法範圍。

       這樣撞牆時：
       只停止位置，
       不碰觸視角。
    */

    const minX =
        -ROOM_WIDTH / 2 +
        WALL_MARGIN;


    const maxX =
        ROOM_WIDTH / 2 -
        WALL_MARGIN;


    const minZ =
        -ROOM_DEPTH / 2 +
        WALL_MARGIN;


    const maxZ =
        ROOM_DEPTH / 2 -
        WALL_MARGIN;


    player.x =
        Math.max(
            minX,
            Math.min(
                maxX,
                player.x + moveX
            )
        );


    player.z =
        Math.max(
            minZ,
            Math.min(
                maxZ,
                player.z + moveZ
            )
        );


    /*
       ★ 相機只讀取玩家位置
       不會因為碰撞修改 yaw / pitch
    */

    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* ==================================================
   視角控制
================================================== */

let looking =
    false;

let lookPointerId =
    null;

let lastLookX =
    0;

let lastLookY =
    0;


/*
   視角只在 renderer canvas 上工作。

   左下角按鍵是獨立 DOM，
   不會進入這個系統。
*/

function setupLook() {

    const canvas =
        renderer.domElement;


    canvas.style.touchAction =
        "none";


    canvas.addEventListener(

        "pointerdown",

        function(event) {

            /*
               滑鼠只接受左鍵。
            */

            if (
                event.pointerType ===
                "mouse" &&
                event.button !== 0
            )
                return;


            looking =
                true;


            lookPointerId =
                event.pointerId;


            lastLookX =
                event.clientX;


            lastLookY =
                event.clientY;

        }

    );


    canvas.addEventListener(

        "pointermove",

        function(event) {

            if (
                !looking ||
                event.pointerId !==
                lookPointerId
            )
                return;


            const dx =
                event.clientX -
                lastLookX;


            const dy =
                event.clientY -
                lastLookY;


            /*
               左右
            */

            yaw -=
                dx *
                LOOK_SENSITIVITY_X;


            /*
               上下
            */

            pitch -=
                dy *
                LOOK_SENSITIVITY_Y;


            pitch =
                Math.max(

                    -PITCH_LIMIT,

                    Math.min(
                        PITCH_LIMIT,
                        pitch
                    )

                );


            lastLookX =
                event.clientX;


            lastLookY =
                event.clientY;


            event.preventDefault();

        },

        {
            passive:
                false
        }

    );


    function stopLook(event) {

        if (
            event &&
            event.pointerId !==
            lookPointerId
        )
            return;


        looking =
            false;


        lookPointerId =
            null;

    }


    canvas.addEventListener(
        "pointerup",
        stopLook
    );


    canvas.addEventListener(
        "pointercancel",
        stopLook
    );


    canvas.addEventListener(
        "pointerleave",
        function(event) {

            /*
               只對滑鼠離開處理。

               手機觸控不因為
               手指暫時離開 canvas
               而亂掉。
            */

            if (
                event.pointerType ===
                "mouse"
            ) {

                stopLook(event);

            }

        }
    );

}


/* ==================================================
   移動按鍵
================================================== */

function setupButtons() {

    const buttons =
        document.querySelectorAll(
            ".control"
        );


    buttons.forEach(

        function(button) {

            const direction =
                button.dataset.direction;


            /*
               ★ 不使用 pointer capture。

               這是這一版的重要改動。
            */

            button.addEventListener(

                "pointerdown",

                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    movement[
                        direction
                    ] = true;


                    button.classList.add(
                        "active"
                    );

                },

                {
                    passive:
                        false
                }

            );


            button.addEventListener(

                "pointerup",

                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    movement[
                        direction
                    ] = false;


                    button.classList.remove(
                        "active"
                    );

                },

                {
                    passive:
                        false
                }

            );


            button.addEventListener(

                "pointercancel",

                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    movement[
                        direction
                    ] = false;


                    button.classList.remove(
                        "active"
                    );

                },

                {
                    passive:
                        false
                }

            );

        }

    );


    /*
       ★ 全域安全解除。

       手指突然離開畫面、
       系統取消觸控、
       瀏覽器中斷 pointer，
       都會把按鍵歸零。
    */

    window.addEventListener(

        "pointerup",

        function() {

            stopAllMovement();

        }

    );


    window.addEventListener(

        "pointercancel",

        function() {

            stopAllMovement();

        }

    );

}


/* ==================================================
   停止所有移動
================================================== */

function stopAllMovement() {

    movement.forward =
        false;

    movement.back =
        false;

    movement.left =
        false;

    movement.right =
        false;


    document
        .querySelectorAll(
            ".control"
        )
        .forEach(

            function(button) {

                button.classList.remove(
                    "active"
                );

            }

        );

}


/* ==================================================
   遊戲循環
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (started) {

        updatePlayer();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* ==================================================
   螢幕尺寸
================================================== */

window.addEventListener(

    "resize",

    function() {

        if (
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>
