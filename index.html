<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

}


#text {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(60px, 15vw, 130px);

    font-weight: 300;

    letter-spacing: 10px;

    white-space: nowrap;

}


.letter {

    display: inline-block;

    opacity: 0;

}

</style>

</head>


<body>


<div id="text"></div>



<script>


const text =
    document.getElementById("text");


const word =
    "Reality...?";



/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }

    );

}



/* ==================================================
   新字顯現

   1% → 100%

   完全不閃
================================================== */

function revealLetter(
    letter,
    oldLetters
) {

    return new Promise(

        function(resolve) {


            const duration =
                1400;


            const start =
                performance.now();



            function animate(now) {


                const progress =
                    Math.min(

                        (now - start) /
                        duration,

                        1

                    );


                /*
                   新字：

                   1 → 100
                */

                letter.style.opacity =
                    0.01 +
                    (
                        0.99 *
                        progress
                    );



                /*
                   舊字：

                   使用連續波形
                   做非常柔和的透明度變化
                */

                oldLetters.forEach(

                    function(
                        oldLetter,
                        index
                    ) {


                        /*
                           每個字有不同相位

                           所以不會全部一起動
                        */

                        const phase =
                            index *
                            1.7;


                        /*
                           緩慢波動

                           範圍：

                           約 86% ～ 100%
                        */

                        const wave =
                            Math.sin(

                                progress *
                                Math.PI *
                                2
                                +
                                phase

                            );


                        const opacity =
                            0.93 +
                            (
                                wave *
                                0.07
                            );


                        oldLetter.style.opacity =
                            opacity;

                    }

                );



                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {


                    /*
                       新字固定 100%
                    */

                    letter.style.opacity =
                        "1";


                    /*
                       舊字也回到 100%

                       不停頓、不跳閃
                    */

                    oldLetters.forEach(

                        function(
                            oldLetter
                        ) {

                            oldLetter.style.opacity =
                                "1";

                        }

                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}



/* ==================================================
   主動畫
================================================== */

async function start() {


    /*
       開始黑屏
    */

    await wait(
        1500
    );



    /*
       一個字一個字增加
    */

    for (
        let i = 0;

        i < word.length;

        i++
    ) {


        /*
           建立新字
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            word[i];


        /*
           新字從 1%
        */

        letter.style.opacity =
            "0.01";


        text.appendChild(
            letter
        );



        /*
           取得前面已完成的字
        */

        const oldLetters =
            Array.from(
                text.querySelectorAll(
                    ".letter"
                )
            ).slice(
                0,
                -1
            );



        /*
           新字顯現

           同時舊字做
           非常柔和的漸變
        */

        await revealLetter(

            letter,

            oldLetters

        );



        /*
           停頓
        */

        await wait(
            1300
        );

    }



    /*
       ==========================================
       Reality...? 完整狀態
       ==========================================
    */

    await wait(
        4000
    );



    /*
       ==========================================
       整個瞬間消失
       ==========================================
    */

    text.innerHTML =
        "";



    /*
       黑屏
    */

    await wait(
        4500
    );



    /*
       再來一次
    */

    start();

}



/* ==================================================
   啟動
================================================== */

start();

</script>

</body>

</html>
