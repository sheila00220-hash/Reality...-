<style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const titleText =
    document.getElementById(
        "titleText"
    );

const titleWord =
    "Reality...?";

let titleRunning = true;

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}

function random(min, max) {

    return min +
        Math.random() *
        (max - min);

}

function smoothstep(t) {

    return t * t * (3 - 2 * t);

}

function createTitleLetters() {

    titleText.innerHTML = "";

    const letters = [];

    for (
        let i = 0;
        i < titleWord.length;
        i++
    ) {

        const letter =
            document.createElement(
                "span"
            );

        letter.className =
            "titleLetter";

        letter.textContent =
            titleWord[i];

        titleText.appendChild(
            letter
        );

        letters.push(letter);

    }

    return letters;

}

function fadeInLetter(letter) {

    return new Promise(resolve => {

        const duration =
            random(2400, 3000);

        const start =
            performance.now();

        function animate(now) {

            if (!titleRunning) {

                resolve();

                return;

            }

            const progress =
                Math.min(
                    (now - start) /
                    duration,
                    1
                );

            letter.style.opacity =
                smoothstep(progress);

            if (
                progress < 1
            ) {

                requestAnimationFrame(
                    animate
                );

            }

            else {

                letter.style.opacity =
                    "1";

                resolve();

            }

        }

        requestAnimationFrame(
            animate
        );

    });

}

function startIrregularBreathing(letter) {

    if (
        letter.dataset.breathing ===
        "true"
    )
        return;

    letter.dataset.breathing =
        "true";

    let state =
        "holdBright";

    let stateStart =
        performance.now();

    let stateDuration =
        random(1200, 2600);

    let startOpacity = 1;

    let targetOpacity = 1;

    function chooseNextState() {

        if (
            Math.random() < .55
        ) {

            state =
                "fadeDown";

            startOpacity = 1;

            targetOpacity =
                random(.22, .38);

            stateDuration =
                random(
                    2600,
                    4200
                );

        }

        else {

            state =
                "fadeUp";

            startOpacity =
                parseFloat(
                    letter.style.opacity
                ) || .3;

            targetOpacity = 1;

            stateDuration =
                random(
                    2800,
                    4500
                );

        }

        stateStart =
            performance.now();

    }

    function animate(now) {

        if (!titleRunning)
            return;

        const elapsed =
            now - stateStart;

        const progress =
            Math.min(
                elapsed /
                stateDuration,
                1
            );

        if (
            state ===
            "holdBright"
        ) {

            letter.style.opacity =
                "1";

        }

        else if (
            state ===
            "fadeDown"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }

        else if (
            state ===
            "holdDark"
        ) {

            letter.style.opacity =
                targetOpacity;

        }

        else if (
            state ===
            "fadeUp"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }

        if (
            progress >= 1
        ) {

            if (
                state ===
                "holdBright"
            ) {

                chooseNextState();

            }

            else if (
                state ===
                "fadeDown"
            ) {

                state =
                    "holdDark";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        700,
                        2200
                    );

            }

            else if (
                state ===
                "holdDark"
            ) {

                state =
                    "fadeUp";

                stateStart =
                    performance.now();

                startOpacity =
                    parseFloat(
                        letter.style.opacity
                    );

                targetOpacity = 1;

                stateDuration =
                    random(
                        2800,
                        4500
                    );

            }

            else {

                state =
                    "holdBright";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        900,
                        3000
                    );

            }

        }

        requestAnimationFrame(
            animate
        );

    }

    requestAnimationFrame(
        animate
    );

}

async function playTitleAnimation() {

    while (titleRunning) {

        const letters =
            createTitleLetters();

        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (!titleRunning)
                return;

            await fadeInLetter(
                letters[i]
            );

            startIrregularBreathing(
                letters[i]
            );

            await wait(
                random(
                    500,
                    800
                )
            );

        }

        await wait(
            random(
                2900,
                3700
            )
        );

        if (!titleRunning)
            return;

        titleText.innerHTML = "";

        await wait(
            random(
                2800,
                4800
            )
        );

    }

}

playTitleAnimation();

let scene = null;

let camera = null;

let renderer = null;

let started = false;

const ROOM_WIDTH = 14;

const ROOM_DEPTH = 14;

const ROOM_HEIGHT = 10;

const CHAPTER1_AUTO_RESET = true;

const PLAYER_RADIUS = .28;

const WALL_BUFFER = .01;

const PLAYER_EYE_HEIGHT = 1.65;

const player = {

    x: 0,

    y: PLAYER_EYE_HEIGHT,

    z: 4

};

let yaw = 0;

let pitch = 0;

const PITCH_LIMIT = 1.0;

const LOOK_SENSITIVITY_X =
    .0022;

const LOOK_SENSITIVITY_Y =
    .0022;

const MIN_FOV = 55;

const MAX_FOV = 95;

const DEFAULT_FOV = 75;

const movement = {

    x: 0,

    y: 0

};

function getPlayableBounds() {

    const halfW =
        ROOM_WIDTH / 2;

    const halfD =
        ROOM_DEPTH / 2;

    return {

        minX:
            -halfW +
            PLAYER_RADIUS +
            WALL_BUFFER,

        maxX:
            halfW -
            PLAYER_RADIUS -
            WALL_BUFFER,

        minZ:
            -halfD +
            PLAYER_RADIUS +
            WALL_BUFFER,

        maxZ:
            halfD -
            PLAYER_RADIUS -
            WALL_BUFFER

    };

}

function canPlayerOccupy(
    x,
    z
) {

    const bounds =
        getPlayableBounds();

    return (

        x >= bounds.minX &&

        x <= bounds.maxX &&

        z >= bounds.minZ &&

        z <= bounds.maxZ

    );

}

function resolveMovement(
    moveX,
    moveZ
) {

    const bounds =
        getPlayableBounds();

    const targetX =
        player.x +
        moveX;

    if (
        targetX >= bounds.minX &&
        targetX <= bounds.maxX
    ) {

        player.x =
            targetX;

    }

    else {

        player.x =
            Math.max(
                bounds.minX,
                Math.min(
                    bounds.maxX,
                    player.x
                )
            );

    }

    const targetZ =
        player.z +
        moveZ;

    if (
        targetZ >= bounds.minZ &&
        targetZ <= bounds.maxZ
    ) {

        player.z =
            targetZ;

    }

    else {

        player.z =
            Math.max(
                bounds.minZ,
                Math.min(
                    bounds.maxZ,
                    player.z
                )
            );

    }

}

function updatePlayer() {

    if (!camera)
        return;

    const speed = .08;

    const cameraDirection =
        new THREE.Vector3();

    camera.getWorldDirection(
        cameraDirection
    );

    cameraDirection.y = 0;

    if (
        cameraDirection.lengthSq() >
        0
    ) {

        cameraDirection.normalize();

    }

    const forwardX =
        cameraDirection.x;

    const forwardZ =
        cameraDirection.z;

    const rightX =
        -forwardZ;

    const rightZ =
        forwardX;

    const inputForward =
        -movement.y;

    const inputRight =
        movement.x;

    let inputX = 0;

    let inputZ = 0;

    inputX +=
        forwardX *
        inputForward;

    inputZ +=
        forwardZ *
        inputForward;

    inputX +=
        rightX *
        inputRight;

    inputZ +=
        rightZ *
        inputRight;

    const length =
        Math.hypot(
            inputX,
            inputZ
        );

    if (
        length > 1
    ) {

        inputX /=
            length;

        inputZ /=
            length;

    }

    if (
        length > 0
    ) {

        const moveX =
            inputX *
            speed;

        const moveZ =
            inputZ *
            speed;

        resolveMovement(
            moveX,
            moveZ
        );

    }

    updateCamera();

}

function updateCamera() {

    camera.position.set(

        player.x,

        player.y,

        player.z

    );

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}
    let chapter1Eyes = [];

let chapter1FloorEye = null;

let chapter1Falling = false;

let chapter1FallStart = 0;

const chapter1TextureLoader =
    new THREE.TextureLoader();

const chapter1SocketTexture =
    chapter1TextureLoader.load(
        "eye_socket.png"
    );

const chapter1EyeballTexture =
    chapter1TextureLoader.load(
        "eyeball.png"
    );

chapter1SocketTexture.colorSpace =
    THREE.SRGBColorSpace;

chapter1EyeballTexture.colorSpace =
    THREE.SRGBColorSpace;

function createChapter1Eye(
    position,
    rotation,
    scale,
    isFloorEye = false
) {

    const group =
        new THREE.Group();

    group.position.copy(
        position
    );

    group.rotation.copy(
        rotation
    );

    const socketMaterial =
        new THREE.MeshBasicMaterial({

            map:
                chapter1SocketTexture,

            transparent:
                true,

            depthWrite:
                false,

            side:
                THREE.DoubleSide

        });

    const socket =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1.55,
                1.12
            ),

            socketMaterial

        );

    const eyeballMaterial =
        new THREE.MeshBasicMaterial({

            map:
                chapter1EyeballTexture,

            transparent:
                true,

            depthWrite:
                false,

            side:
                THREE.DoubleSide

        });

    const eyeball =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                0.72,
                0.70
            ),

            eyeballMaterial

        );

    eyeball.position.z =
        0.035;

    group.add(
        socket
    );

    group.add(
        eyeball
    );

    group.scale.set(
        scale,
        scale,
        scale
    );

    scene.add(
        group
    );

    const eyeData = {

        group:
            group,

        socket:
            socket,

        eyeball:
            eyeball,

        baseScale:
            scale,

        currentScale:
            scale,

        targetScale:
            scale,

        growth:
            random(
                0.0025,
                0.006
            ),

        eyeOffset:
            random(
                0,
                Math.PI * 2
            ),

        phase:
            random(
                0,
                Math.PI * 2
            ),

        isFloorEye:
            isFloorEye,

        active:
            true

    };

    chapter1Eyes.push(
        eyeData
    );

    if (isFloorEye) {

        chapter1FloorEye =
            eyeData;

    }

    return eyeData;

}

function updateChapter1EyeTracking() {

    if (!camera)
        return;

    const playerPosition =
        camera.position;

    for (
        const eye of chapter1Eyes
    ) {

        if (
            !eye.active
        )
            continue;

        const worldEyePosition =
            new THREE.Vector3();

        eye.group.getWorldPosition(
            worldEyePosition
        );

        const direction =
            playerPosition.clone()
                .sub(worldEyePosition);

        eye.group.worldToLocal(
            direction
                .add(worldEyePosition)
        );

        const maxOffset =
            0.105;

        const offsetX =
            THREE.MathUtils.clamp(
                direction.x * 0.035,
                -maxOffset,
                maxOffset
            );

        const offsetY =
            THREE.MathUtils.clamp(
                direction.y * 0.035,
                -maxOffset,
                maxOffset
            );

        const time =
            performance.now() *
            0.0007;

        const idleX =
            Math.sin(
                time +
                eye.phase
            ) *
            0.006;

        const idleY =
            Math.cos(
                time * 0.83 +
                eye.phase
            ) *
            0.004;

        eye.eyeball.position.x =
            offsetX +
            idleX;

        eye.eyeball.position.y =
            offsetY +
            idleY;

    }

}

function updateChapter1EyeGrowth() {

    if (!camera)
        return;

    for (
        const eye of chapter1Eyes
    ) {

        if (
            !eye.active
        )
            continue;

        const distance =
            eye.group.position.distanceTo(
                camera.position
            );

        const proximity =
            THREE.MathUtils.clamp(
                1 -
                distance / 11,
                0,
                1
            );

        eye.targetScale +=
            eye.growth *
            (
                0.35 +
                proximity * 1.65
            );

        eye.targetScale =
            Math.min(
                eye.targetScale,
                eye.baseScale * 6
            );

        eye.currentScale =
            THREE.MathUtils.lerp(
                eye.currentScale,
                eye.targetScale,
                0.035
            );

        eye.group.scale.set(
            eye.currentScale,
            eye.currentScale,
            eye.currentScale
        );

    }

}

function checkChapter1FloorHole() {

    if (
        chapter1Falling ||
        !chapter1FloorEye
    )
        return;

    const eye =
        chapter1FloorEye;

    const dx =
        player.x -
        eye.group.position.x;

    const dz =
        player.z -
        eye.group.position.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );

    if (
        distance < 0.72
    ) {

        triggerChapter1Fall();

    }

}

function triggerChapter1Fall() {

    if (chapter1Falling)
        return;

    chapter1Falling =
        true;

    chapter1FallStart =
        performance.now();

    if (
        chapter1FloorEye
    ) {

        chapter1FloorEye.active =
            false;

        scene.remove(
            chapter1FloorEye.group
        );

    }

}

let chapter1HoleMesh = null;

function createChapter1Hole(
    position
) {

    const material =
        new THREE.MeshBasicMaterial({

            color:
                0x000000,

            transparent:
                true,

            opacity:
                0,

            side:
                THREE.DoubleSide,

            depthWrite:
                false

        });

    const hole =
        new THREE.Mesh(

            new THREE.CircleGeometry(
                1.15,
                48
            ),

            material

        );

    hole.rotation.x =
        -Math.PI / 2;

    hole.position.copy(
        position
    );

    hole.position.y =
        -0.006;

    scene.add(
        hole
    );

    chapter1HoleMesh =
        hole;

    return hole;

}

function updateChapter1Fall() {

    if (
        !chapter1Falling
    )
        return;

    const elapsed =
        performance.now() -
        chapter1FallStart;

    const progress =
        Math.min(
            elapsed / 1000,
            1
        );

    if (
        chapter1HoleMesh
    ) {

        chapter1HoleMesh.material.opacity =
            Math.min(
                progress * 1.8,
                1
            );

    }

    const fallAmount =
        progress *
        progress *
        3.5;

    camera.position.y =
        PLAYER_EYE_HEIGHT -
        fallAmount;

    camera.fov =
        THREE.MathUtils.lerp(
            DEFAULT_FOV,
            100,
            progress
        );

    camera.updateProjectionMatrix();

    if (
        elapsed > 900
    ) {

        renderer.setClearColor(
            0x000000
        );

    }

    if (
        elapsed > 1200
    ) {

        resetChapter1();

    }

}

function createChapter1Eyes() {

    chapter1Eyes = [];

    chapter1FloorEye = null;

    chapter1Falling = false;

    chapter1FallStart = 0;

    const wallCount =
        18;

    const floorCount =
        16;

    const ceilingCount =
        16;

    for (
        let i = 0;
        i < wallCount;
        i++
    ) {

        const x =
            random(
                -6.1,
                6.1
            );

        const y =
            random(
                0.8,
                9.1
            );

        createChapter1Eye(

            new THREE.Vector3(
                x,
                y,
                -6.94
            ),

            new THREE.Euler(
                0,
                0,
                0
            ),

            random(
                0.32,
                0.58
            )

        );

    }

    for (
        let i = 0;
        i < wallCount;
        i++
    ) {

        const x =
            random(
                -6.1,
                6.1
            );

        const y =
            random(
                0.8,
                9.1
            );

        createChapter1Eye(

            new THREE.Vector3(
                x,
                y,
                6.94
            ),

            new THREE.Euler(
                0,
                Math.PI,
                0
            ),

            random(
                0.32,
                0.58
            )

        );

    }

    for (
        let i = 0;
        i < wallCount;
        i++
    ) {

        const z =
            random(
                -6.1,
                6.1
            );

        const y =
            random(
                0.8,
                9.1
            );

        createChapter1Eye(

            new THREE.Vector3(
                -6.94,
                y,
                z
            ),

            new THREE.Euler(
                0,
                -Math.PI / 2,
                0
            ),

            random(
                0.32,
                0.58
            )

        );

    }

    for (
        let i = 0;
        i < wallCount;
        i++
    ) {

        const z =
            random(
                -6.1,
                6.1
            );

        const y =
            random(
                0.8,
                9.1
            );

        createChapter1Eye(

            new THREE.Vector3(
                6.94,
                y,
                z
            ),

            new THREE.Euler(
                0,
                Math.PI / 2,
                0
            ),

            random(
                0.32,
                0.58
            )

        );

        }
        for (
        let i = 0;
        i < floorCount;
        i++
    ) {

        let x;
        let z;

        do {

            x =
                random(
                    -6.1,
                    6.1
                );

            z =
                random(
                    -6.1,
                    6.1
                );

        }

        while (

            Math.hypot(
                x - player.x,
                z - player.z
            ) < 1.8

        );

        createChapter1Eye(

            new THREE.Vector3(
                x,
                0.02,
                z
            ),

            new THREE.Euler(
                -Math.PI / 2,
                0,
                0
            ),

            random(
                0.25,
                0.48
            ),

            false

        );

    }

    const holeX =
        random(
            -4.5,
            4.5
        );

    const holeZ =
        random(
            -5.2,
            -2.5
        );

    createChapter1Eye(

        new THREE.Vector3(
            holeX,
            0.025,
            holeZ
        ),

        new THREE.Euler(
            -Math.PI / 2,
            0,
            0
        ),

        0.62,

        true

    );

    createChapter1Hole(

        new THREE.Vector3(
            holeX,
            0,
            holeZ
        )

    );

    for (
        let i = 0;
        i < ceilingCount;
        i++
    ) {

        const x =
            random(
                -6.1,
                6.1
            );

        const z =
            random(
                -6.1,
                6.1
            );

        createChapter1Eye(

            new THREE.Vector3(
                x,
                9.98,
                z
            ),

            new THREE.Euler(
                Math.PI / 2,
                0,
                0
            ),

            random(
                0.28,
                0.52
            )

        );

    }

}

function updateChapter1() {

    if (
        !started ||
        !scene ||
        !camera
    )
        return;

    updateChapter1EyeTracking();

    updateChapter1EyeGrowth();

    checkChapter1FloorHole();

    updateChapter1Fall();

}

function resetChapter1() {

    chapter1Falling =
        false;

    chapter1FallStart =
        0;

    player.x =
        0;

    player.y =
        PLAYER_EYE_HEIGHT;

    player.z =
        4;

    yaw =
        0;

    pitch =
        0;

    camera.fov =
        DEFAULT_FOV;

    camera.updateProjectionMatrix();

    if (
        chapter1HoleMesh
    ) {

        chapter1HoleMesh.material.opacity =
            0;

    }

    for (
        const eye of chapter1Eyes
    ) {

        scene.remove(
            eye.group
        );

    }

    createChapter1Eyes();

    updateCamera();

}

function createWorld() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0xb0b0b0
        );

    camera =
        new THREE.PerspectiveCamera(

            DEFAULT_FOV,

            window.innerWidth /
            window.innerHeight,

            .1,

            100

        );

    camera.position.set(

        player.x,

        player.y,

        player.z

    );

    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });

    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );

    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );

    scene.add(

        new THREE.AmbientLight(

            0xffffff,

            2

        )

    );

    createRoom();

    createChapter1Eyes();

    setupTouch();

    setupJoystick();

    animate();

}

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color: 0x707070,

                side:
                    THREE.DoubleSide

            })

        );

    floor.rotation.x =
        -Math.PI / 2;

    scene.add(
        floor
    );

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color: 0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y =
        H;

    scene.add(
        ceiling
    );

    const front =
        createWall(
            W,
            H,
            0xc2c2c2
        );

    front.position.set(

        0,

        H / 2,

        -D / 2

    );

    scene.add(
        front
    );

    const back =
        createWall(
            W,
            H,
            0xb7b7b7
        );

    back.position.set(

        0,

        H / 2,

        D / 2

    );

    scene.add(
        back
    );

    const left =
        createWall(
            D,
            H,
            0xaeaeae
        );

    left.rotation.y =
        Math.PI / 2;

    left.position.set(

        -W / 2,

        H / 2,

        0

    );

    scene.add(
        left
    );

    const right =
        createWall(
            D,
            H,
            0xa6a6a6
        );

    right.rotation.y =
        Math.PI / 2;

    right.position.set(

        W / 2,

        H / 2,

        0

    );

    scene.add(
        right
    );

    createRoomEdges(
        W,
        H,
        D
    );

    createInvisibleCollisionWalls(
        W,
        H,
        D
    );

}

function createWall(
    width,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            color: color,

            side:
                THREE.DoubleSide

        })

    );

}

function createInvisibleCollisionWalls(
    W,
    H,
    D
) {

    const material =
        new THREE.MeshBasicMaterial({

            transparent: true,

            opacity: 0,

            depthWrite: false

        });

    const thickness =
        .45;

    const front =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                W + thickness * 2,

                H,

                thickness

            ),

            material

        );

    front.position.set(

        0,

        H / 2,

        -D / 2 +
        thickness / 2

    );

    front.visible = false;

    scene.add(
        front
    );

    const back =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                W + thickness * 2,

                H,

                thickness

            ),

            material

        );

    back.position.set(

        0,

        H / 2,

        D / 2 -
        thickness / 2

    );

    back.visible = false;

    scene.add(
        back
    );

    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                thickness,

                H,

                D

            ),

            material

        );

    left.position.set(

        -W / 2 +
        thickness / 2,

        H / 2,

        0

    );

    left.visible = false;

    scene.add(
        left
    );

    const right =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                thickness,

                H,

                D

            ),

            material

        );

    right.position.set(

        W / 2 -
        thickness / 2,

        H / 2,

        0

    );

    right.visible = false;

    scene.add(
        right
    );

}

function createRoomEdges(
    W,
    H,
    D
) {

    const geometry =
        new THREE.BoxGeometry(
            W,
            H,
            D
        );

    const edges =
        new THREE.EdgesGeometry(
            geometry
        );

    const material =
        new THREE.LineBasicMaterial({

            color: 0x666666,

            transparent: true,

            opacity: .45

        });

    const lines =
        new THREE.LineSegments(

            edges,

            material

        );

    lines.position.y =
        H / 2;

    scene.add(
        lines
    );

}

const activeTouches =
    new Map();

let touchMode =
    "none";

let lookPointerId =
    null;

let lastLookX = 0;

let lastLookY = 0;

let previousPinchDistance =
    null;

let mouseLooking =
    false;

function getPinchDistance() {

    const points =
        Array.from(
            activeTouches.values()
        );

    if (
        points.length < 2
    )
        return null;

    const a =
        points[0];

    const b =
        points[1];

    return Math.hypot(

        b.x - a.x,

        b.y - a.y

    );

}

function enterPinchMode() {

    touchMode =
        "pinch";

    lookPointerId =
        null;

    previousPinchDistance =
        getPinchDistance();

}

function enterLookMode() {

    const entries =
        Array.from(
            activeTouches.entries()
        );

    if (
        entries.length !== 1
    ) {

        touchMode =
            "none";

        lookPointerId =
            null;

        return;

    }

    const [
        id,
        point
    ] = entries[0];

    touchMode =
        "look";

    lookPointerId =
        id;

    lastLookX =
        point.x;

    lastLookY =
        point.y;

    previousPinchDistance =
        null;

}

function setupTouch() {

    const canvas =
        renderer.domElement;

    canvas.style.touchAction =
        "none";

    canvas.addEventListener(

        "pointerdown",

        event => {

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (
                    event.button !== 0
                )
                    return;

                mouseLooking =
                    true;

                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

                return;

            }

            event.preventDefault();

            activeTouches.set(

                event.pointerId,

                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );

            if (
                activeTouches.size ===
                1
            ) {

                touchMode =
                    "look";

                lookPointerId =
                    event.pointerId;

                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

            }

            else {

                enterPinchMode();

            }

        },

        {
            passive: false
        }

    );
        canvas.addEventListener(

        "pointermove",

        event => {

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (!mouseLooking)
                    return;

                const dx =
                    event.clientX -
                    lastLookX;

                const dy =
                    event.clientY -
                    lastLookY;

                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;

                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;

                pitch =
                    Math.max(

                        -PITCH_LIMIT,

                        Math.min(

                            PITCH_LIMIT,

                            pitch

                        )

                    );

                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

                return;

            }

            if (
                !activeTouches.has(
                    event.pointerId
                )
            )
                return;

            event.preventDefault();

            activeTouches.set(

                event.pointerId,

                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );

            if (
                touchMode ===
                "pinch"
            ) {

                const distance =
                    getPinchDistance();

                if (

                    distance !== null &&

                    previousPinchDistance !== null

                ) {

                    const delta =
                        distance -
                        previousPinchDistance;

                    camera.fov +=
                        delta *
                        .08;

                    camera.fov =
                        Math.max(

                            MIN_FOV,

                            Math.min(

                                MAX_FOV,

                                camera.fov

                            )

                        );

                    camera.updateProjectionMatrix();

                }

                previousPinchDistance =
                    distance;

                return;

            }

            if (

                touchMode ===
                    "look" &&

                event.pointerId ===
                    lookPointerId

            ) {

                const dx =
                    event.clientX -
                    lastLookX;

                const dy =
                    event.clientY -
                    lastLookY;

                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;

                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;

                pitch =
                    Math.max(

                        -PITCH_LIMIT,

                        Math.min(

                            PITCH_LIMIT,

                            pitch

                        )

                    );

                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

            }

        },

        {
            passive: false
        }

    );

    function endTouch(event) {

        if (
            event.pointerType ===
            "mouse"
        ) {

            mouseLooking =
                false;

            return;

        }

        if (
            !activeTouches.has(
                event.pointerId
            )
        )
            return;

        activeTouches.delete(
            event.pointerId
        );

        if (
            activeTouches.size === 0
        ) {

            touchMode =
                "none";

            lookPointerId =
                null;

            previousPinchDistance =
                null;

        }

        else if (
            activeTouches.size === 1
        ) {

            enterLookMode();

        }

    }

    canvas.addEventListener(
        "pointerup",
        endTouch
    );

    canvas.addEventListener(
        "pointercancel",
        endTouch
    );

}

const joystickBase =
    document.getElementById(
        "joystickBase"
    );

const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );

let joystickPointerId =
    null;

let joystickActive =
    false;

const JOYSTICK_RADIUS =
    37;

const JOYSTICK_DEAD_ZONE =
    .12;

function getJoystickCenter() {

    const rect =
        joystickBase
            .getBoundingClientRect();

    return {

        x:
            rect.left +
            rect.width / 2,

        y:
            rect.top +
            rect.height / 2

    };

}

function updateJoystick(
    clientX,
    clientY
) {

    const center =
        getJoystickCenter();

    let dx =
        clientX -
        center.x;

    let dy =
        clientY -
        center.y;

    const distance =
        Math.hypot(
            dx,
            dy
        );

    if (
        distance >
        JOYSTICK_RADIUS
    ) {

        const scale =
            JOYSTICK_RADIUS /
            distance;

        dx *= scale;

        dy *= scale;

    }

    const x =
        dx /
        JOYSTICK_RADIUS;

    const y =
        dy /
        JOYSTICK_RADIUS;

    const magnitude =
        Math.hypot(
            x,
            y
        );

    if (
        magnitude <
        JOYSTICK_DEAD_ZONE
    ) {

        movement.x =
            0;

        movement.y =
            0;

    }

    else {

        const remappedMagnitude =
            (
                magnitude -
                JOYSTICK_DEAD_ZONE
            ) /
            (
                1 -
                JOYSTICK_DEAD_ZONE
            );

        const scale =
            remappedMagnitude /
            magnitude;

        movement.x =
            x * scale;

        movement.y =
            y * scale;

    }

    joystickKnob.style.transform =

        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}

function stopJoystick() {

    joystickPointerId =
        null;

    joystickActive =
        false;

    movement.x =
        0;

    movement.y =
        0;

    joystickBase.classList.remove(
        "active"
    );

    joystickKnob.style.transform =
        "translate(-50%, -50%)";

}

function setupJoystick() {

    joystickBase.addEventListener(

        "pointerdown",

        event => {

            event.preventDefault();

            event.stopPropagation();

            if (
                joystickPointerId !==
                null
            )
                return;

            if (

                event.pointerType !==
                    "touch" &&

                event.pointerType !==
                    "pen"

            )
                return;

            joystickPointerId =
                event.pointerId;

            joystickActive =
                true;

            joystickBase.classList.add(
                "active"
            );

            try {

                joystickBase.setPointerCapture(
                    event.pointerId
                );

            }

            catch (_) {}

            updateJoystick(

                event.clientX,

                event.clientY

            );

        },

        {
            passive: false
        }

    );

    joystickBase.addEventListener(

        "pointermove",

        event => {

            if (

                !joystickActive ||

                event.pointerId !==
                    joystickPointerId

            )
                return;

            event.preventDefault();

            event.stopPropagation();

            updateJoystick(

                event.clientX,

                event.clientY

            );

        },

        {
            passive: false
        }

    );

    joystickBase.addEventListener(

        "pointerup",

        event => {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;

            event.preventDefault();

            event.stopPropagation();

            stopJoystick();

        },

        {
            passive: false
        }

    );

    joystickBase.addEventListener(

        "pointercancel",

        event => {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;

            stopJoystick();

        },

        {
            passive: false
        }

    );

    joystickBase.addEventListener(

        "lostpointercapture",

        () => {

        }

    );

}

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );

function startGame() {

    if (started)
        return;

    started = true;

    titleRunning =
        false;

    stopJoystick();

    document
        .getElementById(
            "title"
        )
        .style.display =
        "none";

    document
        .getElementById(
            "hint"
        )
        .style.display =
        "block";

    document
        .getElementById(
            "joystickArea"
        )
        .style.display =
        "block";

    createWorld();

}

function animate() {

    requestAnimationFrame(
        animate
    );

    if (started) {

        updatePlayer();

        updateChapter1();

    }

    if (

        renderer &&

        scene &&

        camera

    ) {

        renderer.render(
            scene,
            camera
        );

    }

}

window.addEventListener(

    "resize",

    () => {

        if (
            !camera ||
            !renderer
        )
            return;

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);

window.addEventListener(

    "blur",

    () => {

        stopJoystick();

        activeTouches.clear();

        touchMode =
            "none";

        lookPointerId =
            null;

        mouseLooking =
            false;

    }

);

</script>
