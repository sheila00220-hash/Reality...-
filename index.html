<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

}


#text {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    /*
       比上一版小一點
       避免手機畫面超出
    */

    font-size:
        clamp(42px, 11vw, 90px);

    font-weight: 300;

    /*
       字距收窄
    */

    letter-spacing: 5px;

    white-space: nowrap;

}


.letter {

    display: inline-block;

    opacity: 0;

}

</style>

</head>


<body>


<div id="text"></div>


<script>


const text =
    document.getElementById("text");


const word =
    "Reality...?";


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }

    );

}


/* ==================================================
   新字顯現

   1% → 100%

   顯現期間完全不閃
================================================== */

function revealLetter(letter) {

    return new Promise(

        function(resolve) {


            const duration =
                1200;


            const start =
                performance.now();


            function animate(now) {


                const progress =
                    Math.min(

                        (now - start) /
                        duration,

                        1

                    );


                /*
                   新字：

                   1%
                   ↓
                   100%

                   只增加
                   不倒退
                */

                letter.style.opacity =
                    0.01 +
                    (
                        0.99 *
                        progress
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}


/* ==================================================
   單字母獨立漸變

   每個字：

   不同步
   不跳動
   不閃爍

   只是慢慢改變透明度
================================================== */

function startLetterFade(letter) {


    /*
       每個字自己的速度
    */

    const speed =
        0.0015 +
        Math.random() * 0.002;


    /*
       每個字自己的最低透明度

       15% ～ 35%
    */

    const minimum =
        0.15 +
        Math.random() * 0.20;


    /*
       每個字自己的最高透明度

       95% ～ 100%
    */

    const maximum =
        0.95 +
        Math.random() * 0.05;


    /*
       每個字自己的起始位置

       所以不會完全同步
    */

    let phase =
        Math.random() *
        Math.PI *
        2;



    function animate() {


        /*
           如果字已經被刪除
           就停止動畫
        */

        if (
            !letter.isConnected
        ) {

            return;

        }


        /*
           每個字自己前進

           速度不同
        */

        phase += speed;


        /*
           平滑曲線

           不會突然跳
        */

        const wave =
            (
                Math.sin(phase)
                + 1
            ) / 2;


        /*
           透明度

           最低：
           約 15% ～ 35%

           最高：
           約 95% ～ 100%
        */

        const opacity =
            minimum +
            (
                maximum -
                minimum
            ) *
            wave;


        letter.style.opacity =
            opacity;


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


/* ==================================================
   主動畫
================================================== */

async function start() {


    /*
       開始黑屏
    */

    await wait(
        1500
    );


    /*
       清空
    */

    text.innerHTML =
        "";


    /*
       一個字一個字出現
    */

    for (
        let i = 0;

        i < word.length;

        i++
    ) {


        /*
           建立新字
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            word[i];


        /*
           新字從 1% 開始
        */

        letter.style.opacity =
            "0.01";


        text.appendChild(
            letter
        );



        /*
           ==========================================
           舊字開始各自漸變
           ==========================================
        */

        const letters =
            text.querySelectorAll(
                ".letter"
            );


        for (
            let j = 0;

            j <
            letters.length - 1;

            j++
        ) {


            /*
               每個舊字只啟動一次
            */

            if (
                !letters[j]
                    .dataset
                    .fading
            ) {


                letters[j]
                    .dataset
                    .fading =
                    "true";


                startLetterFade(
                    letters[j]
                );

            }

        }



        /*
           ==========================================
           新字顯現

           1% → 100%
           ==========================================
        */

        await revealLetter(
            letter
        );



        /*
           ==========================================
           字與字之間停頓
           ==========================================
        */

        await wait(
            1200
        );

    }



    /*
       ==========================================
       最後一個字也開始獨立漸變
       ==========================================
    */

    const finalLetters =
        text.querySelectorAll(
            ".letter"
        );


    if (
        finalLetters.length > 0
    ) {


        const last =
            finalLetters[
                finalLetters.length - 1
            ];


        startLetterFade(
            last
        );

    }



    /*
       ==========================================
       Reality...? 完整停留
       ==========================================
    */

    await wait(
        4000
    );



    /*
       ==========================================
       整個標題瞬間消失
       ==========================================
    */

    text.innerHTML =
        "";



    /*
       黑屏
    */

    await wait(
        4500
    );



    /*
       ==========================================
       重新開始
       ==========================================
    */

    start();

}


/* ==================================================
   啟動
================================================== */

start();

</script>

</body>

</html>
