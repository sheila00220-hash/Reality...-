<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

/* ==================================================
   基本設定
================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ==================================================
   開始畫面
================================================== */

#title {

    position: fixed;

    inset: 0;

    background: black;

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

}


/* ==================================================
   標題
================================================== */

#titleText {

    margin: 0;

    width: 95%;

    min-height: 1.1em;

    text-align: center;

    font-size:
        clamp(55px, 13vw, 120px);

    font-weight: 300;

    letter-spacing:
        clamp(5px, 1.4vw, 16px);

    line-height: 1;

    white-space: nowrap;

    color: #f5f5f5;

    /*
       初始完全透明
    */

    opacity: 0;

}


/* ==================================================
   內容提示
================================================== */

.warning {

    width: 88%;

    max-width: 600px;

    margin-top: 60px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;

}

</style>

</head>


<body>


<div id="title">


    <h1 id="titleText"></h1>


    <div class="warning">

        <p>
            內容提示
        </p>

        <p>
            本作品包含心理恐怖、
            令人不安的聲音與視覺表現，
            以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
            部分內容可能涉及敏感議題。
        </p>

        <p>
            若你容易受到心理壓迫、
            強烈聲音或失真畫面的影響，
            請自行斟酌是否遊玩。
        </p>

        <p>
            你可以隨時離開遊戲。
        </p>

    </div>


</div>



<script>


/* ==================================================
   標題設定
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );


const titleSteps = [

    "R",

    "Re",

    "Rea",

    "Real",

    "Reali",

    "Realit",

    "Reality",

    "Reality...?"

];



/* ==================================================
   不穩定顯影
================================================== */

function unstableReveal(
    text,
    callback
) {


    /*
       換文字
    */

    titleText.textContent =
        text;


    /*
       從完全看不到開始
    */

    titleText.style.opacity =
        "0";



    /*
       不規則透明度

       前面比較暗
       後面逐漸變亮
    */

    const opacitySteps = [

        0.08,

        0.22,

        0.12,

        0.38,

        0.25,

        0.55,

        0.40,

        0.72,

        0.58,

        0.86,

        0.74,

        1

    ];


    let step = 0;



    function flicker() {


        if (
            step >=
            opacitySteps.length
        ) {


            titleText.style.opacity =
                "1";


            setTimeout(

                callback,

                900

            );


            return;

        }



        /*
           設定透明度
        */

        titleText.style.opacity =
            opacitySteps[step];


        step++;



        /*
           每次變化時間

           故意不固定
        */

        const delay =
            180 +
            Math.random() * 420;


        setTimeout(

            flicker,

            delay

        );

    }



    flicker();

}



/* ==================================================
   Reality...? 最後穩定顯現
================================================== */

function finalReveal(
    callback
) {


    const finalSteps = [

        0.18,

        0.08,

        0.32,

        0.20,

        0.48,

        0.36,

        0.65,

        0.52,

        0.78,

        0.68,

        0.91,

        1

    ];


    let step = 0;



    function flickerFinal() {


        if (
            step >=
            finalSteps.length
        ) {


            titleText.style.opacity =
                "1";


            setTimeout(

                callback,

                1800

            );


            return;

        }



        titleText.style.opacity =
            finalSteps[step];


        step++;



        const delay =
            220 +
            Math.random() * 450;


        setTimeout(

            flickerFinal,

            delay

        );

    }



    flickerFinal();

}



/* ==================================================
   主循環
================================================== */

function startTitle() {


    let index = 0;



    function next() {


        /*
           還有普通階段
        */

        if (
            index <
            titleSteps.length - 1
        ) {


            unstableReveal(

                titleSteps[index],

                function() {


                    index++;


                    /*
                       每個階段之間
                       留一點黑暗
                    */

                    const gap =
                        500 +
                        Math.random() * 700;


                    setTimeout(

                        next,

                        gap

                    );

                }

            );


            return;

        }



        /*
           =========================
           最後 Reality...?
           =========================
        */


        titleText.textContent =
            "Reality...?";


        titleText.style.opacity =
            "0";


        finalReveal(

            function() {


                /*
                   完整標題
                   再停留一段時間
                */

                const stay =
                    1800 +
                    Math.random() * 1800;


                setTimeout(

                    function() {


                        /*
                           ==================
                           瞬間消失
                           ==================
                        */

                        titleText.style.opacity =
                            "0";


                        titleText.textContent =
                            "";


                        /*
                           黑屏
                           4 ～ 6 秒
                        */

                        const black =
                            4000 +
                            Math.random() * 2000;


                        setTimeout(

                            function() {


                                startTitle();


                            },

                            black

                        );

                    },

                    stay

                );

            }

        );

    }



    next();

}



/* ==================================================
   啟動
================================================== */

setTimeout(

    function() {

        startTitle();

    },

    1000

);


</script>


</body>

</html>
