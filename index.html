<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* ==================================================
   TITLE
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );

const titleWord =
    "Reality...?";

let titleRunning = true;


function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


function random(min, max) {

    return min +
        Math.random() *
        (max - min);

}


function smoothstep(t) {

    return t * t * (3 - 2 * t);

}


function createTitleLetters() {

    titleText.innerHTML = "";

    const letters = [];

    for (
        let i = 0;
        i < titleWord.length;
        i++
    ) {

        const letter =
            document.createElement(
                "span"
            );

        letter.className =
            "titleLetter";

        letter.textContent =
            titleWord[i];

        titleText.appendChild(
            letter
        );

        letters.push(letter);

    }

    return letters;

}


function fadeInLetter(letter) {

    return new Promise(resolve => {

        const duration =
            random(2400, 3000);

        const start =
            performance.now();


        function animate(now) {

            if (!titleRunning) {

                resolve();

                return;

            }


            const progress =
                Math.min(
                    (now - start) /
                    duration,
                    1
                );


            letter.style.opacity =
                smoothstep(progress);


            if (
                progress < 1
            ) {

                requestAnimationFrame(
                    animate
                );

            }

            else {

                letter.style.opacity =
                    "1";

                resolve();

            }

        }


        requestAnimationFrame(
            animate
        );

    });

}


function startIrregularBreathing(letter) {

    if (
        letter.dataset.breathing ===
        "true"
    )
        return;


    letter.dataset.breathing =
        "true";


    let state =
        "holdBright";


    let stateStart =
        performance.now();


    let stateDuration =
        random(1200, 2600);


    let startOpacity = 1;

    let targetOpacity = 1;


    function chooseNextState() {

        if (
            Math.random() < .55
        ) {

            state =
                "fadeDown";

            startOpacity = 1;

            targetOpacity =
                random(.22, .38);

            stateDuration =
                random(
                    2600,
                    4200
                );

        }

        else {

            state =
                "fadeUp";

            startOpacity =
                parseFloat(
                    letter.style.opacity
                ) || .3;

            targetOpacity = 1;

            stateDuration =
                random(
                    2800,
                    4500
                );

        }


        stateStart =
            performance.now();

    }


    function animate(now) {

        if (!titleRunning)
            return;


        const elapsed =
            now - stateStart;


        const progress =
            Math.min(
                elapsed /
                stateDuration,
                1
            );


        if (
            state ===
            "holdBright"
        ) {

            letter.style.opacity =
                "1";

        }

        else if (
            state ===
            "fadeDown"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }

        else if (
            state ===
            "holdDark"
        ) {

            letter.style.opacity =
                targetOpacity;

        }

        else if (
            state ===
            "fadeUp"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }


        if (
            progress >= 1
        ) {

            if (
                state ===
                "holdBright"
            ) {

                chooseNextState();

            }

            else if (
                state ===
                "fadeDown"
            ) {

                state =
                    "holdDark";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        700,
                        2200
                    );

            }

            else if (
                state ===
                "holdDark"
            ) {

                state =
                    "fadeUp";

                stateStart =
                    performance.now();

                startOpacity =
                    parseFloat(
                        letter.style.opacity
                    );

                targetOpacity = 1;

                stateDuration =
                    random(
                        2800,
                        4500
                    );

            }

            else {

                state =
                    "holdBright";

                stateStart =
                    performance.now();

                stateDuration =
                    random(
                        900,
                        3000
                    );

            }

        }


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


async function playTitleAnimation() {

    while (titleRunning) {

        const letters =
            createTitleLetters();


        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (!titleRunning)
                return;


            await fadeInLetter(
                letters[i]
            );


            startIrregularBreathing(
                letters[i]
            );


            await wait(
                random(
                    500,
                    800
                )
            );

        }


        await wait(
            random(
                2900,
                3700
            )
        );


        if (!titleRunning)
            return;


        titleText.innerHTML = "";


        await wait(
            random(
                2800,
                4800
            )
        );

    }

}


playTitleAnimation();


/* ==================================================
   THREE
================================================== */

let scene = null;

let camera = null;

let renderer = null;

let started = false;


/* ==================================================
   ROOM
================================================== */

const ROOM_WIDTH = 14;

const ROOM_DEPTH = 14;

const ROOM_HEIGHT = 10;


/* ==================================================
   PLAYER
================================================== */

/*
   這次不再把玩家當成一個點。

   PLAYER_RADIUS 是玩家在平面上的
   實際碰撞半徑。
*/

const PLAYER_RADIUS = .28;


/*
   眼睛高度。

   先用比較自然的人類視角高度，
   避免之前 Y=2 帶來的浮空感。
*/

const PLAYER_EYE_HEIGHT = 1.65;


/*
   牆體安全距離。

   不會讓玩家真的貼到視覺牆。
*/

const WALL_BUFFER = .10;


const player = {

    x: 0,

    y: PLAYER_EYE_HEIGHT,

    z: 4

};


/* ==================================================
   CAMERA
================================================== */

let yaw = 0;

let pitch = 0;


const PITCH_LIMIT = 1.0;


const LOOK_SENSITIVITY_X =
    .0022;


const LOOK_SENSITIVITY_Y =
    .0022;


/* ==================================================
   FOV
================================================== */

const MIN_FOV = 55;

const MAX_FOV = 95;

const DEFAULT_FOV = 75;


/* ==================================================
   MOVEMENT
================================================== */

const movement = {

    forward: false,

    back: false,

    left: false,

    right: false

};


/* ==================================================
   COLLISION
================================================== */

/*
   真正可以站立的區域。

   注意：

   這裡不再用「厚空氣牆直接推玩家」。

   而是把玩家本身當成有半徑的圓，
   所以玩家中心只能進入安全範圍。

   這能避免牆面把玩家卡成一個點。
*/

function getPlayableBounds() {

    const halfW =
        ROOM_WIDTH / 2;

    const halfD =
        ROOM_DEPTH / 2;


    return {

        minX:
            -halfW +
            PLAYER_RADIUS +
            WALL_BUFFER,

        maxX:
            halfW -
            PLAYER_RADIUS -
            WALL_BUFFER,

        minZ:
            -halfD +
            PLAYER_RADIUS +
            WALL_BUFFER,

        maxZ:
            halfD -
            PLAYER_RADIUS -
            WALL_BUFFER

    };

}


/*
   判斷玩家中心點是否可以位於
   指定位置。

   玩家碰撞半徑已經包含在 bounds 中。
*/

function canPlayerOccupy(
    x,
    z
) {

    const bounds =
        getPlayableBounds();


    return (

        x >= bounds.minX &&

        x <= bounds.maxX &&

        z >= bounds.minZ &&

        z <= bounds.maxZ

    );

}


/* ==================================================
   MOVEMENT RESOLUTION
================================================== */

/*
   這是這次最重要的修改。

   不再：

       X 判斷
       ↓
       改 X
       ↓
       Z 判斷
       ↓
       改 Z

   而是：

       先算完整移動
              ↓
       完整移動可以？
          ↙       ↘
        可以       不可以
         ↓          ↓
       整體走     嘗試 X
                    ↓
                  嘗試 Z

   這樣撞牆時自然產生
   「沿牆滑動」效果。
*/

function resolveMovement(
    moveX,
    moveZ
) {

    const currentX =
        player.x;

    const currentZ =
        player.z;


    const targetX =
        currentX +
        moveX;

    const targetZ =
        currentZ +
        moveZ;


    /*
       ① 整體移動
    */

    if (
        canPlayerOccupy(
            targetX,
            targetZ
        )
    ) {

        player.x =
            targetX;

        player.z =
            targetZ;

        return;

    }


    /*
       ② 只嘗試 X

       如果前方被牆擋住，
       但左右仍有空間，
       玩家就能沿牆滑動。
    */

    const canMoveX =
        canPlayerOccupy(
            targetX,
            currentZ
        );


    /*
       ③ 只嘗試 Z
    */

    const canMoveZ =
        canPlayerOccupy(
            currentX,
            targetZ
        );


    /*
       X 可以、Z 不可以：

       沿 X 滑。
    */

    if (canMoveX) {

        player.x =
            targetX;

    }


    /*
       Z 可以、X 不可以：

       沿 Z 滑。
    */

    if (canMoveZ) {

        player.z =
            targetZ;

    }

}


/* ==================================================
   PLAYER MOVEMENT
================================================== */

function updatePlayer() {

    if (!camera)
        return;


    const speed = .08;


    /*
       視角方向。
    */

    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    const rightX =
        Math.cos(yaw);

    const rightZ =
        Math.sin(yaw);


    let inputX = 0;

    let inputZ = 0;


    if (
        movement.forward
    ) {

        inputX +=
            forwardX;

        inputZ +=
            forwardZ;

    }


    if (
        movement.back
    ) {

        inputX -=
            forwardX;

        inputZ -=
            forwardZ;

    }


    if (
        movement.left
    ) {

        inputX -=
            rightX;

        inputZ -=
            rightZ;

    }


    if (
        movement.right
    ) {

        inputX +=
            rightX;

        inputZ +=
            rightZ;

    }


    const length =
        Math.hypot(
            inputX,
            inputZ
        );


    if (
        length > 0
    ) {

        inputX /=
            length;

        inputZ /=
            length;


        const moveX =
            inputX *
            speed;


        const moveZ =
            inputZ *
            speed;


        resolveMovement(
            moveX,
            moveZ
        );

    }


    updateCamera();

}


/* ==================================================
   CAMERA
================================================== */

function updateCamera() {

    camera.position.set(

        player.x,

        player.y,

        player.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* ==================================================
   CREATE WORLD
================================================== */

function createWorld() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0xb0b0b0
        );


    camera =
        new THREE.PerspectiveCamera(

            DEFAULT_FOV,

            window.innerWidth /
            window.innerHeight,

            .1,

            100

        );


    camera.position.set(

        player.x,

        player.y,

        player.z

    );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    scene.add(

        new THREE.AmbientLight(

            0xffffff,

            2

        )

    );


    createRoom();


    setupTouch();


    setupJoystick();


    animate();

}


/* ==================================================
   ROOM
================================================== */

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;


    /*
       地板
    */

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color: 0x707070,

                side:
                    THREE.DoubleSide

            })

        );


    floor.rotation.x =
        -Math.PI / 2;


    scene.add(
        floor
    );


    /*
       天花板
    */

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color: 0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        H;


    scene.add(
        ceiling
    );


    /*
       前牆
    */

    const front =
        createWall(
            W,
            H,
            0xc2c2c2
        );


    front.position.set(

        0,

        H / 2,

        -D / 2

    );


    scene.add(
        front
    );


    /*
       後牆
    */

    const back =
        createWall(
            W,
            H,
            0xb7b7b7
        );


    back.position.set(

        0,

        H / 2,

        D / 2

    );


    scene.add(
        back
    );


    /*
       左牆
    */

    const left =
        createWall(
            D,
            H,
            0xaeaeae
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(

        -W / 2,

        H / 2,

        0

    );


    scene.add(
        left
    );


    /*
       右牆
    */

    const right =
        createWall(
            D,
            H,
            0xa6a6a6
        );


    right.rotation.y =
        Math.PI / 2;


    right.position.set(

        W / 2,

        H / 2,

        0

    );


    scene.add(
        right
    );


    createRoomEdges(
        W,
        H,
        D
    );


    /*
       這裡仍然建立真正的
       立體隱形碰撞體。

       但「玩家移動」不再直接
       依賴這些 Mesh。

       避免兩套碰撞系統互相打架。
    */

    createInvisibleCollisionWalls(
        W,
        H,
        D
    );

}


function createWall(
    width,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            color: color,

            side:
                THREE.DoubleSide

        })

    );

}


/* ==================================================
   INVISIBLE 3D WALLS
================================================== */

function createInvisibleCollisionWalls(
    W,
    H,
    D
) {

    const material =
        new THREE.MeshBasicMaterial({

            transparent: true,

            opacity: 0,

            depthWrite: false

        });


    const thickness =
        .45;


    /*
       前
    */

    const front =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                W + thickness * 2,

                H,

                thickness

            ),

            material

        );


    front.position.set(

        0,

        H / 2,

        -D / 2 +
        thickness / 2

    );


    front.visible = false;


    scene.add(
        front
    );


    /*
       後
    */

    const back =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                W + thickness * 2,

                H,

                thickness

            ),

            material

        );


    back.position.set(

        0,

        H / 2,

        D / 2 -
        thickness / 2

    );


    back.visible = false;


    scene.add(
        back
    );


    /*
       左
    */

    const left =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                thickness,

                H,

                D

            ),

            material

        );


    left.position.set(

        -W / 2 +
        thickness / 2,

        H / 2,

        0

    );


    left.visible = false;


    scene.add(
        left
    );


    /*
       右
    */

    const right =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                thickness,

                H,

                D

            ),

            material

        );


    right.position.set(

        W / 2 -
        thickness / 2,

        H / 2,

        0

    );


    right.visible = false;


    scene.add(
        right
    );

}


/* ==================================================
   ROOM EDGES
================================================== */

function createRoomEdges(
    W,
    H,
    D
) {

    const geometry =
        new THREE.BoxGeometry(
            W,
            H,
            D
        );


    const edges =
        new THREE.EdgesGeometry(
            geometry
        );


    const material =
        new THREE.LineBasicMaterial({

            color: 0x666666,

            transparent: true,

            opacity: .45

        });


    const lines =
        new THREE.LineSegments(

            edges,

            material

        );


    lines.position.y =
        H / 2;


    scene.add(
        lines
    );

}


/* ==================================================
   TOUCH
================================================== */

const activeTouches =
    new Map();


let touchMode =
    "none";


let lookPointerId =
    null;


let lastLookX = 0;

let lastLookY = 0;


let previousPinchDistance =
    null;


let mouseLooking =
    false;


function getPinchDistance() {

    const points =
        Array.from(
            activeTouches.values()
        );


    if (
        points.length < 2
    )
        return null;


    const a =
        points[0];

    const b =
        points[1];


    return Math.hypot(

        b.x - a.x,

        b.y - a.y

    );

}


function enterPinchMode() {

    touchMode =
        "pinch";


    lookPointerId =
        null;


    previousPinchDistance =
        getPinchDistance();

}


function enterLookMode() {

    const entries =
        Array.from(
            activeTouches.entries()
        );


    if (
        entries.length !== 1
    ) {

        touchMode =
            "none";

        lookPointerId =
            null;

        return;

    }


    const [
        id,
        point
    ] = entries[0];


    touchMode =
        "look";


    lookPointerId =
        id;


    lastLookX =
        point.x;


    lastLookY =
        point.y;


    previousPinchDistance =
        null;

}


/* ==================================================
   TOUCH SETUP
================================================== */

function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.style.touchAction =
        "none";


    canvas.addEventListener(

        "pointerdown",

        event => {

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (
                    event.button !== 0
                )
                    return;


                mouseLooking =
                    true;


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;


                return;

            }


            event.preventDefault();


            activeTouches.set(

                event.pointerId,

                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );


            if (
                activeTouches.size ===
                1
            ) {

                touchMode =
                    "look";


                lookPointerId =
                    event.pointerId;


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;

            }

            else {

                enterPinchMode();

            }

        },

        {
            passive: false
        }

    );


    canvas.addEventListener(

        "pointermove",

        event => {

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (!mouseLooking)
                    return;


                const dx =
                    event.clientX -
                    lastLookX;


                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(

                        -PITCH_LIMIT,

                        Math.min(

                            PITCH_LIMIT,

                            pitch

                        )

                    );


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;


                return;

            }


            if (
                !activeTouches.has(
                    event.pointerId
                )
            )
                return;


            event.preventDefault();


            activeTouches.set(

                event.pointerId,

                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );


            if (
                touchMode ===
                "pinch"
            ) {

                const distance =
                    getPinchDistance();


                if (

                    distance !== null &&

                    previousPinchDistance !== null

                ) {

                    const delta =
                        distance -
                        previousPinchDistance;


                    camera.fov +=
                        delta *
                        .08;


                    camera.fov =
                        Math.max(

                            MIN_FOV,

                            Math.min(

                                MAX_FOV,

                                camera.fov

                            )

                        );


                    camera.updateProjectionMatrix();

                }


                previousPinchDistance =
                    distance;


                return;

            }


            if (

                touchMode ===
                    "look" &&

                event.pointerId ===
                    lookPointerId

            ) {

                const dx =
                    event.clientX -
                    lastLookX;


                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(

                        -PITCH_LIMIT,

                        Math.min(

                            PITCH_LIMIT,

                            pitch

                        )

                    );


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;

            }

        },

        {
            passive: false
        }

    );


    function endTouch(event) {

        if (
            event.pointerType ===
            "mouse"
        ) {

            mouseLooking =
                false;

            return;

        }


        if (
            !activeTouches.has(
                event.pointerId
            )
        )
            return;


        activeTouches.delete(
            event.pointerId
        );


        if (
            activeTouches.size === 0
        ) {

            touchMode =
                "none";


            lookPointerId =
                null;


            previousPinchDistance =
                null;

        }

        else if (
            activeTouches.size === 1
        ) {

            enterLookMode();

        }

    }


    canvas.addEventListener(
        "pointerup",
        endTouch
    );


    canvas.addEventListener(
        "pointercancel",
        endTouch
    );

}


/* ==================================================
   JOYSTICK
================================================== */

const joystickBase =
    document.getElementById(
        "joystickBase"
    );


const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );


let joystickPointerId =
    null;


let joystickActive =
    false;


const JOYSTICK_RADIUS =
    37;


const JOYSTICK_DEAD_ZONE =
    .12;


function getJoystickCenter() {

    const rect =
        joystickBase
            .getBoundingClientRect();


    return {

        x:
            rect.left +
            rect.width / 2,

        y:
            rect.top +
            rect.height / 2

    };

}


function updateJoystick(
    clientX,
    clientY
) {

    const center =
        getJoystickCenter();


    let dx =
        clientX -
        center.x;


    let dy =
        clientY -
        center.y;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if (
        distance >
        JOYSTICK_RADIUS
    ) {

        const scale =
            JOYSTICK_RADIUS /
            distance;


        dx *= scale;

        dy *= scale;

    }


    const x =
        dx /
        JOYSTICK_RADIUS;


    const y =
        dy /
        JOYSTICK_RADIUS;


    joystickKnob.style.transform =

        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;


    movement.forward =
        y <
        -JOYSTICK_DEAD_ZONE;


    movement.back =
        y >
        JOYSTICK_DEAD_ZONE;


    movement.left =
        x <
        -JOYSTICK_DEAD_ZONE;


    movement.right =
        x >
        JOYSTICK_DEAD_ZONE;

}


function stopJoystick() {

    joystickPointerId =
        null;


    joystickActive =
        false;


    movement.forward =
        false;


    movement.back =
        false;


    movement.left =
        false;


    movement.right =
        false;


    joystickBase.classList.remove(
        "active"
    );


    joystickKnob.style.transform =
        "translate(-50%, -50%)";

}


function setupJoystick() {

    joystickBase.addEventListener(

        "pointerdown",

        event => {

            event.preventDefault();

            event.stopPropagation();


            if (
                joystickPointerId !==
                null
            )
                return;


            joystickPointerId =
                event.pointerId;


            joystickActive =
                true;


            joystickBase.classList.add(
                "active"
            );


            try {

                joystickBase.setPointerCapture(
                    event.pointerId
                );

            }

            catch (_) {}


            updateJoystick(

                event.clientX,

                event.clientY

            );

        },

        {
            passive: false
        }

    );


    joystickBase.addEventListener(

        "pointermove",

        event => {

            if (

                !joystickActive ||

                event.pointerId !==
                    joystickPointerId

            )
                return;


            event.preventDefault();

            event.stopPropagation();


            updateJoystick(

                event.clientX,

                event.clientY

            );

        },

        {
            passive: false
        }

    );


    joystickBase.addEventListener(

        "pointerup",

        event => {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;


            event.preventDefault();

            event.stopPropagation();


            stopJoystick();

        },

        {
            passive: false
        }

    );


    joystickBase.addEventListener(

        "pointercancel",

        event => {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;


            stopJoystick();

        },

        {
            passive: false
        }

    );


    joystickBase.addEventListener(

        "lostpointercapture",

        () => {

            if (
                joystickPointerId !==
                null
            ) {

                stopJoystick();

            }

        }

    );

}


/* ==================================================
   START
================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    if (started)
        return;


    started = true;


    titleRunning =
        false;


    stopJoystick();


    document
        .getElementById(
            "title"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hint"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "joystickArea"
        )
        .style.display =
        "block";


    createWorld();

}


/* ==================================================
   GAME LOOP
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (started) {

        updatePlayer();

    }


    if (

        renderer &&

        scene &&

        camera

    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

    "resize",

    () => {

        if (
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);


/* ==================================================
   RESET INPUT
================================================== */

window.addEventListener(

    "blur",

    () => {

        stopJoystick();


        activeTouches.clear();


        touchMode =
            "none";


        lookPointerId =
            null;


        mouseLooking =
            false;

    }

);

</script>
