<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

#title {

    position: fixed;

    inset: 0;

    background: black;

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

}


/* =========================
   標題
========================= */

#titleText {

    margin: 0;

    min-height: 1em;

    font-size:
        clamp(55px, 13vw, 120px);

    font-weight: 300;

    letter-spacing:
        clamp(4px, 1.2vw, 14px);

    line-height: 1;

    white-space: nowrap;

    color: #f5f5f5;

}


/* =========================
   提示文字
========================= */

.warning {

    width: 88%;

    max-width: 600px;

    margin-top: 55px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;

}


</style>

</head>


<body>


<div id="title">


    <h1 id="titleText"></h1>


    <div class="warning">

        <p>內容提示</p>

        <p>
        本作品包含心理恐怖、
        令人不安的聲音與視覺表現，
        以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
        部分內容可能涉及敏感議題。
        </p>

        <p>
        若你容易受到心理壓迫、
        強烈聲音或失真畫面的影響，
        請自行斟酌是否遊玩。
        </p>

        <p>
        你可以隨時離開遊戲。
        </p>

    </div>


</div>


<script>


/* ==================================================
   Reality...? 測試動畫
================================================== */


const titleText =
    document.getElementById(
        "titleText"
    );


const titleSteps = [

    "R",

    "Re",

    "Rea",

    "Real",

    "Reali",

    "Realit",

    "Reality",

    "Reality...?"

];


function playTitleAnimation() {


    let index = 0;


    function typeNext() {


        titleText.textContent =
            titleSteps[index];


        index++;


        /* =========================
           還沒完成
        ========================= */

        if (
            index <
            titleSteps.length
        ) {


            setTimeout(

                typeNext,

                180

            );


            return;

        }



        /* =========================
           完整 Reality...?
        ========================= */


        /*
           隨機停留
           0.8 ～ 2.6 秒
        */

        const disappearTime =
            800 +
            Math.random() * 1800;


        setTimeout(

            function() {


                /*
                   瞬間消失
                */

                titleText.textContent =
                    "";


                /*
                   確認真的沒有文字
                */

                titleText.style.visibility =
                    "hidden";


                /*
                   黑屏
                   2.5 ～ 5 秒
                */

                const nextAppearance =
                    2500 +
                    Math.random() * 2500;


                setTimeout(

                    function() {


                        titleText.style.visibility =
                            "visible";


                        playTitleAnimation();


                    },

                    nextAppearance

                );


            },

            disappearTime

        );

    }


    typeNext();

}


/* =========================
   開始
========================= */

playTitleAnimation();


</script>


</body>

</html>
