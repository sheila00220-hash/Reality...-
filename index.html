<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: Arial, "Noto Sans TC", sans-serif;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
}

.screen.active {
    display: block;
}


/* =========================
   開始畫面
========================= */

#title {
    background: #000;
    color: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

#title h1 {
    font-size: clamp(45px, 13vw, 90px);
    font-weight: 300;
    letter-spacing: 8px;
}

.warning {
    width: 90%;
    max-width: 600px;
    color: #ddd;
    line-height: 1.8;
    font-size: 14px;
}

.startButton {
    margin-top: 20px;
    padding: 14px 28px;

    border: 1px solid white;
    background: transparent;
    color: white;

    font-size: 17px;
}


/* =========================
   第一章
========================= */

#chapter1 {
    background: #777;
}

#threeContainer {
    position: absolute;
    inset: 0;
}


/* =========================
   提示
========================= */

#hint {
    position: absolute;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    background: rgba(0,0,0,.35);

    padding: 7px 12px;
    border-radius: 5px;

    font-size: 13px;

    z-index: 10;
}


/* =========================
   移動按鈕
========================= */

#controls {
    position: absolute;

    left: 15px;
    bottom: 20px;

    width: 180px;
    height: 120px;

    z-index: 20;
}

.control {
    position: absolute;

    width: 52px;
    height: 52px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.4);

    border: 1px solid rgba(255,255,255,.5);

    border-radius: 8px;

    color: white;
    font-size: 24px;

    user-select: none;
}

.forward {
    left: 64px;
    top: 0;
}

.left {
    left: 8px;
    top: 58px;
}

.back {
    left: 64px;
    top: 58px;
}

.right {
    left: 120px;
    top: 58px;
}

</style>
</head>


<body>

<div id="game">


<!-- =========================
     開始畫面
========================= -->

<section id="title" class="screen active">

    <h1>Reality...?</h1>

    <div class="warning">

        <p>內容提示</p>

        <p>
        本作品包含心理恐怖、令人不安的聲音與視覺表現，
        以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
        部分內容可能涉及敏感議題。
        </p>

        <p>
        若你容易受到心理壓迫、強烈聲音或失真畫面的影響，
        請自行斟酌是否遊玩。
        </p>

        <p>
        你可以隨時離開遊戲。
        </p>

    </div>

    <button
        class="startButton"
        onclick="startGame()">

        開始你的旅程

    </button>

</section>



<!-- =========================
     第一章
========================= -->

<section
    id="chapter1"
    class="screen">

    <div id="threeContainer"></div>

    <div id="hint">
        左右滑動畫面轉動視角
    </div>

    <div id="controls">

        <div
            class="control forward"
            data-move="forward">
            ↑
        </div>

        <div
            class="control left"
            data-move="left">
            ←
        </div>

        <div
            class="control back"
            data-move="back">
            ↓
        </div>

        <div
            class="control right"
            data-move="right">
            →
        </div>

    </div>

</section>


</div>


<!-- =========================
     Three.js
========================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* ========================================
   全域變數
======================================== */

let scene;
let camera;
let renderer;

let eyeFrame;
let pupil;

let player = {
    x: 0,
    y: 2,
    z: 5
};

let yaw = 0;
let pitch = 0;

let movement = {
    forward: false,
    back: false,
    left: false,
    right: false
};


/* ========================================
   開始遊戲
======================================== */

function startGame() {

    document
        .getElementById("title")
        .classList.remove("active");

    document
        .getElementById("chapter1")
        .classList.add("active");

    create3D();
}


/* ========================================
   建立 3D 世界
======================================== */

function create3D() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x777777);


    /* -------------------------
       相機
    ------------------------- */

    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.1,
            100
        );

    camera.position.set(
        player.x,
        player.y,
        player.z
    );


    /* -------------------------
       Renderer
    ------------------------- */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    document
        .getElementById("threeContainer")
        .appendChild(
            renderer.domElement
        );


    /* -------------------------
       光
    ------------------------- */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.5
        );

    scene.add(ambient);


    const light =
        new THREE.PointLight(
            0xffffff,
            10,
            40
        );

    light.position.set(
        0,
        8,
        0
    );

    scene.add(light);


    /* -------------------------
       房間
    ------------------------- */

    createRoom();


    /* -------------------------
       一隻測試眼睛
    ------------------------- */

    createTestEye();


    /* -------------------------
       手機控制
    ------------------------- */

    setupTouch();
    setupButtons();


    animate();
}


/* ========================================
   房間
======================================== */

function createRoom() {

    const W = 20;
    const H = 10;
    const D = 20;


    /* 地板 */

    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(W, D),
            new THREE.MeshBasicMaterial({
                color: 0x686868,
                side: THREE.DoubleSide
            })
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y = 0;

    scene.add(floor);


    /* 天花板 */

    const ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(W, D),
            new THREE.MeshBasicMaterial({
                color: 0xdadada,
                side: THREE.DoubleSide
            })
        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y = H;

    scene.add(ceiling);


    /* 前牆 */

    const front =
        new THREE.Mesh(
            new THREE.PlaneGeometry(W, H),
            new THREE.MeshBasicMaterial({
                color: 0xbcbcbc,
                side: THREE.DoubleSide
            })
        );

    front.position.set(
        0,
        H / 2,
        -D / 2
    );

    scene.add(front);


    /* 後牆 */

    const back =
        new THREE.Mesh(
            new THREE.PlaneGeometry(W, H),
            new THREE.MeshBasicMaterial({
                color: 0xa5a5a5,
                side: THREE.DoubleSide
            })
        );

    back.position.set(
        0,
        H / 2,
        D / 2
    );

    scene.add(back);


    /* 左牆 */

    const left =
        new THREE.Mesh(
            new THREE.PlaneGeometry(D, H),
            new THREE.MeshBasicMaterial({
                color: 0x999999,
                side: THREE.DoubleSide
            })
        );

    left.rotation.y =
        Math.PI / 2;

    left.position.set(
        -W / 2,
        H / 2,
        0
    );

    scene.add(left);


    /* 右牆 */

    const right =
        new THREE.Mesh(
            new THREE.PlaneGeometry(D, H),
            new THREE.MeshBasicMaterial({
                color: 0x8b8b8b,
                side: THREE.DoubleSide
            })
        );

    right.rotation.y =
        Math.PI / 2;

    right.position.set(
        W / 2,
        H / 2,
        0
    );

    scene.add(right);

}


/* ========================================
   建立一隻測試眼睛
======================================== */

function createTestEye() {

    const loader =
        new THREE.TextureLoader();


    const frameTexture =
        loader.load(
            "Screenshot_20260819_221148_Google-removebg-preview.png"
        );


    const pupilTexture =
        loader.load(
            "Screenshot_20260819_221235_Google-removebg-preview.png"
        );


    /* ==================================
       眼眶＋眼白
       固定
    ================================== */

    const frameMaterial =
        new THREE.SpriteMaterial({

            map: frameTexture,

            transparent: true,

            depthTest: false

        });


    eyeFrame =
        new THREE.Sprite(
            frameMaterial
        );


    eyeFrame.position.set(
        0,
        5,
        -9.75
    );


    eyeFrame.scale.set(
        5,
        5,
        1
    );


    eyeFrame.renderOrder = 10;


    scene.add(
        eyeFrame
    );


    /* ==================================
       眼球
       可以移動
    ================================== */

    const pupilMaterial =
        new THREE.SpriteMaterial({

            map: pupilTexture,

            transparent: true,

            depthTest: false

        });


    pupil =
        new THREE.Sprite(
            pupilMaterial
        );


    pupil.position.set(
        0,
        5,
        -9.70
    );


    pupil.scale.set(
        1.6,
        1.6,
        1
    );


    /*
       數字越大越在上面
    */

    pupil.renderOrder = 5;


    scene.add(
        pupil
    );

}


/* ========================================
   讓眼球看玩家
======================================== */

function updatePupil() {

    if(!pupil || !eyeFrame)
        return;


    /*
       測試眼睛的位置
    */

    const eyeX =
        eyeFrame.position.x;

    const eyeY =
        eyeFrame.position.y;


    /*
       玩家相對於眼睛的位置
    */

    const dx =
        player.x - eyeX;

    const dy =
        player.y - eyeY;


    /*
       限制眼球活動範圍

       不允許跑出眼眶
    */

    const maxMove = 1.15;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    let moveX = 0;
    let moveY = 0;


    if(distance > 0.01) {

        moveX =
            dx / distance *
            Math.min(
                Math.abs(dx),
                maxMove
            );

        moveY =
            dy / distance *
            Math.min(
                Math.abs(dy),
                maxMove
            );

    }


    /*
       讓眼球的位置
       跟著玩家變化
    */

    pupil.position.x =
        eyeX + moveX;

    pupil.position.y =
        eyeY + moveY;

    pupil.position.z =
        eyeFrame.position.z + 0.05;

}


/* ========================================
   玩家移動
======================================== */

function updatePlayer() {

    const speed = 0.08;


    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    if(movement.forward) {

        player.x +=
            forwardX * speed;

        player.z +=
            forwardZ * speed;

    }


    if(movement.back) {

        player.x -=
            forwardX * speed;

        player.z -=
            forwardZ * speed;

    }


    if(movement.left) {

        player.x -=
            Math.cos(yaw) * speed;

        player.z -=
            Math.sin(yaw) * speed;

    }


    if(movement.right) {

        player.x +=
            Math.cos(yaw) * speed;

        player.z +=
            Math.sin(yaw) * speed;

    }


    /* 不穿牆 */

    player.x =
        Math.max(
            -8,
            Math.min(
                8,
                player.x
            )
        );


    player.z =
        Math.max(
            -8,
            Math.min(
                8,
                player.z
            )
        );


    camera.position.set(
        player.x,
        player.y,
        player.z
    );


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}


/* ========================================
   手機滑動
======================================== */

let touching = false;

let lastX = 0;
let lastY = 0;


function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.addEventListener(
        "touchstart",
        function(event) {

            touching = true;

            lastX =
                event.touches[0]
                .clientX;

            lastY =
                event.touches[0]
                .clientY;

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchmove",
        function(event) {

            if(!touching)
                return;

            event.preventDefault();


            const x =
                event.touches[0]
                .clientX;

            const y =
                event.touches[0]
                .clientY;


            const dx =
                x - lastX;

            const dy =
                y - lastY;


            yaw -=
                dx * 0.004;

            pitch -=
                dy * 0.004;


            pitch =
                Math.max(
                    -1.4,
                    Math.min(
                        1.4,
                        pitch
                    )
                );


            lastX = x;
            lastY = y;

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchend",
        function() {

            touching = false;

        }
    );

}


/* ========================================
   移動按鈕
======================================== */

function setupButtons() {

    document
        .querySelectorAll(".control")
        .forEach(
            function(button) {

                const direction =
                    button.dataset.move;


                button.addEventListener(
                    "touchstart",
                    function(event) {

                        event.preventDefault();

                        movement[
                            direction
                        ] = true;

                    }
                );


                button.addEventListener(
                    "touchend",
                    function(event) {

                        event.preventDefault();

                        movement[
                            direction
                        ] = false;

                    }
                );

            }
        );

}


/* ========================================
   遊戲循環
======================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updatePupil();


    renderer.render(
        scene,
        camera
    );

}


/* ========================================
   螢幕大小
======================================== */

window.addEventListener(
    "resize",
    function() {

        if(!camera || !renderer)
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
