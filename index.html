<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

/* ==================================================
   基本
================================================== */

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

    touch-action: none;

    user-select: none;

}


/* ==================================================
   所有頁面
================================================== */

.page {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    overflow: hidden;

}


/* ==================================================
   開場頁
================================================== */

#intro {

    display: flex;

    align-items: center;

    justify-content: center;

    background: black;

}


#introText {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(46px, 12vw, 96px);

    font-weight: 300;

    letter-spacing: 0;

    white-space: nowrap;

}


.introLetter {

    display: inline-block;

    opacity: 0;

}


/* ==================================================
   主頁
================================================== */

#menu {

    background: black;

    color: white;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


#menuTitle {

    font-size:
        clamp(36px, 10vw, 72px);

    font-weight: 300;

    margin-bottom:
        55px;

}


#startButton {

    background: transparent;

    border: 1px solid rgba(
        255,
        255,
        255,
        0.65
    );

    color: white;

    padding:
        15px 48px;

    font-size:
        18px;

    font-weight: 300;

    letter-spacing:
        3px;

    border-radius:
        2px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ==================================================
   房間
================================================== */

#room {

    background:
        rgb(112, 112, 112);

}


/*
   房間本體

   使用偏長方形比例
*/

#roomSpace {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 720px;

    height: 520px;

    transform:
        translate(-50%, -50%);

    border:
        3px solid
        rgba(
            20,
            20,
            20,
            0.85
        );

    background:
        rgb(128, 128, 128);

    box-sizing:
        border-box;

}


/* ==================================================
   房間四條邊
================================================== */

.wall {

    position: absolute;

    background:
        rgba(
            25,
            25,
            25,
            0.8
        );

}


.wall.top {

    left: 0;
    top: 0;

    width: 100%;
    height: 3px;

}


.wall.bottom {

    left: 0;
    bottom: 0;

    width: 100%;
    height: 3px;

}


.wall.left {

    left: 0;
    top: 0;

    width: 3px;
    height: 100%;

}


.wall.right {

    right: 0;
    top: 0;

    width: 3px;
    height: 100%;

}


/* ==================================================
   玩家
================================================== */

#player {

    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background:
        white;

    box-shadow:
        0 0 12px
        rgba(
            255,
            255,
            255,
            0.55
        );

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

}


/* ==================================================
   虛擬搖桿
================================================== */

#joystick {

    position: absolute;

    left: 25px;
    bottom: 25px;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    background:
        rgba(
            0,
            0,
            0,
            0.20
        );

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            0.30
        );

}


#stick {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 58px;
    height: 58px;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.35
        );

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            0.45
        );

}


/* ==================================================
   房間提示
================================================== */

#roomHint {

    position: absolute;

    top: 20px;
    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(
            255,
            255,
            255,
            0.45
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        13px;

    pointer-events:
        none;

}

</style>

</head>


<body>


<!-- ==================================================
     Reality...? 開場
================================================== -->

<div
    id="intro"
    class="page"
>

    <div id="introText"></div>

</div>



<!-- ==================================================
     主頁
================================================== -->

<div
    id="menu"
    class="page"
>

    <div id="menuTitle">
        Reality...?
    </div>


    <button
        id="startButton"
    >
        START
    </button>

</div>



<!-- ==================================================
     房間
================================================== -->

<div
    id="room"
    class="page"
>


    <div id="roomSpace">


        <div
            class="wall top"
        ></div>


        <div
            class="wall bottom"
        ></div>


        <div
            class="wall left"
        ></div>


        <div
            class="wall right"
        ></div>


        <div id="player"></div>


    </div>


    <div id="roomHint">
        Chapter 1
    </div>


    <div id="joystick">

        <div id="stick"></div>

    </div>


</div>



<script>


/* ==================================================
   頁面
================================================== */

const intro =
    document.getElementById(
        "intro"
    );


const menu =
    document.getElementById(
        "menu"
    );


const room =
    document.getElementById(
        "room"
    );


/* ==================================================
   開場文字
================================================== */

const introText =
    document.getElementById(
        "introText"
    );


const introWord =
    "Reality...?";


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* ==================================================
   開場文字顯現
================================================== */

function revealIntroLetter(
    letter
) {

    return new Promise(
        resolve => {


            const duration =
                1200;


            const start =
                performance.now();


            function animate(
                now
            ) {


                const progress =
                    Math.min(

                        (
                            now -
                            start
                        ) /
                        duration,

                        1

                    );


                letter.style.opacity =
                    0.01 +
                    (
                        0.99 *
                        progress
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );

}


/* ==================================================
   舊字獨立漸變
================================================== */

function startLetterFade(
    letter
) {


    const speed =
        0.0015 +
        Math.random() *
        0.002;


    const minimum =
        0.15 +
        Math.random() *
        0.20;


    const maximum =
        0.95 +
        Math.random() *
        0.05;


    let phase =
        Math.random() *
        Math.PI *
        2;


    function animate() {


        if (
            !letter.isConnected
        ) {

            return;

        }


        phase += speed;


        const wave =
            (
                Math.sin(
                    phase
                ) +
                1
            ) / 2;


        const opacity =
            minimum +
            (
                maximum -
                minimum
            ) *
            wave;


        letter.style.opacity =
            opacity;


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


/* ==================================================
   開場動畫
================================================== */

async function playIntro() {


    intro.style.display =
        "flex";


    menu.style.display =
        "none";


    room.style.display =
        "none";


    introText.innerHTML =
        "";


    for (
        let i = 0;

        i <
        introWord.length;

        i++
    ) {


        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "introLetter";


        letter.textContent =
            introWord[i];


        letter.style.opacity =
            "0.01";


        introText.appendChild(
            letter
        );


        const oldLetters =
            introText.querySelectorAll(
                ".introLetter"
            );


        for (
            let j = 0;

            j <
            oldLetters.length - 1;

            j++
        ) {


            if (
                !oldLetters[j]
                    .dataset
                    .fading
            ) {


                oldLetters[j]
                    .dataset
                    .fading =
                    "true";


                startLetterFade(
                    oldLetters[j]
                );

            }

        }


        await revealIntroLetter(
            letter
        );


        await wait(
            1200
        );

    }


    /*
       完整標題停留
    */

    await wait(
        4000
    );


    /*
       整個消失
    */

    introText.innerHTML =
        "";


    await wait(
        1200
    );


    /*
       進入主頁
    */

    showMenu();

}


/* ==================================================
   主頁
================================================== */

function showMenu() {

    intro.style.display =
        "none";


    room.style.display =
        "none";


    menu.style.display =
        "flex";

}


/* ==================================================
   房間
================================================== */

function showRoom() {

    intro.style.display =
        "none";


    menu.style.display =
        "none";


    room.style.display =
        "block";


    resetPlayer();

}


/* ==================================================
   開始按鈕
================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        showRoom
    );


/* ==================================================
   玩家
================================================== */

const player =
    document.getElementById(
        "player"
    );


const roomSpace =
    document.getElementById(
        "roomSpace"
    );


let playerX =
    360;


let playerY =
    260;


function resetPlayer() {

    playerX =
        roomSpace.clientWidth / 2;


    playerY =
        roomSpace.clientHeight / 2;


    updatePlayer();

}


function updatePlayer() {

    player.style.left =
        playerX + "px";


    player.style.top =
        playerY + "px";

}


/* ==================================================
   玩家移動
================================================== */

let moveX =
    0;


let moveY =
    0;


const moveSpeed =
    2.8;


function movePlayer() {


    /*
       玩家半徑

       避免穿過牆
    */

    const radius =
        11;


    const minX =
        radius;


    const maxX =
        roomSpace.clientWidth -
        radius;


    const minY =
        radius;


    const maxY =
        roomSpace.clientHeight -
        radius;


    playerX +=
        moveX *
        moveSpeed;


    playerY +=
        moveY *
        moveSpeed;


    /*
       正常房間邊界

       不會提前出現奇怪空氣牆
    */

    playerX =
        Math.max(
            minX,
            Math.min(
                maxX,
                playerX
            )
        );


    playerY =
        Math.max(
            minY,
            Math.min(
                maxY,
                playerY
            )
        );


    updatePlayer();


    requestAnimationFrame(
        movePlayer
    );

}


movePlayer();


/* ==================================================
   虛擬搖桿
================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


let joystickActive =
    false;


let joystickCenterX =
    0;


let joystickCenterY =
    0;


const joystickRadius =
    55;


function getPointerPosition(
    event
) {

    const point =
        event.touches
        ? event.touches[0]
        : event;


    return {

        x:
            point.clientX,

        y:
            point.clientY

    };

}


function startJoystick(
    event
) {

    event.preventDefault();


    joystickActive =
        true;


    const rect =
        joystick.getBoundingClientRect();


    joystickCenterX =
        rect.left +
        rect.width / 2;


    joystickCenterY =
        rect.top +
        rect.height / 2;


    updateJoystick(
        event
    );

}


function updateJoystick(
    event
) {

    if (
        !joystickActive
    ) {

        return;

    }


    event.preventDefault();


    const point =
        getPointerPosition(
            event
        );


    let dx =
        point.x -
        joystickCenterX;


    let dy =
        point.y -
        joystickCenterY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance >
        joystickRadius
    ) {

        dx =
            dx /
            distance *
            joystickRadius;


        dy =
            dy /
            distance *
            joystickRadius;

    }


    stick.style.transform =
        `
        translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )
        `;


    moveX =
        dx /
        joystickRadius;


    moveY =
        dy /
        joystickRadius;

}


function stopJoystick(
    event
) {

    if (
        event
    ) {

        event.preventDefault();

    }


    joystickActive =
        false;


    moveX =
        0;


    moveY =
        0;


    stick.style.transform =
        "translate(-50%, -50%)";

}


/* ==================================================
   Touch
================================================== */

joystick.addEventListener(
    "touchstart",
    startJoystick,
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchmove",
    updateJoystick,
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchend",
    stopJoystick,
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchcancel",
    stopJoystick,
    {
        passive: false
    }
);


/* ==================================================
   滑鼠測試
================================================== */

joystick.addEventListener(
    "mousedown",
    startJoystick
);


window.addEventListener(
    "mousemove",
    updateJoystick
);


window.addEventListener(
    "mouseup",
    stopJoystick
);


/* ==================================================
   啟動
================================================== */

playIntro();

</script>

</body>

</html>
