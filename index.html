<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ==================================================
   開始畫面
================================================== */

#title {

    position: fixed;

    inset: 0;

    background: #000;

    color: #fff;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

}


/* ==================================================
   標題容器
================================================== */

#titleText {

    display: flex;

    justify-content: center;

    align-items: center;

    width: 95%;

    min-height: 1.1em;

    font-size:
        clamp(55px, 13vw, 120px);

    font-weight: 300;

    letter-spacing:
        clamp(5px, 1.4vw, 16px);

    line-height: 1;

    color: #f5f5f5;

}


/* ==================================================
   每一個字母
================================================== */

.letter {

    display: inline-block;

    opacity: 0;

}


/* ==================================================
   內容提示
================================================== */

.warning {

    width: 88%;

    max-width: 600px;

    margin-top: 60px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;

}

</style>

</head>


<body>


<div id="title">


    <div id="titleText"></div>


    <div class="warning">

        <p>
            內容提示
        </p>

        <p>
            本作品包含心理恐怖、
            令人不安的聲音與視覺表現，
            以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
            部分內容可能涉及敏感議題。
        </p>

        <p>
            若你容易受到心理壓迫、
            強烈聲音或失真畫面的影響，
            請自行斟酌是否遊玩。
        </p>

        <p>
            你可以隨時離開遊戲。
        </p>

    </div>


</div>



<script>

/* ==================================================
   標題
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );


const fullText =
    "Reality...?";


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }

    );

}


/* ==================================================
   單一字母慢慢出現
================================================== */

async function fadeLetter(letter) {


    let opacity = 0;


    /*
       一開始完全看不到
    */

    letter.style.opacity =
        "0";


    /*
       淡入時間

       很慢
    */

    const duration =
        2200;


    const start =
        performance.now();


    return new Promise(

        function(resolve) {


            function animate(
                now
            ) {


                const progress =
                    Math.min(

                        (now - start) /
                        duration,

                        1

                    );


                /*
                   smoothstep

                   讓開始與結尾
                   都比較柔
                */

                const eased =
                    progress *
                    progress *
                    (
                        3 -
                        2 *
                        progress
                    );


                opacity =
                    eased;


                letter.style.opacity =
                    opacity;



                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}


/* ==================================================
   已出現的字
   隨機忽隱忽現
================================================== */

function flickerLetter(
    letter
) {


    /*
       隨機延遲

       不要所有字同時閃
    */

    const delay =
        900 +
        Math.random() * 2200;


    setTimeout(

        function() {


            /*
               隨機暗度

               不會完全消失
            */

            const low =
                0.35 +
                Math.random() * 0.35;


            const fadeTime =
                350 +
                Math.random() * 500;


            letter.style.transition =
                `opacity ${fadeTime}ms ease-in-out`;


            letter.style.opacity =
                low;


            setTimeout(

                function() {


                    letter.style.opacity =
                        "1";


                    /*
                       再安排下一次
                    */

                    flickerLetter(
                        letter
                    );


                },

                fadeTime +
                150 +
                Math.random() * 500

            );


        },

        delay

    );

}


/* ==================================================
   建立標題
================================================== */

async function startTitle() {


    /*
       清空
    */

    titleText.innerHTML = "";


    /*
       逐字建立
    */

    for (
        let i = 0;

        i <
        fullText.length;

        i++
    ) {


        /*
           建立獨立字母
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            fullText[i];


        titleText.appendChild(
            letter
        );


        /*
           這個字自己慢慢出現
        */

        await fadeLetter(
            letter
        );


        /*
           這個字出現後

           開始自己的
           隨機忽隱忽現
        */

        flickerLetter(
            letter
        );


        /*
           下一個字之前
           停頓

           故意慢
        */

        await wait(
            1000 +
            Math.random() * 900
        );

    }



    /* ==================================================
       Reality...? 已完整出現
    ================================================== */


    /*
       完整停留

       3 ～ 5 秒
    */

    await wait(

        3000 +
        Math.random() * 2000

    );



    /* ==================================================
       突然消失
    ================================================== */

    titleText.style.opacity =
        "0";


    /*
       清空
    */

    await wait(100);

    titleText.innerHTML =
        "";


    /*
       黑屏

       4 ～ 6 秒
    */

    await wait(

        4000 +
        Math.random() * 2000

    );


    /*
       重新開始
    */

    startTitle();

}


/* ==================================================
   啟動
================================================== */

setTimeout(

    function() {

        startTitle();

    },

    1200

);

</script>


</body>

</html>
