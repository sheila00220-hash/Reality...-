<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;

    touch-action: none;

    font-family:
        Arial,
        "Noto Sans TC",
        sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
}


/* ==================================================
   TITLE
================================================== */

#title {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background: #000;

    color: #fff;

    overflow: hidden;
}

.titleWrapper {
    width: 100vw;
    height: 1.2em;

    display: flex;

    justify-content: center;
    align-items: center;
}

#titleText {
    margin: 0;
    padding: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(48px, 11vw, 104px);

    font-weight: 300;

    line-height: 1;

    letter-spacing: 0;

    color: #f5f5f5;

    white-space: nowrap;

    text-align: center;
}

.titleLetter {
    display: inline;

    margin: 0;
    padding: 0;

    opacity: 0;
}

.warning {
    width: 88%;
    max-width: 600px;

    margin-top: 55px;

    color: #cfcfcf;

    font-size: 14px;

    line-height: 1.8;
}

.startButton {
    margin-top: 25px;

    padding: 14px 30px;

    border:
        1px solid #aaa;

    background: transparent;

    color: white;

    font-size: 17px;

    letter-spacing: 2px;

    touch-action: manipulation;
}

.startButton:active {
    background: white;
    color: black;
}


/* ==================================================
   THREE
================================================== */

#threeContainer {
    position: absolute;
    inset: 0;
}


/* ==================================================
   HINT
================================================== */

#hint {
    position: absolute;

    top: 15px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    padding: 7px 12px;

    border-radius: 5px;

    background:
        rgba(0,0,0,.35);

    color: white;

    font-size: 13px;

    pointer-events: none;
}


/* ==================================================
   JOYSTICK
================================================== */

#joystickArea {
    position: absolute;

    left: 18px;
    bottom: 22px;

    width: 150px;
    height: 150px;

    z-index: 50;

    pointer-events: none;
}

#joystickBase {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 130px;
    height: 130px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(0,0,0,.28);

    border:
        1px solid
        rgba(255,255,255,.35);

    pointer-events: auto;

    touch-action: none;
}

#joystickRing {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 86px;
    height: 86px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.16);

    pointer-events: none;
}

#joystickKnob {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 56px;
    height: 56px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,.22);

    border:
        1px solid
        rgba(255,255,255,.65);

    pointer-events: none;

    will-change: transform;
}

#joystickBase.active {
    background:
        rgba(0,0,0,.36);
}

#joystickBase.active
#joystickKnob {
    background:
        rgba(255,255,255,.32);
}

@media (max-width:420px) {

    #joystickArea {
        left: 12px;
        bottom: 15px;

        width: 140px;
        height: 140px;
    }

    #joystickBase {
        width: 120px;
        height: 120px;
    }
}

</style>
</head>


<body>

<div id="game">


<!-- ==================================================
     TITLE
================================================== -->

<div id="title">

    <div class="titleWrapper">
        <h1 id="titleText"></h1>
    </div>

    <div class="warning">

        <p>內容提示</p>

        <p>
            本作品包含心理恐怖、
            令人不安的聲音與視覺表現，
            以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
            部分內容可能涉及敏感議題。
        </p>

        <p>
            若你容易受到心理壓迫、
            強烈聲音或失真畫面的影響，
            請自行斟酌是否遊玩。
        </p>

        <p>
            你可以隨時離開遊戲。
        </p>

    </div>

    <button
        id="startButton"
        class="startButton">

        開始你的旅程

    </button>

</div>


<div id="threeContainer"></div>


<div
    id="hint"
    style="display:none;">

    滑動畫面轉動視角

</div>


<div
    id="joystickArea"
    style="display:none;">

    <div id="joystickBase">

        <div id="joystickRing"></div>

        <div id="joystickKnob"></div>

    </div>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* ==================================================
   TITLE
================================================== */

const titleText =
    document.getElementById("titleText");

const titleWord =
    "Reality...?";

let titleRunning = true;


function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


function random(min, max) {

    return min +
        Math.random() *
        (max - min);

}


function smoothstep(t) {

    return t * t * (3 - 2 * t);

}


function createTitleLetters() {

    titleText.innerHTML = "";

    const letters = [];

    for (
        let i = 0;
        i < titleWord.length;
        i++
    ) {

        const letter =
            document.createElement("span");

        letter.className =
            "titleLetter";

        letter.textContent =
            titleWord[i];

        titleText.appendChild(letter);

        letters.push(letter);

    }

    return letters;
}


function fadeInLetter(letter) {

    return new Promise(resolve => {

        const duration =
            random(2400, 3000);

        const start =
            performance.now();

        function animate(now) {

            if (!titleRunning) {
                resolve();
                return;
            }

            const progress =
                Math.min(
                    (now - start) /
                    duration,
                    1
                );

            letter.style.opacity =
                smoothstep(progress);

            if (progress < 1) {

                requestAnimationFrame(
                    animate
                );

            } else {

                letter.style.opacity = "1";

                resolve();

            }
        }

        requestAnimationFrame(animate);

    });

}


function startIrregularBreathing(letter) {

    if (
        letter.dataset.breathing ===
        "true"
    )
        return;

    letter.dataset.breathing =
        "true";

    let state =
        "holdBright";

    let stateStart =
        performance.now();

    let stateDuration =
        random(1200, 2600);

    let startOpacity = 1;
    let targetOpacity = 1;


    function chooseNextState() {

        if (
            Math.random() < 0.55
        ) {

            state = "fadeDown";

            startOpacity = 1;

            targetOpacity =
                random(.22, .38);

            stateDuration =
                random(2600, 4200);

        } else {

            state = "fadeUp";

            startOpacity =
                parseFloat(
                    letter.style.opacity
                ) || .3;

            targetOpacity = 1;

            stateDuration =
                random(2800, 4500);

        }

        stateStart =
            performance.now();

    }


    function animate(now) {

        if (!titleRunning)
            return;

        const elapsed =
            now - stateStart;

        const progress =
            Math.min(
                elapsed /
                stateDuration,
                1
            );


        if (
            state ===
            "holdBright"
        ) {

            letter.style.opacity = "1";

        }

        else if (
            state ===
            "fadeDown"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }

        else if (
            state ===
            "holdDark"
        ) {

            letter.style.opacity =
                targetOpacity;

        }

        else if (
            state ===
            "fadeUp"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }


        if (progress >= 1) {

            if (
                state ===
                "holdBright"
            ) {

                chooseNextState();

            }

            else if (
                state ===
                "fadeDown"
            ) {

                state = "holdDark";

                stateStart =
                    performance.now();

                stateDuration =
                    random(700, 2200);

            }

            else if (
                state ===
                "holdDark"
            ) {

                state = "fadeUp";

                stateStart =
                    performance.now();

                startOpacity =
                    parseFloat(
                        letter.style.opacity
                    );

                targetOpacity = 1;

                stateDuration =
                    random(2800, 4500);

            }

            else {

                state = "holdBright";

                stateStart =
                    performance.now();

                stateDuration =
                    random(900, 3000);

            }
        }

        requestAnimationFrame(animate);

    }

    requestAnimationFrame(animate);

}


async function playTitleAnimation() {

    while (titleRunning) {

        const letters =
            createTitleLetters();

        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (!titleRunning)
                return;

            await fadeInLetter(
                letters[i]
            );

            startIrregularBreathing(
                letters[i]
            );

            await wait(
                random(500, 800)
            );

        }

        await wait(
            random(2900, 3700)
        );

        if (!titleRunning)
            return;

        titleText.innerHTML = "";

        await wait(
            random(2800, 4800)
        );

    }

}


playTitleAnimation();


/* ==================================================
   THREE / WORLD
================================================== */

let scene = null;
let camera = null;
let renderer = null;

let started = false;


/* ==================================================
   ROOM
================================================== */

const ROOM_WIDTH = 14;
const ROOM_DEPTH = 14;
const ROOM_HEIGHT = 10;


/* ==================================================
   PLAYER
================================================== */

const player = {

    x: 0,
    y: 2,
    z: 4

};


/*
    玩家碰撞半徑。
    不讓玩家真的貼住牆。
*/

const PLAYER_RADIUS = .25;


/* ==================================================
   CAMERA
================================================== */

let yaw = 0;
let pitch = 0;

const PITCH_LIMIT = 1.0;

const LOOK_SENSITIVITY_X =
    .0022;

const LOOK_SENSITIVITY_Y =
    .0022;


/* ==================================================
   FOV
================================================== */

const MIN_FOV = 55;
const MAX_FOV = 95;
const DEFAULT_FOV = 75;


/* ==================================================
   MOVEMENT
================================================== */

const movement = {

    forward: false,
    back: false,
    left: false,
    right: false

};


/* ==================================================
   START
================================================== */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    if (started)
        return;

    started = true;

    titleRunning = false;

    stopJoystick();

    document
        .getElementById("title")
        .style.display = "none";

    document
        .getElementById("hint")
        .style.display = "block";

    document
        .getElementById("joystickArea")
        .style.display = "block";

    createWorld();

}


/* ==================================================
   CREATE WORLD
================================================== */

function createWorld() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0xb0b0b0);


    camera =
        new THREE.PerspectiveCamera(

            DEFAULT_FOV,

            window.innerWidth /
            window.innerHeight,

            .1,

            100

        );


    camera.position.set(
        player.x,
        player.y,
        player.z
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            2
        )
    );


    createRoom();

    setupTouch();

    setupJoystick();

    animate();

}


/* ==================================================
   ROOM
================================================== */

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;


    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color: 0x707070,

                side:
                    THREE.DoubleSide

            })

        );


    floor.rotation.x =
        -Math.PI / 2;

    scene.add(floor);


    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color: 0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );


    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y = H;

    scene.add(ceiling);


    /*
       四面牆
       全部使用同一套房間尺寸。
    */

    const front =
        createWall(
            W,
            H,
            0xc2c2c2
        );

    front.position.set(
        0,
        H / 2,
        -D / 2
    );

    scene.add(front);


    const back =
        createWall(
            W,
            H,
            0xb7b7b7
        );

    back.position.set(
        0,
        H / 2,
        D / 2
    );

    scene.add(back);


    const left =
        createWall(
            D,
            H,
            0xaeaeae
        );

    left.rotation.y =
        Math.PI / 2;

    left.position.set(
        -W / 2,
        H / 2,
        0
    );

    scene.add(left);


    const right =
        createWall(
            D,
            H,
            0xa6a6a6
        );

    right.rotation.y =
        Math.PI / 2;

    right.position.set(
        W / 2,
        H / 2,
        0
    );

    scene.add(right);


    createRoomEdges(
        W,
        H,
        D
    );

}


function createWall(
    width,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            color: color,

            side:
                THREE.DoubleSide

        })

    );

}


function createRoomEdges(
    W,
    H,
    D
) {

    const geometry =
        new THREE.BoxGeometry(
            W,
            H,
            D
        );

    const edges =
        new THREE.EdgesGeometry(
            geometry
        );

    const material =
        new THREE.LineBasicMaterial({

            color: 0x666666,

            transparent: true,

            opacity: .45

        });

    const lines =
        new THREE.LineSegments(
            edges,
            material
        );

    lines.position.y =
        H / 2;

    scene.add(lines);

}


/* ==================================================
   MOVEMENT
================================================== */

function updatePlayer() {

    if (!camera)
        return;


    const speed = .08;


    /*
       由 yaw 得到玩家面向方向。
    */

    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    const rightX =
        Math.cos(yaw);

    const rightZ =
        Math.sin(yaw);


    let inputX = 0;
    let inputZ = 0;


    /*
       搖桿 / 移動輸入
    */

    if (movement.forward) {

        inputX += forwardX;
        inputZ += forwardZ;

    }

    if (movement.back) {

        inputX -= forwardX;
        inputZ -= forwardZ;

    }

    if (movement.left) {

        inputX -= rightX;
        inputZ -= rightZ;

    }

    if (movement.right) {

        inputX += rightX;
        inputZ += rightZ;

    }


    /*
       正規化
    */

    const length =
        Math.hypot(
            inputX,
            inputZ
        );


    if (length <= 0) {

        updateCamera();

        return;

    }


    const moveX =
        inputX /
        length *
        speed;


    const moveZ =
        inputZ /
        length *
        speed;


    /*
       =================================================
       X / Z 分離碰撞
       =================================================
    */

    const minX =
        -ROOM_WIDTH / 2 +
        PLAYER_RADIUS;

    const maxX =
        ROOM_WIDTH / 2 -
        PLAYER_RADIUS;

    const minZ =
        -ROOM_DEPTH / 2 +
        PLAYER_RADIUS;

    const maxZ =
        ROOM_DEPTH / 2 -
        PLAYER_RADIUS;


    /*
       先檢查 X。
    */

    const nextX =
        player.x +
        moveX;


    if (
        nextX >= minX &&
        nextX <= maxX
    ) {

        player.x =
            nextX;

    }


    /*
       再檢查 Z。
    */

    const nextZ =
        player.z +
        moveZ;


    if (
        nextZ >= minZ &&
        nextZ <= maxZ
    ) {

        player.z =
            nextZ;

    }


    updateCamera();

}


/* ==================================================
   CAMERA
================================================== */

function updateCamera() {

    /*
       碰撞系統完全不碰：
       yaw
       pitch
       FOV
    */

    camera.position.set(
        player.x,
        player.y,
        player.z
    );


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}


/* ==================================================
   TOUCH STATE
================================================== */

const activeTouches =
    new Map();


let touchMode =
    "none";


let lookPointerId =
    null;


let lastLookX = 0;
let lastLookY = 0;


let previousPinchDistance =
    null;


let mouseLooking =
    false;


/* ==================================================
   PINCH
================================================== */

function getPinchDistance() {

    const points =
        Array.from(
            activeTouches.values()
        );


    if (
        points.length < 2
    )
        return null;


    const a = points[0];
    const b = points[1];


    return Math.hypot(
        b.x - a.x,
        b.y - a.y
    );

}


function enterPinchMode() {

    touchMode = "pinch";

    lookPointerId = null;

    previousPinchDistance =
        getPinchDistance();

}


function enterLookMode() {

    const entries =
        Array.from(
            activeTouches.entries()
        );


    if (
        entries.length !== 1
    ) {

        touchMode = "none";

        lookPointerId = null;

        return;

    }


    const [
        id,
        point
    ] = entries[0];


    touchMode = "look";

    lookPointerId = id;

    lastLookX = point.x;
    lastLookY = point.y;

    previousPinchDistance =
        null;

}


/* ==================================================
   TOUCH
================================================== */

function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.style.touchAction =
        "none";


    canvas.addEventListener(
        "pointerdown",
        event => {

            /*
               搖桿不會進來，
               因為它有自己的 pointer target。
            */

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (
                    event.button !== 0
                )
                    return;

                mouseLooking = true;

                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

                return;

            }


            event.preventDefault();


            activeTouches.set(
                event.pointerId,
                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }
            );


            if (
                activeTouches.size === 1
            ) {

                touchMode = "look";

                lookPointerId =
                    event.pointerId;

                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

            }

            else {

                enterPinchMode();

            }

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "pointermove",
        event => {

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (!mouseLooking)
                    return;

                const dx =
                    event.clientX -
                    lastLookX;

                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(
                        -PITCH_LIMIT,
                        Math.min(
                            PITCH_LIMIT,
                            pitch
                        )
                    );


                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

                return;

            }


            if (
                !activeTouches.has(
                    event.pointerId
                )
            )
                return;


            event.preventDefault();


            activeTouches.set(
                event.pointerId,
                {
                    x:
                        event.clientX,

                    y:
                        event.clientY
                }
            );


            if (
                touchMode ===
                "pinch"
            ) {

                const distance =
                    getPinchDistance();


                if (
                    distance !== null &&
                    previousPinchDistance !== null
                ) {

                    const delta =
                        distance -
                        previousPinchDistance;


                    camera.fov +=
                        delta * .08;


                    camera.fov =
                        Math.max(
                            MIN_FOV,
                            Math.min(
                                MAX_FOV,
                                camera.fov
                            )
                        );


                    camera.updateProjectionMatrix();

                }


                previousPinchDistance =
                    distance;

                return;

            }


            if (
                touchMode === "look" &&
                event.pointerId ===
                lookPointerId
            ) {

                const dx =
                    event.clientX -
                    lastLookX;

                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(
                        -PITCH_LIMIT,
                        Math.min(
                            PITCH_LIMIT,
                            pitch
                        )
                    );


                lastLookX =
                    event.clientX;

                lastLookY =
                    event.clientY;

            }

        },
        {
            passive: false
        }
    );


    function endTouch(event) {

        if (
            event.pointerType ===
            "mouse"
        ) {

            mouseLooking = false;

            return;

        }


        if (
            !activeTouches.has(
                event.pointerId
            )
        )
            return;


        activeTouches.delete(
            event.pointerId
        );


        if (
            activeTouches.size === 0
        ) {

            touchMode = "none";

            lookPointerId = null;

            previousPinchDistance =
                null;

        }

        else if (
            activeTouches.size === 1
        ) {

            enterLookMode();

        }

    }


    canvas.addEventListener(
        "pointerup",
        endTouch
    );

    canvas.addEventListener(
        "pointercancel",
        endTouch
    );

}


/* ==================================================
   JOYSTICK
================================================== */

const joystickBase =
    document.getElementById(
        "joystickBase"
    );

const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );


let joystickPointerId =
    null;

let joystickActive =
    false;


const JOYSTICK_RADIUS =
    37;

const JOYSTICK_DEAD_ZONE =
    .12;


function getJoystickCenter() {

    const rect =
        joystickBase.getBoundingClientRect();


    return {

        x:
            rect.left +
            rect.width / 2,

        y:
            rect.top +
            rect.height / 2

    };

}


function updateJoystick(
    clientX,
    clientY
) {

    const center =
        getJoystickCenter();


    let dx =
        clientX -
        center.x;

    let dy =
        clientY -
        center.y;


    const distance =
        Math.hypot(dx, dy);


    if (
        distance >
        JOYSTICK_RADIUS
    ) {

        const scale =
            JOYSTICK_RADIUS /
            distance;

        dx *= scale;
        dy *= scale;

    }


    const x =
        dx /
        JOYSTICK_RADIUS;

    const y =
        dy /
        JOYSTICK_RADIUS;


    joystickKnob.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;


    movement.forward =
        y < -JOYSTICK_DEAD_ZONE;

    movement.back =
        y > JOYSTICK_DEAD_ZONE;

    movement.left =
        x < -JOYSTICK_DEAD_ZONE;

    movement.right =
        x > JOYSTICK_DEAD_ZONE;

}


function stopJoystick() {

    joystickPointerId =
        null;

    joystickActive =
        false;


    movement.forward = false;
    movement.back = false;
    movement.left = false;
    movement.right = false;


    joystickBase.classList.remove(
        "active"
    );


    joystickKnob.style.transform =
        "translate(-50%, -50%)";

}


function setupJoystick() {

    joystickBase.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            event.stopPropagation();


            if (
                joystickPointerId !==
                null
            )
                return;


            joystickPointerId =
                event.pointerId;


            joystickActive =
                true;


            joystickBase.classList.add(
                "active"
            );


            try {

                joystickBase.setPointerCapture(
                    event.pointerId
                );

            } catch (_) {}


            updateJoystick(
                event.clientX,
                event.clientY
            );

        },
        {
            passive: false
        }
    );


    joystickBase.addEventListener(
        "pointermove",
        event => {

            if (
                !joystickActive ||
                event.pointerId !==
                joystickPointerId
            )
                return;


            event.preventDefault();

            event.stopPropagation();


            updateJoystick(
                event.clientX,
                event.clientY
            );

        },
        {
            passive: false
        }
    );


    joystickBase.addEventListener(
        "pointerup",
        event => {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;


            event.preventDefault();

            event.stopPropagation();


            stopJoystick();

        },
        {
            passive: false
        }
    );


    joystickBase.addEventListener(
        "pointercancel",
        event => {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;


            stopJoystick();

        },
        {
            passive: false
        }
    );


    joystickBase.addEventListener(
        "lostpointercapture",
        () => {

            if (
                joystickPointerId !==
                null
            ) {

                stopJoystick();

            }

        }
    );

}


/* ==================================================
   GAME LOOP
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (started) {

        updatePlayer();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
    "resize",
    () => {

        if (
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ==================================================
   RESET INPUT
================================================== */

window.addEventListener(
    "blur",
    () => {

        stopJoystick();

        activeTouches.clear();

        touchMode = "none";

        lookPointerId = null;

        mouseLooking = false;

    }
);

</script>
