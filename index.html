<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>


<style>

html,
body {

    margin: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;

}


#text {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(60px, 15vw, 130px);

    font-weight: 300;

    letter-spacing: 10px;

    white-space: nowrap;

}


.letter {

    display: inline-block;

    opacity: 0;

}

</style>

</head>


<body>


<div id="text"></div>


<script>


const text =
    document.getElementById("text");


const word =
    "Reality...?";


/* ==================================================
   所有已經完成的舊字
================================================== */

const oldLetters = [];


/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }

    );

}


/* ==================================================
   新字顯現

   1% → 100%

   只負責自己
================================================== */

function revealLetter(letter) {

    return new Promise(

        function(resolve) {


            const duration =
                1400;


            const start =
                performance.now();


            function animate(now) {


                const progress =
                    Math.min(

                        (now - start) /
                        duration,

                        1

                    );


                /*
                   新字：

                   1%
                   ↓
                   100%

                   絕對不倒退
                */

                letter.style.opacity =
                    0.01 +
                    (
                        0.99 *
                        progress
                    );


                if (
                    progress < 1
                ) {


                    requestAnimationFrame(
                        animate
                    );


                }

                else {


                    letter.style.opacity =
                        "1";


                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}


/* ==================================================
   舊字「持續呼吸」

   不是閃爍

   是連續的透明度曲線
================================================== */

function startBreathing(
    letter,
    index
) {


    /*
       每個字速度稍微不同

       避免全部同步
    */

    const speed =
        0.0018 +
        (
            index *
            0.00018
        );


    /*
       每個字稍微錯開
    */

    const phase =
        index *
        1.8;


    function breathe(time) {


        /*
           如果字還存在
           就一直呼吸
        */

        if (
            !letter.isConnected
        ) {

            return;

        }


        /*
           sin：

           -1 → +1

           是連續曲線
        */

        const wave =
            Math.sin(

                time *
                speed
                +
                phase

            );


        /*
           透明度：

           25% ～ 100%

           變化幅度明顯
        */

        const opacity =
            0.625 +
            (
                wave *
                0.375
            );


        letter.style.opacity =
            opacity;


        requestAnimationFrame(
            breathe
        );

    }


    requestAnimationFrame(
        breathe
    );

}


/* ==================================================
   主動畫
================================================== */

async function start() {


    /*
       黑屏
    */

    await wait(
        1500
    );


    /*
       清空
    */

    text.innerHTML =
        "";


    oldLetters.length =
        0;



    /*
       ==========================================
       一個字一個字出現
       ==========================================
    */

    for (
        let i = 0;

        i < word.length;

        i++
    ) {


        /*
           建立新字
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            word[i];


        /*
           新字從 1%
        */

        letter.style.opacity =
            "0.01";


        text.appendChild(
            letter
        );



        /*
           ========================================
           新字開始出現之前：

           先讓所有舊字開始呼吸
           ========================================
        */

        for (
            let j = 0;

            j <
            oldLetters.length;

            j++
        ) {


            /*
               只啟動一次
            */

            if (
                !oldLetters[j]
                    .dataset
                    .breathing
            ) {


                oldLetters[j]
                    .dataset
                    .breathing =
                    "true";


                startBreathing(

                    oldLetters[j],

                    j

                );

            }

        }



        /*
           ========================================
           新字：

           1% → 100%
           ========================================
        */

        await revealLetter(
            letter
        );


        /*
           新字完成

           現在它變成舊字
        */

        oldLetters.push(
            letter
        );


        /*
           停頓
        */

        await wait(
            1200
        );

    }



    /*
       ==========================================
       全部完成
       ==========================================
    */

    /*
       最後一個字也加入呼吸

       但稍微延遲
    */

    await wait(
        800
    );


    /*
       Reality...? 完整存在
    */

    await wait(
        3500
    );


    /*
       ==========================================
       瞬間消失
       ==========================================
    */

    text.innerHTML =
        "";


    /*
       黑屏
    */

    await wait(
        4500
    );


    /*
       重來
    */

    start();

}


/* ==================================================
   開始
================================================== */

start();

</script>

</body>

</html>
