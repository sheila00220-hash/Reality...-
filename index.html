<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
user-scalable=no">

<title>Reality...? 3D TEST</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#start {
    position: absolute;
    inset: 0;

    background: #000;
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

button {
    padding: 15px 30px;

    background: transparent;
    color: white;

    border: 1px solid white;

    font-size: 18px;
}

#three {
    position: fixed;
    inset: 0;
}

</style>

</head>

<body>

<div id="start">

    <button onclick="start()">
        開始你的旅程
    </button>

</div>

<div id="three"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>


<script>

function start() {

    document.getElementById("start").style.display = "none";

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x777777);


    const camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.1,
            100
        );


    camera.position.set(
        0,
        0,
        5
    );


    const renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    document
        .getElementById("three")
        .appendChild(renderer.domElement);


    /* 一個巨大的立方體 */

    const cube =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2,
                2,
                2
            ),

            new THREE.MeshBasicMaterial({

                color: 0xffffff

            })

        );


    scene.add(cube);


    function animate() {

        requestAnimationFrame(
            animate
        );

        cube.rotation.x += 0.01;

        cube.rotation.y += 0.01;

        renderer.render(
            scene,
            camera
        );

    }


    animate();

}

</script>

</body>
</html>
