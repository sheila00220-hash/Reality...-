<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0">

<title>Reality...?</title>


<style>

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: black;

}


#text {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(60px, 15vw, 130px);

    font-weight: 300;

    letter-spacing: 10px;

    white-space: nowrap;

}


.letter {

    display: inline-block;

    opacity: 0;

}

</style>

</head>


<body>


<div id="text"></div>



<script>


const text =
    document.getElementById("text");


const word =
    "Reality...?";



/* ==================================================
   等待
================================================== */

function wait(ms) {

    return new Promise(

        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }

    );

}



/* ==================================================
   新字：
   1% → 100%
================================================== */

function revealLetter(letter) {

    return new Promise(

        function(resolve) {


            const duration =
                1200;


            const start =
                performance.now();



            function animate(now) {


                const progress =
                    Math.min(

                        (now - start) /
                        duration,

                        1

                    );


                /*
                   1% → 100%

                   不倒退
                */

                const opacity =
                    0.01 +
                    (
                        0.99 *
                        progress
                    );


                letter.style.opacity =
                    opacity;



                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }

    );

}



/* ==================================================
   舊字：
   很慢、很輕微地忽隱忽現
================================================== */

function gentleFlicker(letter) {


    /*
       隨機等待

       不會全部同時變化
    */

    const delay =
        900 +
        Math.random() * 1800;



    setTimeout(

        async function() {


            /*
               只降低一點

               不會突然消失
            */

            const low =
                0.88 +
                Math.random() * 0.08;


            /*
               慢慢暗下去
            */

            letter.style.transition =
                "opacity 900ms ease-in-out";


            letter.style.opacity =
                low;



            await wait(
                900
            );



            /*
               慢慢回到完整
            */

            letter.style.opacity =
                "1";



            await wait(
                900 +
                Math.random() * 1200
            );



            /*
               下一次
            */

            gentleFlicker(
                letter
            );


        },

        delay

    );

}



/* ==================================================
   主動畫
================================================== */

async function start() {


    /*
       開始前黑屏
    */

    await wait(
        1500
    );



    /*
       一個字一個字增加
    */

    for (
        let i = 0;

        i <
        word.length;

        i++
    ) {


        /*
           建立新字
        */

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "letter";


        letter.textContent =
            word[i];


        /*
           新字從 1% 開始
        */

        letter.style.opacity =
            "0.01";


        text.appendChild(
            letter
        );



        /*
           新字開始顯影

           如果前面已經有字，
           它們現在才開始輕微閃動
        */

        if (
            i > 0
        ) {


            const oldLetters =
                text.querySelectorAll(
                    ".letter"
                );


            /*
               不讓最新的字參與舊字閃爍
            */

            for (
                let j = 0;

                j <
                oldLetters.length - 1;

                j++
            ) {


                gentleFlicker(
                    oldLetters[j]
                );

            }

        }



        /*
           新字：

           1% → 100%
        */

        await revealLetter(
            letter
        );



        /*
           字完成後停頓

           故意慢
        */

        await wait(
            1200
        );

    }



    /*
       ==================================================
       Reality...? 完整出現
       ==================================================
    */


    await wait(
        3500
    );



    /*
       ==================================================
       突然消失
       ==================================================
    */

    text.innerHTML =
        "";



    /*
       黑屏
    */

    await wait(
        4500
    );



    /*
       重新開始
    */

    start();

}



/* ==================================================
   啟動
================================================== */

start();

</script>

</body>

</html>
