<div id="game">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>


<script>


/* ==================================================
   標題動畫
================================================== */

const titleText =
    document.getElementById(
        "titleText"
    );


const titleWord =
    "Reality...?";


let titleRunning =
    true;


function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function random(min, max) {

    return (
        min +
        Math.random() *
        (max - min)
    );

}


function smoothstep(t) {

    return (
        t *
        t *
        (3 - 2 * t)
    );

}


function createTitleLetters() {

    titleText.innerHTML = "";

    const letters = [];


    for (
        let i = 0;
        i < titleWord.length;
        i++
    ) {

        const letter =
            document.createElement(
                "span"
            );


        letter.className =
            "titleLetter";


        letter.textContent =
            titleWord[i];


        titleText.appendChild(
            letter
        );


        letters.push(
            letter
        );

    }


    return letters;

}


function fadeInLetter(letter) {

    return new Promise(
        resolve => {

            const duration =
                random(
                    2400,
                    3000
                );


            const start =
                performance.now();


            function animate(now) {

                if (!titleRunning) {

                    resolve();

                    return;

                }


                const progress =
                    Math.min(

                        (
                            now -
                            start
                        ) /
                        duration,

                        1

                    );


                letter.style.opacity =
                    smoothstep(
                        progress
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    letter.style.opacity =
                        "1";

                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );

}


function startIrregularBreathing(letter) {

    if (
        letter.dataset.breathing ===
        "true"
    )
        return;


    letter.dataset.breathing =
        "true";


    let state =
        "holdBright";


    let stateStart =
        performance.now();


    let stateDuration =
        random(
            1200,
            2600
        );


    let startOpacity =
        1;


    let targetOpacity =
        1;


    function chooseNextState() {

        if (
            Math.random() < 0.55
        ) {

            state =
                "fadeDown";


            startOpacity =
                1;


            targetOpacity =
                random(
                    0.22,
                    0.38
                );


            stateDuration =
                random(
                    2600,
                    4200
                );

        }

        else {

            state =
                "fadeUp";


            startOpacity =
                parseFloat(
                    letter.style.opacity
                ) || 0.3;


            targetOpacity =
                1;


            stateDuration =
                random(
                    2800,
                    4500
                );

        }


        stateStart =
            performance.now();

    }


    function animate(now) {

        if (!titleRunning)
            return;


        const elapsed =
            now -
            stateStart;


        const progress =
            Math.min(
                elapsed /
                stateDuration,
                1
            );


        if (
            state ===
            "holdBright"
        ) {

            letter.style.opacity =
                "1";

        }

        else if (
            state ===
            "fadeDown"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }

        else if (
            state ===
            "holdDark"
        ) {

            letter.style.opacity =
                targetOpacity;

        }

        else if (
            state ===
            "fadeUp"
        ) {

            letter.style.opacity =
                startOpacity +
                (
                    targetOpacity -
                    startOpacity
                ) *
                smoothstep(progress);

        }


        if (
            progress >= 1
        ) {

            if (
                state ===
                "holdBright"
            ) {

                chooseNextState();

            }

            else if (
                state ===
                "fadeDown"
            ) {

                state =
                    "holdDark";


                stateStart =
                    performance.now();


                stateDuration =
                    random(
                        700,
                        2200
                    );

            }

            else if (
                state ===
                "holdDark"
            ) {

                state =
                    "fadeUp";


                stateStart =
                    performance.now();


                startOpacity =
                    parseFloat(
                        letter.style.opacity
                    );


                targetOpacity =
                    1;


                stateDuration =
                    random(
                        2800,
                        4500
                    );

            }

            else {

                state =
                    "holdBright";


                stateStart =
                    performance.now();


                stateDuration =
                    random(
                        900,
                        3000
                    );

            }

        }


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


async function playTitleAnimation() {

    while (
        titleRunning
    ) {

        const letters =
            createTitleLetters();


        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (!titleRunning)
                return;


            await fadeInLetter(
                letters[i]
            );


            startIrregularBreathing(
                letters[i]
            );


            await wait(
                random(
                    500,
                    800
                )
            );

        }


        await wait(
            random(
                2900,
                3700
            )
        );


        if (!titleRunning)
            return;


        titleText.innerHTML =
            "";


        await wait(
            random(
                2800,
                4800
            )
        );

    }

}


playTitleAnimation();


/* ==================================================
   Three.js
================================================== */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let started =
    false;


/* ==================================================
   房間
================================================== */

const ROOM_WIDTH =
    14;

const ROOM_DEPTH =
    14;

const ROOM_HEIGHT =
    10;


/* ==================================================
   玩家
================================================== */

const player = {

    x: 0,

    y: 2,

    z: 4

};


/*
   玩家與牆之間的安全距離。

   比之前稍微大一點，
   避免玩家貼到牆。
*/

const PLAYER_RADIUS =
    0.25;


/* ==================================================
   視角
================================================== */

let yaw =
    0;

let pitch =
    0;


const PITCH_LIMIT =
    1.0;


const LOOK_SENSITIVITY_X =
    0.0022;


const LOOK_SENSITIVITY_Y =
    0.0022;


/* ==================================================
   FOV
================================================== */

const MIN_FOV =
    55;

const MAX_FOV =
    95;

const DEFAULT_FOV =
    75;


/* ==================================================
   移動狀態
================================================== */

const movement = {

    forward: false,

    back: false,

    left: false,

    right: false

};


/* ==================================================
   開始
================================================== */

document
    .getElementById(
        "startButton"
    )
    .addEventListener(
        "click",
        startGame
    );


function startGame() {

    if (started)
        return;


    started =
        true;


    titleRunning =
        false;


    stopJoystick();


    document
        .getElementById(
            "title"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "hint"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "joystickArea"
        )
        .style.display =
        "block";


    createWorld();

}


/* ==================================================
   建立世界
================================================== */

function createWorld() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0xb0b0b0
        );


    camera =
        new THREE.PerspectiveCamera(

            DEFAULT_FOV,

            window.innerWidth /
            window.innerHeight,

            0.1,

            100

        );


    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:
                true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    document
        .getElementById(
            "threeContainer"
        )
        .appendChild(
            renderer.domElement
        );


    scene.add(

        new THREE.AmbientLight(
            0xffffff,
            2
        )

    );


    createRoom();

    setupTouch();

    setupJoystick();

    animate();

}


/* ==================================================
   建立房間
================================================== */

function createRoom() {

    const W =
        ROOM_WIDTH;

    const H =
        ROOM_HEIGHT;

    const D =
        ROOM_DEPTH;


    /* 地板 */

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0x707070,

                side:
                    THREE.DoubleSide

            })

        );


    floor.rotation.x =
        -Math.PI / 2;


    scene.add(
        floor
    );


    /* 天花板 */

    const ceiling =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                W,
                D
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xd8d8d8,

                side:
                    THREE.DoubleSide

            })

        );


    ceiling.rotation.x =
        Math.PI / 2;


    ceiling.position.y =
        H;


    scene.add(
        ceiling
    );


    /* 前牆 */

    const front =
        createWall(
            W,
            H,
            0xc2c2c2
        );


    front.position.set(
        0,
        H / 2,
        -D / 2
    );


    scene.add(
        front
    );


    /* 後牆 */

    const back =
        createWall(
            W,
            H,
            0xb7b7b7
        );


    back.position.set(
        0,
        H / 2,
        D / 2
    );


    scene.add(
        back
    );


    /* 左牆 */

    const left =
        createWall(
            D,
            H,
            0xaeaeae
        );


    left.rotation.y =
        Math.PI / 2;


    left.position.set(
        -W / 2,
        H / 2,
        0
    );


    scene.add(
        left
    );


    /* 右牆 */

    const right =
        createWall(
            D,
            H,
            0xa6a6a6
        );


    right.rotation.y =
        Math.PI / 2;


    right.position.set(
        W / 2,
        H / 2,
        0
    );


    scene.add(
        right
    );


    createRoomEdges(
        W,
        H,
        D
    );

}


/* ==================================================
   建立牆
================================================== */

function createWall(
    width,
    height,
    color
) {

    return new THREE.Mesh(

        new THREE.PlaneGeometry(
            width,
            height
        ),

        new THREE.MeshBasicMaterial({

            color:
                color,

            side:
                THREE.DoubleSide

        })

    );

}


/* ==================================================
   房間邊線
================================================== */

function createRoomEdges(
    W,
    H,
    D
) {

    const geometry =
        new THREE.BoxGeometry(
            W,
            H,
            D
        );


    const edges =
        new THREE.EdgesGeometry(
            geometry
        );


    const material =
        new THREE.LineBasicMaterial({

            color:
                0x666666,

            transparent:
                true,

            opacity:
                0.45

        });


    const lines =
        new THREE.LineSegments(
            edges,
            material
        );


    lines.position.y =
        H / 2;


    scene.add(
        lines
    );

}


/* ==================================================
   玩家移動
================================================== */

function updatePlayer() {

    if (!camera)
        return;


    const speed =
        0.08;


    /*
       根據 yaw 計算
       玩家目前面向的世界方向。
    */

    const forwardX =
        Math.sin(yaw);


    const forwardZ =
        -Math.cos(yaw);


    let moveX =
        0;

    let moveZ =
        0;


    /* =========================
       前後左右
    ========================= */

    if (
        movement.forward
    ) {

        moveX +=
            forwardX;

        moveZ +=
            forwardZ;

    }


    if (
        movement.back
    ) {

        moveX -=
            forwardX;

        moveZ -=
            forwardZ;

    }


    if (
        movement.left
    ) {

        moveX -=
            Math.cos(yaw);

        moveZ -=
            Math.sin(yaw);

    }


    if (
        movement.right
    ) {

        moveX +=
            Math.cos(yaw);

        moveZ +=
            Math.sin(yaw);

    }


    /*
       正規化。

       避免斜走比直走快。
    */

    const length =
        Math.sqrt(
            moveX * moveX +
            moveZ * moveZ
        );


    if (
        length > 0
    ) {

        moveX =
            moveX /
            length *
            speed;


        moveZ =
            moveZ /
            length *
            speed;

    }


    /*
       =================================================
       新碰撞邏輯
       =================================================

       X 與 Z 分開判斷。

       這很重要。

       例如：

       玩家斜著靠近牆

       X 可以走
       Z 被牆擋住

       → X 繼續
       → Z 停止

       不會整個玩家被卡住。
    */


    const limitX =
        ROOM_WIDTH / 2 -
        PLAYER_RADIUS;


    const limitZ =
        ROOM_DEPTH / 2 -
        PLAYER_RADIUS;


    /*
       -------------------------
       第一步：X 軸
       -------------------------
    */

    if (
        moveX !== 0
    ) {

        const nextX =
            player.x +
            moveX;


        if (
            nextX >= -limitX &&
            nextX <= limitX
        ) {

            player.x =
                nextX;

        }

    }


    /*
       -------------------------
       第二步：Z 軸
       -------------------------
    */

    if (
        moveZ !== 0
    ) {

        const nextZ =
            player.z +
            moveZ;


        if (
            nextZ >= -limitZ &&
            nextZ <= limitZ
        ) {

            player.z =
                nextZ;

        }

    }


    /*
       =================================================
       相機位置
       =================================================

       碰撞系統只修改：

       player.x
       player.z

       不修改：

       yaw
       pitch
       FOV
    */

    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* ==================================================
   視角系統
================================================== */

const activeTouches =
    new Map();


let touchMode =
    "none";


let lookPointerId =
    null;


let lastLookX =
    0;


let lastLookY =
    0;


let previousPinchDistance =
    null;


let looking =
    false;


/* ==================================================
   雙指距離
================================================== */

function getPinchDistance() {

    const points =
        Array.from(
            activeTouches.values()
        );


    if (
        points.length < 2
    )
        return null;


    const a =
        points[0];

    const b =
        points[1];


    const dx =
        b.x -
        a.x;


    const dy =
        b.y -
        a.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* ==================================================
   進入雙指
================================================== */

function enterPinchMode() {

    touchMode =
        "pinch";


    lookPointerId =
        null;


    previousPinchDistance =
        getPinchDistance();

}


/* ==================================================
   回到單指
================================================== */

function enterLookMode() {

    const points =
        Array.from(
            activeTouches.entries()
        );


    if (
        points.length !== 1
    ) {

        touchMode =
            "none";

        lookPointerId =
            null;

        return;

    }


    const [
        pointerId,
        point
    ] =
        points[0];


    touchMode =
        "look";


    lookPointerId =
        pointerId;


    lastLookX =
        point.x;


    lastLookY =
        point.y;


    previousPinchDistance =
        null;

}


/* ==================================================
   Touch
================================================== */

function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.style.touchAction =
        "none";


    canvas.addEventListener(

        "pointerdown",

        function(event) {

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (
                    event.button !== 0
                )
                    return;


                looking =
                    true;


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;


                return;

            }


            event.preventDefault();


            activeTouches.set(

                event.pointerId,

                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );


            if (
                activeTouches.size ===
                1
            ) {

                touchMode =
                    "look";


                lookPointerId =
                    event.pointerId;


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;

            }

            else if (
                activeTouches.size >= 2
            ) {

                enterPinchMode();

            }

        },

        {
            passive:
                false
        }

    );


    canvas.addEventListener(

        "pointermove",

        function(event) {

            if (
                event.pointerType ===
                "mouse"
            ) {

                if (!looking)
                    return;


                const dx =
                    event.clientX -
                    lastLookX;


                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(

                        -PITCH_LIMIT,

                        Math.min(
                            PITCH_LIMIT,
                            pitch
                        )

                    );


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;


                return;

            }


            if (
                !activeTouches.has(
                    event.pointerId
                )
            )
                return;


            event.preventDefault();


            activeTouches.set(

                event.pointerId,

                {

                    x:
                        event.clientX,

                    y:
                        event.clientY

                }

            );


            if (
                touchMode ===
                "pinch"
            ) {

                const distance =
                    getPinchDistance();


                if (
                    distance !== null &&
                    previousPinchDistance !== null
                ) {

                    const delta =
                        distance -
                        previousPinchDistance;


                    camera.fov +=
                        delta *
                        0.08;


                    camera.fov =
                        Math.max(

                            MIN_FOV,

                            Math.min(
                                MAX_FOV,
                                camera.fov
                            )

                        );


                    camera.updateProjectionMatrix();

                }


                previousPinchDistance =
                    distance;


                return;

            }


            if (
                touchMode ===
                "look" &&
                event.pointerId ===
                lookPointerId
            ) {

                const dx =
                    event.clientX -
                    lastLookX;


                const dy =
                    event.clientY -
                    lastLookY;


                yaw -=
                    dx *
                    LOOK_SENSITIVITY_X;


                pitch -=
                    dy *
                    LOOK_SENSITIVITY_Y;


                pitch =
                    Math.max(

                        -PITCH_LIMIT,

                        Math.min(
                            PITCH_LIMIT,
                            pitch
                        )

                    );


                lastLookX =
                    event.clientX;


                lastLookY =
                    event.clientY;

            }

        },

        {
            passive:
                false
        }

    );


    function pointerEnd(event) {

        if (
            event.pointerType ===
            "mouse"
        ) {

            looking =
                false;

            return;

        }


        if (
            !activeTouches.has(
                event.pointerId
            )
        )
            return;


        activeTouches.delete(
            event.pointerId
        );


        if (
            activeTouches.size ===
            0
        ) {

            touchMode =
                "none";


            lookPointerId =
                null;


            previousPinchDistance =
                null;


        }

        else if (
            activeTouches.size ===
            1
        ) {

            enterLookMode();

        }

    }


    canvas.addEventListener(
        "pointerup",
        pointerEnd
    );


    canvas.addEventListener(
        "pointercancel",
        pointerEnd
    );

}


/* ==================================================
   🕹️ 虛擬搖桿
================================================== */

const joystickBase =
    document.getElementById(
        "joystickBase"
    );


const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );


let joystickPointerId =
    null;


let joystickActive =
    false;


let joystickX =
    0;


let joystickY =
    0;


const JOYSTICK_RADIUS =
    37;


/* ==================================================
   搖桿中心
================================================== */

function getJoystickCenter() {

    const rect =
        joystickBase.getBoundingClientRect();


    return {

        x:
            rect.left +
            rect.width / 2,

        y:
            rect.top +
            rect.height / 2

    };

}


/* ==================================================
   更新搖桿
================================================== */

function updateJoystick(
    clientX,
    clientY
) {

    const center =
        getJoystickCenter();


    let dx =
        clientX -
        center.x;


    let dy =
        clientY -
        center.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance >
        JOYSTICK_RADIUS
    ) {

        const ratio =
            JOYSTICK_RADIUS /
            distance;


        dx *=
            ratio;


        dy *=
            ratio;

    }


    joystickX =
        dx /
        JOYSTICK_RADIUS;


    joystickY =
        dy /
        JOYSTICK_RADIUS;


    joystickKnob.style.transform =

        "translate(" +

        "calc(-50% + " +
        dx +
        "px), " +

        "calc(-50% + " +
        dy +
        "px))";


    const DEAD_ZONE =
        0.12;


    movement.forward =
        joystickY <
        -DEAD_ZONE;


    movement.back =
        joystickY >
        DEAD_ZONE;


    movement.left =
        joystickX <
        -DEAD_ZONE;


    movement.right =
        joystickX >
        DEAD_ZONE;

}


/* ==================================================
   停止搖桿
================================================== */

function stopJoystick() {

    joystickPointerId =
        null;


    joystickActive =
        false;


    joystickX =
        0;


    joystickY =
        0;


    movement.forward =
        false;


    movement.back =
        false;


    movement.left =
        false;


    movement.right =
        false;


    joystickBase.classList.remove(
        "active"
    );


    joystickKnob.style.transform =
        "translate(-50%, -50%)";

}


/* ==================================================
   搖桿控制
================================================== */

function setupJoystick() {


    joystickBase.addEventListener(

        "pointerdown",

        function(event) {

            event.preventDefault();

            event.stopPropagation();


            if (
                joystickPointerId !==
                null
            )
                return;


            joystickPointerId =
                event.pointerId;


            joystickActive =
                true;


            joystickBase.classList.add(
                "active"
            );


            try {

                joystickBase.setPointerCapture(
                    event.pointerId
                );

            }

            catch (error) {}


            updateJoystick(

                event.clientX,
                event.clientY

            );

        },

        {
            passive:
                false
        }

    );


    joystickBase.addEventListener(

        "pointermove",

        function(event) {

            if (
                !joystickActive ||
                event.pointerId !==
                joystickPointerId
            )
                return;


            event.preventDefault();

            event.stopPropagation();


            updateJoystick(

                event.clientX,
                event.clientY

            );

        },

        {
            passive:
                false
        }

    );


    joystickBase.addEventListener(

        "pointerup",

        function(event) {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;


            event.preventDefault();

            event.stopPropagation();


            stopJoystick();

        },

        {
            passive:
                false
        }

    );


    joystickBase.addEventListener(

        "pointercancel",

        function(event) {

            if (
                event.pointerId !==
                joystickPointerId
            )
                return;


            event.preventDefault();

            event.stopPropagation();


            stopJoystick();

        },

        {
            passive:
                false
        }

    );


    joystickBase.addEventListener(

        "lostpointercapture",

        function() {

            if (
                joystickPointerId !==
                null
            ) {

                stopJoystick();

            }

        }

    );

}


/* ==================================================
   遊戲循環
================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        started
    ) {

        updatePlayer();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* ==================================================
   Resize
================================================== */

window.addEventListener(

    "resize",

    function() {

        if (
            !camera ||
            !renderer
        )
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);


/* ==================================================
   失去焦點
================================================== */

window.addEventListener(

    "blur",

    function() {

        stopJoystick();


        activeTouches.clear();


        touchMode =
            "none";


        lookPointerId =
            null;


        looking =
            false;

    }

);

</script>
