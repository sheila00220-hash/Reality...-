<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Reality...?</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    font-family: Arial, "Noto Sans TC", sans-serif;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
}

.screen.active {
    display: block;
}

/* =========================
   開始畫面
========================= */

#title {
    background: #000;
    color: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

#title h1 {
    font-size: clamp(45px, 13vw, 100px);
    font-weight: 300;
    letter-spacing: 8px;
}

.warning {
    width: min(90%, 650px);
    line-height: 1.8;
    color: #ddd;
    font-size: 14px;
}

button {
    margin-top: 20px;
    padding: 14px 28px;

    background: transparent;
    color: white;

    border: 1px solid white;

    font-size: 17px;
}

/* =========================
   第一章
========================= */

#chapter1 {
    background: #aaa79f;
}

#threeContainer {
    position: absolute;
    inset: 0;
}

/* =========================
   操作提示
========================= */

#hint {
    position: absolute;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    color: rgba(0,0,0,.45);

    font-size: 13px;

    pointer-events: none;
}

/* =========================
   移動按鈕
========================= */

#controls {

    position: absolute;

    left: 18px;
    bottom: 20px;

    width: 180px;
    height: 120px;

    z-index: 20;
}

.control {

    position: absolute;

    width: 52px;
    height: 52px;

    border-radius: 8px;

    border: 1px solid rgba(255,255,255,.35);

    background: rgba(0,0,0,.28);

    color: white;

    font-size: 24px;

    display: flex;
    justify-content: center;
    align-items: center;

    user-select: none;
}

.forward {
    left: 64px;
    top: 0;
}

.left {
    left: 8px;
    top: 58px;
}

.back {
    left: 64px;
    top: 58px;
}

.right {
    left: 120px;
    top: 58px;
}

</style>
</head>

<body>

<div id="game">

<!-- =========================
     開始畫面
========================= -->

<section id="title" class="screen active">

    <h1>Reality...?</h1>

    <div class="warning">

        <p>內容提示</p>

        <p>
        本作品包含心理恐怖、令人不安的聲音與視覺表現，
        以及可能引起部分玩家不適的成人向主題。
        </p>

        <p>
        部分內容可能涉及敏感議題。
        </p>

        <p>
        若你容易受到心理壓迫、強烈聲音或失真畫面的影響，
        請自行斟酌是否遊玩。
        </p>

        <p>
        你可以隨時離開遊戲。
        </p>

    </div>

    <button onclick="startGame()">
        開始你的旅程
    </button>

</section>


<!-- =========================
     第一章 3D 房間
========================= -->

<section id="chapter1" class="screen">

    <div id="threeContainer"></div>

    <div id="hint">
        滑動畫面轉動視角
    </div>

    <div id="controls">

        <div class="control forward"
             data-move="forward">
            ↑
        </div>

        <div class="control left"
             data-move="left">
            ←
        </div>

        <div class="control back"
             data-move="back">
            ↓
        </div>

        <div class="control right"
             data-move="right">
            →
        </div>

    </div>

</section>


</div>


<!-- =========================
     Three.js
========================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* ========================================
   全域變數
======================================== */

let scene;
let camera;
let renderer;

let eyes = [];

let player = {
    x: 0,
    y: 1.7,
    z: 0
};

let yaw = 0;
let pitch = 0;

let move = {
    forward: false,
    back: false,
    left: false,
    right: false
};


/* ========================================
   開始
======================================== */

function startGame() {

    document
        .getElementById("title")
        .classList.remove("active");

    document
        .getElementById("chapter1")
        .classList.add("active");

    init3D();
}


/* ========================================
   建立 3D 世界
======================================== */

function init3D() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0xaaa79f);


    /* -------------------------
       相機
    ------------------------- */

    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.1,
            100
        );

    camera.position.set(
        player.x,
        player.y,
        player.z
    );


    /* -------------------------
       Renderer
    ------------------------- */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.5
        )
    );

    renderer.shadowMap.enabled = true;

    document
        .getElementById("threeContainer")
        .appendChild(
            renderer.domElement
        );


    /* ==================================
       房間光線
    ================================== */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.4
        );

    scene.add(ambient);


    const light =
        new THREE.PointLight(
            0xffffff,
            15,
            35
        );

    light.position.set(
        0,
        7,
        0
    );

    scene.add(light);


    /* ==================================
       建立房間
    ================================== */

    createRoom();


    /* ==================================
       眼睛
    ================================== */

    loadEyes();


    /* ==================================
       手機控制
    ================================== */

    setupTouch();
    setupButtons();


    animate();
}


/* ========================================
   建立真正的六面房間
======================================== */

function createRoom() {

    const width = 20;
    const height = 10;
    const depth = 20;


    /* -------------------------
       材質
    ------------------------- */

    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xbdbab1,
            roughness: 0.9,
            metalness: 0
        });


    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x8f8c85,
            roughness: 1
        });


    const ceilingMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xd6d3ca,
            roughness: 1
        });


    /* -------------------------
       前牆
    ------------------------- */

    createPlane(
        width,
        height,
        wallMaterial,
        0,
        height / 2,
        -depth / 2,
        0,
        0
    );


    /* -------------------------
       後牆
    ------------------------- */

    createPlane(
        width,
        height,
        wallMaterial,
        0,
        height / 2,
        depth / 2,
        0,
        Math.PI
    );


    /* -------------------------
       左牆
    ------------------------- */

    createPlane(
        depth,
        height,
        wallMaterial,
        -width / 2,
        height / 2,
        0,
        0,
        Math.PI / 2
    );


    /* -------------------------
       右牆
    ------------------------- */

    createPlane(
        depth,
        height,
        wallMaterial,
        width / 2,
        height / 2,
        0,
        0,
        -Math.PI / 2
    );


    /* -------------------------
       地板
    ------------------------- */

    const floor =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                depth
            ),
            floorMaterial
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.position.y = 0;

    scene.add(floor);


    /* -------------------------
       天花板
    ------------------------- */

    const ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                depth
            ),
            ceilingMaterial
        );

    ceiling.rotation.x =
        Math.PI / 2;

    ceiling.position.y =
        height;

    scene.add(ceiling);


    /* -------------------------
       地板格線
       幫助玩家看出空間
    ------------------------- */

    const grid =
        new THREE.GridHelper(
            20,
            20,
            0x77746d,
            0x9b9891
        );

    grid.position.y = 0.01;

    scene.add(grid);

}


/* ========================================
   建立牆
======================================== */

function createPlane(
    width,
    height,
    material,
    x,
    y,
    z,
    rotX,
    rotY
) {

    const geometry =
        new THREE.PlaneGeometry(
            width,
            height
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.rotation.x = rotX;
    mesh.rotation.y = rotY;

    scene.add(mesh);

}


/* ========================================
   載入你的眼睛
======================================== */

function loadEyes() {

    const loader =
        new THREE.TextureLoader();


    loader.load(

        "1787057220627-removebg-preview.png",

        function(texture) {

            /*
             * 每面先放 15 隻
             */

            createEyesOnWall(
                "front",
                texture
            );

            createEyesOnWall(
                "back",
                texture
            );

            createEyesOnWall(
                "left",
                texture
            );

            createEyesOnWall(
                "right",
                texture
            );

            createEyesOnFloor(
                texture
            );

            createEyesOnCeiling(
                texture
            );

        },

        undefined,

        function(error) {

            console.log(
                "找不到眼睛圖片：",
                error
            );

        }
    );

}


/* ========================================
   牆上的眼睛
======================================== */

function createEyesOnWall(
    side,
    texture
) {

    for(let i = 0; i < 15; i++) {

        const material =
            new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });

        const eye =
            new THREE.Sprite(material);


        let x = 0;
        let y = 0;
        let z = 0;


        if(side === "front") {

            x =
                Math.random() * 18 - 9;

            y =
                Math.random() * 8 + 1;

            z = -9.95;

        }


        if(side === "back") {

            x =
                Math.random() * 18 - 9;

            y =
                Math.random() * 8 + 1;

            z = 9.95;

        }


        if(side === "left") {

            x = -9.95;

            y =
                Math.random() * 8 + 1;

            z =
                Math.random() * 18 - 9;

        }


        if(side === "right") {

            x = 9.95;

            y =
                Math.random() * 8 + 1;

            z =
                Math.random() * 18 - 9;

        }


        eye.position.set(
            x,
            y,
            z
        );


        const size =
            0.7 +
            Math.random() * 0.9;

        eye.scale.set(
            size,
            size * 0.65,
            1
        );


        scene.add(eye);

        eyes.push(eye);

    }

}


/* ========================================
   地板眼睛
======================================== */

function createEyesOnFloor(texture) {

    for(let i = 0; i < 15; i++) {

        const material =
            new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });

        const eye =
            new THREE.Sprite(material);


        eye.position.set(
            Math.random() * 18 - 9,
            0.04,
            Math.random() * 18 - 9
        );


        const size =
            0.7 +
            Math.random() * 0.8;

        eye.scale.set(
            size,
            size * 0.65,
            1
        );


        scene.add(eye);

        eyes.push(eye);

    }

}


/* ========================================
   天花板眼睛
======================================== */

function createEyesOnCeiling(texture) {

    for(let i = 0; i < 15; i++) {

        const material =
            new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });

        const eye =
            new THREE.Sprite(material);


        eye.position.set(
            Math.random() * 18 - 9,
            9.96,
            Math.random() * 18 - 9
        );


        const size =
            0.7 +
            Math.random() * 0.8;

        eye.scale.set(
            size,
            size * 0.65,
            1
        );


        scene.add(eye);

        eyes.push(eye);

    }

}


/* ========================================
   所有眼睛看著玩家
======================================== */

function updateEyes() {

    for(
        let i = 0;
        i < eyes.length;
        i++
    ) {

        eyes[i].lookAt(
            camera.position
        );

    }

}


/* ========================================
   手機滑動
======================================== */

let touching = false;

let lastX = 0;
let lastY = 0;


function setupTouch() {

    const canvas =
        renderer.domElement;


    canvas.addEventListener(
        "touchstart",
        function(event) {

            touching = true;

            lastX =
                event.touches[0].clientX;

            lastY =
                event.touches[0].clientY;

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchmove",
        function(event) {

            if(!touching)
                return;

            event.preventDefault();


            const x =
                event.touches[0].clientX;

            const y =
                event.touches[0].clientY;


            const dx =
                x - lastX;

            const dy =
                y - lastY;


            yaw -= dx * 0.004;

            pitch -= dy * 0.004;


            pitch =
                Math.max(
                    -1.4,
                    Math.min(
                        1.4,
                        pitch
                    )
                );


            lastX = x;
            lastY = y;

        },
        {
            passive: false
        }
    );


    canvas.addEventListener(
        "touchend",
        function() {

            touching = false;

        }
    );

}


/* ========================================
   移動按鈕
======================================== */

function setupButtons() {

    document
        .querySelectorAll(".control")
        .forEach(button => {

            const direction =
                button.dataset.move;


            button.addEventListener(
                "touchstart",
                function(event) {

                    event.preventDefault();

                    move[direction] = true;

                }
            );


            button.addEventListener(
                "touchend",
                function(event) {

                    event.preventDefault();

                    move[direction] = false;

                }
            );

        });

}


/* ========================================
   玩家移動
======================================== */

function updatePlayer() {

    const speed = 0.055;


    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);


    if(move.forward) {

        player.x +=
            forwardX * speed;

        player.z +=
            forwardZ * speed;

    }


    if(move.back) {

        player.x -=
            forwardX * speed;

        player.z -=
            forwardZ * speed;

    }


    if(move.left) {

        player.x -=
            Math.cos(yaw) * speed;

        player.z -=
            Math.sin(yaw) * speed;

    }


    if(move.right) {

        player.x +=
            Math.cos(yaw) * speed;

        player.z +=
            Math.sin(yaw) * speed;

    }


    /* 防止穿牆 */

    player.x =
        Math.max(
            -8.5,
            Math.min(
                8.5,
                player.x
            )
        );


    player.z =
        Math.max(
            -8.5,
            Math.min(
                8.5,
                player.z
            )
        );


    camera.position.set(
        player.x,
        player.y,
        player.z
    );


    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}


/* ========================================
   遊戲循環
======================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateEyes();


    renderer.render(
        scene,
        camera
    );

}


/* ========================================
   螢幕大小
======================================== */

window.addEventListener(
    "resize",
    function() {

        if(!camera || !renderer)
            return;


        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
